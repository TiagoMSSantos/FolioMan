name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}    # let it be run on demand from the Actions tab

# NO `schedule:`. Every job below already runs on push and PR — none of them was ever gated behind
# `if: github.event_name == 'schedule'` — so the nightly cron added a second daily run of the same
# thing and nothing else. The rule this file now keeps is that a push runs the WHOLE suite and gets
# an answer in minutes, rather than some checks arriving the next morning.
# What that costs, stated rather than buried: `audit` no longer catches a newly-published RustSec
# advisory on a quiet day. It still runs on every push and PR; it just needs a push to run.

# Tame flaky crates.io fetches. The "[16] Error in the HTTP2 framing layer" curl failure is HTTP/2
# multiplexing choking mid-download; CARGO_HTTP_MULTIPLEXING=false forces HTTP/1.1 and dodges it.
# CARGO_NET_RETRY bumps cargo's own retry (default 3) so a transient blip self-heals instead of
# failing the job. (Cargo.lock is committed — versions are pinned — but cache-miss jobs still
# download every crate, so the retry hardening stays.) Every cargo invocation passes --locked:
# a Cargo.toml/Cargo.lock mismatch is a hard red instead of a silent re-resolve that would build
# a dependency tree nobody reviewed.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# A newer run of the same ref supersedes an in-flight one — cancel it instead of finishing a stale
# commit's 45-min backtest-gate. Per-ref group: a PR only cancels its own previous run, never main's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: every job gets read-only checkout access and nothing else. cleanup-runs
# is the one job that needs more and overrides this with its own `actions: write` block.
permissions:
  contents: read

# note: ubuntu-latest ships a stable Rust toolchain, so no install step needed.
# rust-cache with a shared key: all jobs restore ONE common warm cache from prior runs
# (deps compiled once, not N×). Parallel jobs can't share THIS run's cache — GitHub saves it
# at job end — so cross-run reuse is the win; within-run hand-off would require `needs: build`.
# timeout-minutes on every job (round 63): without one, a wedged cargo fetch or a hung live API
# read burns the 6-hour default runner ceiling. Values are ~3-4x the warm-cache norm so only a
# genuine hang trips them, never a slow day.
jobs:
  # Workflow linter: this file changes often and its bugs surface at RUN time (a bad expression,
  # a wrong needs:, a misnamed key) — actionlint catches them at PR time in seconds. Installed via
  # the project's own download script (the documented CI usage): actionlint is a Go tool, so the
  # Rust-centric taiki-e/install-action can't serve it (not in its manifest, and the cargo-binstall
  # fallback fails — it's not a crate).
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all jobs (across runs)
      - run: cargo build --locked --verbose

  # lint gate. clippy -D warnings turns every lint into an error (needless clone, dead code,
  # unwrap-heavy footguns…). NO `cargo fmt --check`: this codebase keeps a deliberate dense style
  # (single-line method chains, aligned trailing comments) that rustfmt-default would explode across
  # hundreds of lines — cosmetic churn, no bug caught. clippy stays; it finds real defects.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all jobs
      - run: cargo clippy --locked --all-targets -- -D warnings

  # RustSec advisory gate: a networked CLI whose whole job is fetching remote payloads should not
  # sit on a dependency with a known CVE. Audits the COMMITTED Cargo.lock — the exact resolution
  # every job builds — so a red is always about the tree we actually ship, deterministically.
  # BLOCKING: an advisory in the tree is a real defect. Runs on every push and PR (it has no `if:`),
  # so no commit ever lands on a tree with a known CVE. Escape hatch if an advisory
  # is ever unfixable (no patched release, not exploitable here): commit an `audit.toml` with an
  # `[advisories] ignore = ["RUSTSEC-..."]` entry and a comment saying why.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all jobs (across runs)
      - run: cargo test --locked --lib   # in-module #[cfg(test)] unit tests

  # Coverage gate. The numbers steer where the next tests are worth writing AND enforce a floor:
  # COVERAGE_MIN is a no-regression ratchet — line coverage below it fails the job (BLOCKING; the
  # continue-on-error escape hatch is gone). Absolute floor, not a per-PR diff: `--fail-under-lines`
  # trips when total line % drops under COVERAGE_MIN, so a deleted test or an untested new path reds.
  # Ratchet it UP as coverage climbs (never down) — read the "TOTAL" line % off this job's step
  # summary and bump COVERAGE_MIN just under it. A true "dropped vs the base commit" per-PR diff needs
  # a stored baseline; Codecov's project status does exactly that (costs a CODECOV_TOKEN + upload).
  # Summary table + HTML land even on a red (if: always()) so you can see WHICH lines fell.
  # Own cache key: llvm-cov builds with -C instrument-coverage, so its target artifacts must not
  # poison the shared plain-build cache the other jobs restore.
  # Scope: lib unit tests + tests/cli.rs. cli.rs drives the COMPILED binary via CARGO_BIN_EXE_folioman,
  # and cargo-llvm-cov instruments that binary too — so main.rs dispatch, arg parsing and the `trade`
  # confirm guards are counted (they read as 0% under a bare --lib).
  # Target scope is EXPLICIT (--lib --test cli) to keep this job fully OFFLINE. It used to come free:
  # tests/network.rs was #[ignore]d, so a bare llvm-cov never ran it. Those nets are unguarded now, and
  # an online coverage job would make the ratchet below flap on the weather — a Yahoo outage covers the
  # skip arms instead of the parse arms, TOTAL moves, and a BLOCKING gate reds for a reason that has
  # nothing to do with the commit. Naming the targets keeps the number deterministic.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_MIN: "80"   # ARMED floor. Measured line coverage 83.90% (2026-08-09, config-less, at the scope below). Ratchet UP as tests grow; never lower it. Read the current "TOTAL" line % off this job's step summary.
      # The scope below is load-bearing for THIS number: without --test backtest_fixture the same tree
      # measures 79.20% and the job fails the floor it was set against.
      # History, because the gap is the lesson: this sat at 62 against a 63.23% measurement from
      # 2026-07-13 and was never moved, while actual coverage drifted to 73.13% — eleven points of
      # slack, i.e. ~2000 covered lines could have been deleted with the gate still green. A floor
      # that is not re-measured stops being a floor. Measure it the way this job does before moving it:
      #   FOLIOMAN_CONFIG=/nonexistent/none.yaml cargo llvm-cov --locked --lib --test cli --test backtest_fixture --summary-only
      # (the FOLIOMAN_CONFIG spelling reproduces THIS job's config-less state — config/settings.yaml is
      # gitignored, so a local run with one present measures a tree CI does not have.)
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-coverage   # instrumented build — kept apart from folioman-ci
      - name: coverage — lib + integration + binary dispatch (floor-gated)
        run: |
          # collect + HTML + the floor gate in one shot; --fail-under-lines is the LAST check, so the
          # HTML/profdata are already written when it trips. Capture its exit (|| guards `set -e`) so the
          # summary still lands on a red — that's exactly when you need to see which lines fell.
          #
          # --test backtest_fixture is in scope because integration-tests ALREADY runs it on every push:
          # leaving it out did not make the number stricter, it made it wrong, hiding ~860 lines of
          # commands/backtest.rs that CI executes anyway (53.87% -> 81.75% the moment it was counted).
          # It is safe here for the same reason it is safe there — FOLIOMAN_OFFLINE, frozen fixture data,
          # deterministic goldens. tests/network.rs stays OUT: it makes live calls.
          cargo llvm-cov --locked --lib --test cli --test backtest_fixture --html --fail-under-lines "${COVERAGE_MIN}" || gate=$?
          {
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
            echo "Floor (COVERAGE_MIN): ${COVERAGE_MIN}% lines — job fails if TOTAL drops below (0 = unarmed)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${gate:-0}"
      - uses: actions/upload-artifact@v7
        if: always()   # keep the browsable HTML even when the floor gate reds — that's when you need it
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14

  # Everything under tests/ — INCLUDING the live API drift nets in tests/network.rs, which stopped being
  # #[ignore]d and now run here (the separate network-smoke job they used to need is gone; its
  # `-- --ignored` filter would have quietly reduced it to a no-op once nothing was ignored any more).
  #
  # So this job is online, and BLOCKING is still the right call: the nets self-classify (see
  # tests/network.rs) — a 429/5xx/transport hiccup SKIPS green, only a 200-OK-but-broken response
  # FAILS — so the only way this reds is a real regression, API drift or broken code.
  #
  # --nocapture because skip reasons print to stderr, which cargo test swallows on a pass: without it a
  # net that has been silently skipping for months looks identical in the log to one that is asserting.
  # FOLIOMAN_CONFIG because config/settings.yaml is gitignored (private ntfy topic) — point config::load()
  # at the checked-in, secret-free fixture.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all jobs (across runs)
      - name: integration + live API drift nets (skip-on-throttle, fail-on-drift)
        # `--test '*'` also picks up backtest_edge_holds, which no longer carries #[ignore]. It
        # green-skips HERE — debug profile, and a runner has no persisted .long_history_cache.json —
        # which is what keeps this job inside 25 min. The backtest-gate job below forces it to run.
        # The same glob is what runs backtest_fixture (the frozen-data golden pin, ~24s in debug, and
        # the only end-to-end net over real data). Do NOT replace this glob with an explicit list: a
        # new tests/*.rs file joins no job on its own, so the glob is the thing that keeps them wired.
        run: FOLIOMAN_CONFIG=tests/ci-settings.yaml cargo test --locked --test '*' -- --nocapture

  # Walk-forward gate. Runs the REAL `backtest {20,12,8} universe` over the live universe and checks the
  # shipped tuning still yields a POSITIVE validated edge AND a positive top-3 held book. Runs on
  # push/PR + manual dispatch. The wide fetch is slow and drifts by the day, so this is
  # NON-blocking by design: same skip-vs-fail contract as the drift nets — a throttle (nonzero exit /
  # <500 tickers resolved) SKIPS green, only a genuine COLLAPSE (GROWTH edge <= 0, top-3 excess <= 0, or
  # both out-of-sample halves negative) FAILS. So a red is never the market, only broken code/tuning.
  # ci-settings.yaml mirrors the real settings.yaml `buy_heuristic`, so the gate scores with the tuning
  # actually shipped. FOLIOMAN_BACKTEST_GATE=1 means FORCE, not opt-in: the test skips itself on a debug
  # build or a cold history cache, and a runner is always both, so without the flag this job would skip
  # too and the gate would quietly stop gating.
  #
  # THREE HORIZONS, ONE FETCH. SHIP RULE v2 grades top-3 at 20y and 8y with 12y as the consistency read,
  # so gating only 12y guarded a lane the rule does not vote on. All three are >= 8y, which takes the
  # MONTHLY path and shares one .long_history_cache.json — the first run pays the wide fetch, the other
  # two read it off disk (~127s each). That is why this costs ~+4 min and not 3x. Do not collapse it
  # back to a single run to "save time"; the saving is small and the coverage loss is the whole point.
  backtest-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # cold release build + one wide-universe fetch + three walk-forward horizons
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # same warm cache as the other jobs
      - name: walk-forward edge gate (skip-on-throttle, fail-on-collapse)
        # no `--ignored`: with #[ignore] gone that filter selects NOTHING and the job becomes a silent
        # no-op — the same trap that killed network-smoke.
        run: FOLIOMAN_CONFIG=tests/ci-settings.yaml FOLIOMAN_BACKTEST_GATE=1 cargo test --locked --release --test network backtest_edge_holds -- --nocapture

  # MUTATION GATE — "is the code you just wrote actually covered", asked of the diff and nothing else.
  #
  # The suite reports whether tests PASS. It cannot report whether they would NOTICE a change, and the
  # difference is not academic here: a measured audit of this repo found `tuning_fingerprint`,
  # `read_verdict`, `write_verdict` and the WHOLE of `backtest`'s argument parser could each be
  # replaced with a stub and every test, including six frozen-data goldens, stayed green. cargo-mutants
  # makes exactly those edits and fails if the suite sleeps through them.
  #
  # WHY --in-diff AND NOT A SHARD. Grading the whole backtest module is ~944 mutants at ~16s each —
  # hours, so it can only ever be a slice, and a FIXED slice re-proves the same lines on every push
  # while never reaching the rest. `--in-diff` grades the lines this push actually touched: a docs-only
  # commit costs seconds, a real one costs minutes (measured locally: a 1114-line commit = 26 mutants,
  # ~7 min; a 3-commit span = 90). Cost tracks the change, and the gate means something specific —
  # code you add has to be killed by tests you add with it.
  #
  # fetch-depth: 0 because the default shallow clone has no base commit to diff against.
  # --baseline skip because unit-tests and integration-tests above already prove the tree is green;
  # re-proving it here would cost a full build+test per run for nothing.
  #
  # `needs:` is what MAKES that sentence true. It was an assumption before, and jobs run in parallel,
  # so it was false: on 04a74e4 the killing suite panicked in 5 tests and this gate still reported
  # "7 caught, 0 missed" and went GREEN. cargo-mutants scores a mutant CAUGHT when the suite FAILS, so
  # a suite that fails unconditionally catches everything, and --baseline skip removes the one check
  # that would have refused to grade. A vacuous pass is indistinguishable from a real one — the same
  # failure class the --list guard below already argues against.
  #
  # These two jobs cover exactly the two targets graded, at zero build cost: --lib from unit-tests
  # (same config-less env this job runs in), and --test backtest_fixture from integration-tests (that
  # target sets FOLIOMAN_CONFIG on the child it spawns, so both jobs run it identically). Gating on
  # integration-tests does NOT couple this blocking gate to network weather: tests/network.rs skips
  # green on any environmental failure and never fails a probe.
  #
  # AND IT STOPS AT TWO. A verdict here can only be wrong in three ways, all already covered: the tree
  # doesn't compile (unit-tests reds, since cargo test has to build it), --lib is red (unit-tests), or
  # backtest_fixture is red (integration-tests runs --test '*'). Nothing else reaches a verdict. build
  # compiles the bin alone — strictly less than unit-tests already compiles. coverage runs --lib again
  # plus --test cli, which is not in the killing suite. lint, audit, actionlint and cleanup-runs cannot
  # make a mutant's verdict wrong at all.
  #
  # The reason to stop is not runtime — every one of those finishes inside integration-tests' ~1m20s,
  # so adding them would be nearly free. It is that `needs` SKIPS a job on failure instead of failing
  # it, so each extra dependency is one more way to LOSE the grade on a push. audit is the sharpest
  # case: it reds on third-party advisories published by someone else, which would silently stop this
  # gate from grading your commit.
  #
  # Known residual, documented rather than chased: unit-tests runs the `test` profile (inherits dev,
  # opt-level 0) while this job grades under --profile mutants (opt-level 2), so the guard proves the
  # suite green at a different opt-level than the one grading it. Both inherit dev, so debug-assertions
  # and overflow-checks are on in each; Rust permits no float reassociation and target-cpu=x86-64-v3
  # applies to both; and the goldens already pass under both profiles. Small — but it IS the same
  # assumed-not-enforced shape that made `--baseline skip` safe-looking, so it is written down.
  mutants:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    # 45, not 30, and the reason is the `--in-place` below rather than a slow day: in-place raises
    # what a minute buys by ~5x, so the same clock now grades a diff large enough to be worth
    # grading. At 30 this job could red on the timeout instead of on a survivor, which is a gate
    # failing for a reason unrelated to the code. Do not tidy it back down without re-timing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # --in-diff needs the base commit; the default depth-1 clone has no parent
      - uses: taiki-e/install-action@cargo-mutants
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # same warm cache as the other jobs
      - name: mutation gate — changed code must be covered by the suite
        env:
          # push: the commit before this one. PR: the merge base. Both can be all-zeros or empty on a
          # branch's first push, where there is no "before" — the step below falls back to HEAD^.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          git diff "${BASE}" HEAD > push.diff
          # Count first, into the summary: a slow run then reads as "big diff", not as a hang. `--list`
          # only parses, so this costs seconds.
          #
          # The error is NOT discarded, and that is deliberate. `--in-diff` hard-errors with "Diff
          # content doesn't match source file" when the diff and the tree disagree, and piping its
          # stderr to /dev/null turns that error into a count of zero — which this step would then read
          # as "nothing to grade" and PASS. A gate that goes green because its input was unreadable is
          # the same class of bug as the marker SKIPs this round set out to close, so: listing failure
          # is a RED, and only a genuine empty list is a pass.
          if ! cargo mutants --list --in-diff push.diff > mutant-list.txt 2> mutant-list.err; then
            echo "cargo mutants --list failed — grading nothing is NOT a pass:" >&2
            cat mutant-list.err >&2
            exit 1
          fi
          n=$(wc -l < mutant-list.txt)
          {
            echo '```text'
            echo "base ${BASE}"
            echo "${n} mutants in the changed lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A push that touches no Rust generates nothing to grade. That is a PASS, not an error —
          # without this guard a README-only commit would red the build.
          if [ "${n}" -eq 0 ]; then
            echo "no mutants in the diff — nothing to grade" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --lib + the frozen-data goldens are the killing suite: both are offline and deterministic.
          # network.rs is deliberately NOT in it — a mutant "surviving" because Yahoo throttled would be
          # a false red, which is the one thing a blocking gate must never produce.
          #
          # --in-place mutates the checkout instead of copying it to a scratch dir. Measured on the
          # dev box: copy mode spends 86s of its 90.7s per mutant in `rustc`, because the copied
          # target/ lands at a different path and is rebuilt from cold. In place it reuses the
          # rust-cache-restored target/ at the path it was saved from: ~19s per mutant, ~5x.
          # Concretely, this job's budget goes from grading ~20 mutants to ~140.
          # The runner checkout is throwaway, so mutating it costs nothing.
          #
          # `-j 1` is GONE because --in-place REJECTS it ("cannot be used with --jobs") — one tree
          # cannot hold two mutants at once. Serial either way, so nothing was lost.
          #
          # If this job is ever cancelled mid-build it can leave a corrupted incremental cache
          # (seen locally: `rust-lld: undefined hidden symbol: anon...llvm...` on the next build).
          # Harmless here only because Swatinem/rust-cache does not save on a failed job — if
          # `cache-on-failure` is ever turned on, a timed-out run could poison the shared cache.
          cargo mutants --in-place --in-diff push.diff --profile mutants --baseline skip \
            -- --lib --test backtest_fixture
      - uses: actions/upload-artifact@v7
        if: always()   # the survivor list is the whole point of a red — keep it
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 14

  # Actions housekeeping: each main run supersedes the history, so delete this workflow's older
  # COMPLETED runs (logs + artifacts go with them). Main-only by the `if`: a PR ref is the merge ref
  # (refs/pull/…), so PR runs neither trigger the cleanup nor lose their own history while iterating.
  # --status completed keeps any still-running run (including this one) untouched; per-id `|| true`
  # so one undeletable run never reddens the pipeline. The event-based filtering this used to do —
  # skip `schedule` runs, keep the newest 5 of them because that is where backtest-gate's re-probe
  # WARNs printed — went with the cron: there are no scheduled runs left to retain.
  #
  # CANCELLED runs (the concurrency `cancel-in-progress` kills a superseded commit's in-flight run)
  # carry no useful logs but clutter the Actions tab, and `--status completed` does NOT match them —
  # a cancelled run's status is `cancelled`, not `completed`. So sweep them in their own pass. This
  # runs on every main push, so a burst of superseded pushes is cleared on the next run to finish.
  cleanup-runs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write   # gh run delete; other jobs keep the default read-only token
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --status completed --limit 200 --json databaseId -q '.[].databaseId'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --status cancelled --limit 200 --json databaseId -q '.[].databaseId'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
