name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}    # let it be run on demand from the Actions tab

# NO `schedule:`. Every job below already runs on push and PR — none of them was ever gated behind
# `if: github.event_name == 'schedule'` — so the nightly cron added a second daily run of the same
# thing and nothing else. The rule this file now keeps is that a push runs the WHOLE suite and gets
# an answer in minutes, rather than some checks arriving the next morning.
# What that costs, stated rather than buried: `audit` no longer catches a newly-published RustSec
# advisory on a quiet day. It still runs on every push and PR; it just needs a push to run.

# Tame flaky crates.io fetches. The "[16] Error in the HTTP2 framing layer" curl failure is HTTP/2
# multiplexing choking mid-download; CARGO_HTTP_MULTIPLEXING=false forces HTTP/1.1 and dodges it.
# CARGO_NET_RETRY bumps cargo's own retry (default 3) so a transient blip self-heals instead of
# failing the job. (Cargo.lock is committed — versions are pinned — but cache-miss jobs still
# download every crate, so the retry hardening stays.) Every cargo invocation passes --locked:
# a Cargo.toml/Cargo.lock mismatch is a hard red instead of a silent re-resolve that would build
# a dependency tree nobody reviewed.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# A newer run of the same ref supersedes an in-flight one — cancel it instead of finishing a stale
# commit's integration-tests and backtest-gate. Per-ref group: a PR only cancels its own previous run,
# never main's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: every job gets read-only checkout access and nothing else. cleanup-runs
# is the one job that needs more and overrides this with its own `actions: write` block.
permissions:
  contents: read

# note: ubuntu-24.04 ships a stable Rust toolchain, so no install step needed. (#853) every
# job pins the image: probe.yml blesses the goldens that ci.yml compares, so both must run on one
# image, and ubuntu-latest rolls to a new release on its own schedule.
# rust-cache with a shared key: the test jobs restore ONE common warm cache from prior runs
# (deps compiled once, not N×). Parallel jobs can't share THIS run's cache — GitHub saves it
# at job end — so cross-run reuse is the win; within-run hand-off would require `needs: build`.
# (#353) ONE writer per key. rust-cache saves a key once, from whichever job finishes first, and
# never re-saves on an exact hit. When every job wrote `folioman-ci`, that job was lint, whose
# clippy leaves check metadata only, so build, unit-tests, unit-tests-configless and
# integration-tests each recompiled all 132 crates on every push (run 36228243075: 18.6-26.6s of
# dependency compile per job) while their logs said "full match". The gate hit the same trap in
# (#349). Now integration-tests alone writes `folioman-test` (no [dev-dependencies] exist, so its
# deps are every test job's deps) and lint keeps its check output under `folioman-lint`.
# PROVEN on 51ce484 (run 36229693691, attempt 2 warm): all four compile 1 crate, not 132. Compile
# time against run 36228243075: build 32.8s -> 15.2s, unit-tests 33.6 -> 20.2, unit-tests-configless
# 47.2 -> 23.5, integration-tests 35.2 -> 22.4. CI's wall clock does not move, because the gate is
# the tail; runner minutes do.
# (#635) CARGO_PROFILE_DEV_DEBUG=line-tables-only is set at JOB level on exactly the four jobs that
# share folioman-test: build, unit-tests, unit-tests-configless, integration-tests. Panics keep their
# file:line (compiled in, not read from debuginfo) and line tables keep any backtrace symbolized;
# only variable and type info goes, and nothing here reads it. It must be JOB level: no package
# override pins debuginfo, so it reaches every dependency's rustc flags, and rust-cache hashes
# job-level CARGO* env into its key. A step-level value leaves the key alone, so the restored
# full-debuginfo dependencies would be rebuilt on every run and never saved. The four must carry the
# SAME value too, or the odd one out looks up another key and compiles cold. Two readers outside
# this file restore folioman-test and carry it as well: mutation-census.yml at job level (its
# `[profile.mutants]` pins debug = false, so only the key moves there) and probe.yml's bless, on its
# restore step and its goldens build. Change all of them or none.
# (#838) Coverage carries it too, on folioman-coverage, a key no other job restores, so it moves
# alone. Source-based coverage reads its own mapping sections, not debuginfo, so the per-file table
# must not move. Lint, the gate and mutants have keys of their own and are unchanged. The landing
# push re-keys folioman-test once, with no restore fallback across an env change, so its four jobs
# compile dependencies cold and integration-tests saves the new key. Read the SECOND push. The
# build job's rustc lines must say `-C debuginfo=line-tables-only` (a9d2bab says `=2`), and
# rust-cache's "Cache Size" must fall below the ~400 MB it restores there (419620083 B). The
# `Finished` times swing more between runs than this saves (build 41.15s on run 38933540600,
# 18.40s on a9d2bab; integration-tests 1m 52s and 1m 17s), so one pair of them proves nothing.
# (#841) wasm carries it as well, on folioman-wasm. Its parity step builds the native lib tests, and
# its first run full-matched the key cut before that step existed. rust-cache saves nothing on a full
# match, so wasm-bindgen-cli (126s) and the native dependencies (152s) compiled cold and would have
# done so on every push until a Cargo.lock change, making wasm the slowest job at 296s against
# coverage's 222s. The env re-keys it once, so the next run saves. It leaves the release wasm build
# alone (dev profile only).
# (#354) Third-party actions are pinned to a commit SHA, the tag it was cut from in the trailing
# comment, and .github/dependabot.yml bumps them in one grouped PR a month. A moving tag runs
# whatever its owner pushes next, and pages.yml's `deploy` job runs deploy-pages holding
# `pages: write` and `id-token: write`. taiki-e/install-action installs its own manifest's tool versions, so a
# tool it installs moves only when the action's pin does.
# timeout-minutes on every job (round 63): without one, a wedged cargo fetch or a hung live API
# read burns the 6-hour default runner ceiling. Values are ~3-4x the warm-cache norm so only a
# genuine hang trips them, never a slow day.
jobs:
  # Workflow linter: this file changes often and its bugs surface at RUN time (a bad expression,
  # a wrong needs:, a misnamed key) — actionlint catches them at PR time in seconds. Installed from
  # the pinned release tarball, checked by sha256 (#885): actionlint is a Go tool, so the
  # Rust-centric taiki-e/install-action can't serve it (not in its manifest, and the cargo-binstall
  # fallback fails — it's not a crate).
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          # (#354) Pinned by version, (#885) and by sha256 from the release's own actionlint_1.7.12_checksums.txt.
          # A new check must not red an unrelated push; bump the version and the digest together on purpose.
          # (#351) 1.7.12 predates the concurrency `queue:` key mutation-census.yml uses (rhysd/actionlint#657,
          # open): ignore that one message, every other check stays on. Drop it once a release knows the key.
          ./actionlint -ignore 'unexpected key "queue" for "concurrency" section'
      # (#418) The Pages deploy gates on web/payload-contracts.jq; this proves the gate can still say no.
      # Each broken payload must FAIL it (BUY% sums to 85, a ticker in two lanes, a NaN cell, (#888) a
      # NaN in a table the scan once skipped) and the clean one — whose name contains "inf" mid-word — must pass.
      - name: Payload contracts reject broken payloads
        run: |
          for bad in \
            '{"stocks":[[["TICKER","A"],["BUY%","85%"]]]}' \
            '{"stocks":[[["TICKER","A"]]],"etfs":[[["TICKER","A"]]]}' \
            '{"stocks":[[["TICKER","A"],["PRICE","€NaN"]]]}' \
            '{"social":[[["TICKER","A"],["P/E","NaN"]]]}'; do
            if echo "$bad" | jq -e -f web/payload-contracts.jq > /dev/null; then echo "contract passed a broken payload: $bad"; exit 1; fi
          done
          echo '{"stocks":[[["TICKER","A"],["BUY%","100%"],["NAME","Infrastructure"]]]}' | jq -e -f web/payload-contracts.jq > /dev/null
      # (#430) The page's CSP meta allows no inline code, and a blocked script fails silently on the
      # live page with no red run. So index.html keeps its CSP and nothing inline: no <script> body, no
      # <style>, no style= or on…= attribute. The proof that the grep can say no runs first.
      - name: Page keeps its CSP and no inline code
        run: |
          inline() { tr '\n' ' ' < "$1" | grep -qE '<script>|<script[^>]*>[^<]|<style|style=|[[:space:]]on[a-z]+='; }
          echo '<script>x</script>' > bad.html
          inline bad.html || { echo "guard missed an inline script"; exit 1; }
          printf '<script\n  type="module">x</script>\n' > bad.html
          inline bad.html || { echo "guard missed a multi-line inline script"; exit 1; }
          rm bad.html
          if inline web/index.html; then echo "web/index.html carries inline code its CSP blocks"; exit 1; fi
          grep -q 'http-equiv="Content-Security-Policy"' web/index.html || { echo "web/index.html lost its CSP meta"; exit 1; }
      # (#421) The same proof for web/universe-contracts.jq: equities carrying every field pass; the same
      # pool with roic gone, and a pool of 50, must fail. (#424) and the pool with the split feed gone.
      # (#764) The good pool sits ON every type floor (500 equities first, then 4000 ETFs, then 60 coins), so
      # one name fewer of any type must fail. (#763) 1% of priced quotes may lack price_eur, one more may not.
      - name: Universe contract rejects thin pools
        run: |
          pool() { jq -n --argjson n "$1" --argjson roic "$2" --argjson splits "${3:-[[\"2024-07-15\",10.0]]}" '{quotes: ([range($n) | {instrument_type: "EQUITY", close_native: 205, price_eur: 1, splits: $splits, fund: {eps_ttm: 1, net_debt: 1, peg_yield: 1, roic: $roic, core_factor: 0.9}}] + [range(4000) | {instrument_type: "ETF"}] + [range(60) | {instrument_type: "CRYPTOCURRENCY"}])}'; }
          pool 500 1 | jq -e -f web/universe-contracts.jq > /dev/null
          if pool 500 null | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed a pool with no roic"; exit 1; fi
          if pool 50 1 | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed a 50-equity pool"; exit 1; fi
          if pool 499 1 | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed 499 equities"; exit 1; fi
          if pool 500 1 | jq 'del(.quotes[500])' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed 3999 ETFs"; exit 1; fi
          if pool 500 1 | jq 'del(.quotes[-1])' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed 59 coins"; exit 1; fi
          pool 500 1 | jq '.quotes[range(5)].price_eur = null' | jq -e -f web/universe-contracts.jq > /dev/null
          if pool 500 1 | jq '.quotes[range(6)].price_eur = null' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed 6 of 500 priced quotes with no EUR price"; exit 1; fi
          if pool 500 1 '[]' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed a pool with no splits"; exit 1; fi
          pool 500 1 | jq '(.quotes[] | select(.fund) | .fund.shares_ttm) = 1e8' | jq -e -f web/universe-contracts.jq > /dev/null
          pool 500 1 | jq '.quotes[0].fund.shares_ttm = 322000000 | .quotes[0].close_native = 1.79' | jq -e -f web/universe-contracts.jq > /dev/null  # (#501) HTZ, a real $576M cap
          if pool 500 1 | jq '.quotes[0].fund.shares_ttm = 716.4' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed a share count tagged in millions"; exit 1; fi
          if pool 500 1 | jq '.quotes[0].fund.core_factor = 1.5' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed a core strip that added earnings"; exit 1; fi
          if pool 500 1 | jq 'del(.quotes[].fund.core_factor)' | jq -e -f web/universe-contracts.jq > /dev/null; then echo "contract passed a pool with no core factor"; exit 1; fi
      # (#637) automerge.yml's `need` list is typed by hand and drifts both ways: a job added above and left
      # out of it lets a bot PR merge while that job is red, and an entry no job reports (a rename) idles
      # every bot PR for good. The script compares the two; the files as committed must pass, and each drift
      # below must fail it with the culprit named (a crash names nothing, so it cannot pass for a refusal).
      - name: Automerge waits on every CI job
        run: |
          cd .github/workflows
          guard() { python3 -I ../scripts/automerge-need.py "$1" "$2" codeql.yml 2>&1; }
          guard ci.yml automerge.yml
          t=$(mktemp -d)
          { cat ci.yml; printf '\n  zzz-new-gate:\n    runs-on: ubuntu-latest\n'; } > "$t/ci.yml"
          if out=$(guard "$t/ci.yml" automerge.yml); then echo "guard passed a CI job automerge does not wait on"; exit 1; fi
          grep -q zzz-new-gate <<<"$out" || { echo "guard failed without naming the new job: $out"; exit 1; }
          sed 's/\(need=.\[\)"[^"]*"/\1"zzz-renamed"/' automerge.yml > "$t/automerge.yml"
          if out=$(guard ci.yml "$t/automerge.yml"); then echo "guard passed a need entry no job reports"; exit 1; fi
          grep -q zzz-renamed <<<"$out" || { echo "guard failed without naming the renamed entry: $out"; exit 1; }
      # (#855) The mutation gate's picker on made-up lists, budget 6. Tiered: 2 struct-field, 3 other and
      # 5 fn-value mutants over two files must grade 3 + 3, with the same picks on both legs: every other
      # mutant and one fn-value (the struct-field pair rides along unfiltered). Six struct-field mutants
      # fill the budget, so the legs fall back to halves of the old shard 1/2. One mutant leaves leg 1
      # nothing, and an empty list (a diff with no Rust) grades nothing on either leg.
      - name: Mutation gate picks the kinds that survive
        run: |
          p=.github/scripts/mutants-pick.py
          t=$(mktemp -d)
          mk() { jq -n '$ARGS.positional | to_entries | map({name: "m\(.key)", file: (.value | split(":")[0]), genre: (.value | split(":")[1])})' --args "$@"; }
          legs() { python3 -I "$p" 6 0 < "$1" > "$t/0" && python3 -I "$p" 6 1 < "$1" > "$t/1" && echo "$(head -1 "$t/0") $(head -1 "$t/1")"; }
          mk a:StructField a:StructField a:BinaryOperator b:BinaryOperator b:UnaryOperator b:FnValue b:FnValue b:FnValue b:FnValue b:FnValue > "$t/l.json"
          [ "$(legs "$t/l.json")" = "3 3" ] || { echo "tiered legs did not grade 3 + 3:"; cat "$t/0" "$t/1"; exit 1; }
          [ "$(sed -n '/^-F$/{n;p}' "$t/0" | tr '\n' ' ')" = '^m2$ ^m3$ ^m4$ ^m5$ ' ] || { echo "tiered picks are not the 3 others and 1 fn-value:"; cat "$t/0"; exit 1; }
          cmp <(grep -A1 -x -- -F "$t/0") <(grep -A1 -x -- -F "$t/1") || { echo "the legs picked different mutants"; exit 1; }
          mk a:StructField a:StructField a:StructField a:StructField a:StructField a:StructField a:BinaryOperator b:BinaryOperator b:FnValue > "$t/l.json"
          if [ "$(legs "$t/l.json")" != "2 2" ] || ! grep -qx 1/4 "$t/0" || ! grep -qx 3/4 "$t/1"; then echo "full struct fields did not fall back to halves of shard 1/2:"; cat "$t/0" "$t/1"; exit 1; fi
          mk a:FnValue > "$t/l.json"
          [ "$(legs "$t/l.json")" = "1 0" ] || { echo "one mutant did not go to leg 0 alone:"; cat "$t/0" "$t/1"; exit 1; }
          : > "$t/l.json"
          [ "$(legs "$t/l.json")" = "0 0" ] || { echo "an empty list graded something:"; cat "$t/0" "$t/1"; exit 1; }
      # (#637) pages.yml's `record` job appends the run's last journal line only when it is dated after main's
      # last one (#605). That test is .github/scripts/journal-newer-line.sh, which the job sources, so it runs
      # here the same way (under `bash -e`) on throwaway journals: an edit that copies the run's file, appends
      # a stale line, or lets an unchanged day fall through to the commit reds this step instead of silently
      # reverting the forward record. The script is shellchecked here too: actionlint reads only `run:` bodies.
      - name: Journal record appends only a newer line
        run: |
          shellcheck .github/scripts/journal-newer-line.sh
          s=$PWD/.github/scripts/journal-newer-line.sh
          t=$(mktemp -d)
          j() { local a d; read -ra a <<<"$1"; for d in "${a[@]}"; do printf '{"date":"%s"}\n' "$d"; done; }
          try() { # NAME "main dates" "run dates" "main dates after" "output"; main "-" = no file
            mkdir -p "$t/$1/run-journal"; cd "$t/$1" || exit 1
            [ "$2" = - ] || j "$2" > .screen_snapshots.jsonl
            j "$3" > run-journal/.screen_snapshots.jsonl
            got=$(bash -e -c '. "$0"; echo "day=$day"' "$s" 2>"$t/err") || { echo "$1: exited non-zero:"; cat "$t/err"; exit 1; }
            [ "$got" = "$5" ] || { echo "$1: printed '$got', wanted '$5'; stderr:"; cat "$t/err"; exit 1; }
            cmp -s .screen_snapshots.jsonl <(j "$4") || { echo "$1: main's journal is wrong:"; cat .screen_snapshots.jsonl; exit 1; }
          }
          try newer "2026-10-14 2026-10-15" "2026-10-10 2026-10-16" "2026-10-14 2026-10-15 2026-10-16" "day=2026-10-16"
          try same "2026-10-14 2026-10-15 2026-10-16" "2026-10-10 2026-10-16" "2026-10-14 2026-10-15 2026-10-16" "journal unchanged: main already ends at 2026-10-16 (this run's last line: 2026-10-16)"
          try older "2026-10-14 2026-10-15 2026-10-16" "2026-10-10 2026-10-15" "2026-10-14 2026-10-15 2026-10-16" "journal unchanged: main already ends at 2026-10-16 (this run's last line: 2026-10-15)"
          try empty "" "2026-10-16" "2026-10-16" "day=2026-10-16"
          try missing - "2026-10-16" "2026-10-16" "day=2026-10-16"
          bad() { # (#884) NAME "run's last line": a date no run could have must fail the step and leave main's journal alone
            mkdir -p "$t/$1/run-journal"; cd "$t/$1" || exit 1
            j "2026-10-14" > .screen_snapshots.jsonl
            printf '%s\n' "$2" > run-journal/.screen_snapshots.jsonl
            if bash -e -c '. "$0"' "$s" > /dev/null 2>&1; then echo "$1: appended a line with a bad date"; exit 1; fi
            cmp -s .screen_snapshots.jsonl <(j "2026-10-14") || { echo "$1: main's journal changed:"; cat .screen_snapshots.jsonl; exit 1; }
          }
          bad future '{"date":"9999-12-31"}'
          bad nodate '{"spx":1}'
          echo "journal record: newer, same, older, empty and missing main journals all behave, a bad date is refused"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#635) job level; see the note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-test
          save-if: false   # (#353) integration-tests is the key's only writer
      - run: cargo build --locked --verbose

  # lint gate. clippy -D warnings turns every lint into an error (needless clone, dead code,
  # unwrap-heavy footguns…). NO `cargo fmt --check`: this codebase keeps a deliberate dense style
  # (single-line method chains, aligned trailing comments) that rustfmt-default would explode across
  # hundreds of lines — cosmetic churn, no bug caught. clippy stays; it finds real defects.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-lint   # (#353) clippy's check output is not a build's; lint's alone
      - run: cargo clippy --locked --all-targets -- -D warnings

  # (#390) The page's engine builds this crate for wasm32 (only config/core/picks go in). Pages
  # builds it when the source moves but must never block the site on it, so a break has to show HERE,
  # on the push that caused it: a `commands`/`fetch` import creeping into picks, or a dependency that
  # does not compile for the browser. (#392) Checks web/engine, the crate Pages builds, into ./target,
  # the only directory rust-cache keeps.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#841) job level; see the note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-wasm   # (#353) its own key and its only writer: wasm artifacts serve no other job
      - run: cargo check --locked --target wasm32-unknown-unknown --manifest-path web/engine/Cargo.toml --target-dir target
      # (#589) Build the engine and run the pinned CLI, as pages.yml does after the merge, where every
      # step is continue-on-error and a crate/CLI mismatch would only hide the page's engine. Renovate's
      # regex moves this pin in the same PR as pages.yml's and web/engine/Cargo.toml's.
      # (#841) On every push, not only the bot's PR: smoke.mjs then holds the wasm build to the native
      # one on the tied test pool, so a wasm-only drift (32-bit usize, float printing, sort order) reds
      # here before a merge instead of costing the page its upload control after one. The native side
      # runs pinned to CI's config because the engine installs exactly that.
      # (#846) The CLI as a prebuilt binary. `cargo install` compiled it on every cold cache, 126s of
      # (#841)'s first 296s run, which made wasm the slowest job on each Cargo.lock bump, and spent
      # ~10s confirming it on a warm one.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-bindgen@0.2.129   # = web/engine's pin
      - run: |
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path web/engine/Cargo.toml --target-dir target
          wasm-bindgen --target web --out-dir "${RUNNER_TEMP}/site/engine" target/wasm32-unknown-unknown/release/folioman_engine.wasm
      - run: |
          FOLIOMAN_CONFIG=tests/ci-settings.yaml PARITY_SITE="${RUNNER_TEMP}/site" \
            cargo test --locked --lib web::tests::writes_the_wasm_parity_site -- --ignored --exact
          node web/engine/smoke.mjs "${RUNNER_TEMP}/site"

  # RustSec advisory gate: a networked CLI whose whole job is fetching remote payloads should not
  # sit on a dependency with a known CVE. Audits the COMMITTED Cargo.lock — the exact resolution
  # every job builds — so a red is always about the tree we actually ship, deterministically.
  # BLOCKING: an advisory in the tree is a real defect. Runs on every push and PR (it has no `if:`),
  # so no commit ever lands on a tree with a known CVE. Escape hatch if an advisory
  # is ever unfixable (no patched release, not exploitable here): commit an `audit.toml` with an
  # `[advisories] ignore = ["RUSTSEC-..."]` entry and a comment saying why.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          # (#354) Unversioned: it follows the action's pin. If an advisory-database format change
          # reds this job before Dependabot's monthly bump, bump the action; never pin the tool back.
          tool: cargo-audit
      - run: cargo audit

  # (#171) FOLIOMAN_CONFIG for the same reason integration-tests sets it below: config/settings.yaml is
  # gitignored, so WITHOUT it config::load() resolves nothing on a runner and every knob accessor falls
  # back to its unwrap_or default. That made this the ONE job grading against UNCONFIGURED knobs while
  # every other test path (integration-tests, the backtest gate, tests/cli.rs, tests/backtest_fixture.rs)
  # pinned the fixture — so a green here proved nothing about the tuning that actually ships, and a test
  # could depend on a knob being OFF and stay green in CI while failing on every developer machine.
  # One regime everywhere is the point; do not drop this env back off.
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#635) job level; see the note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-test
          save-if: false   # (#353) integration-tests is the key's only writer
      - run: FOLIOMAN_CONFIG=tests/ci-settings.yaml cargo test --locked --lib   # in-module #[cfg(test)] unit tests

  # (#171) THE FRESH-CLONE CHECK. It used to be a side effect of unit-tests being config-less; pinning
  # that job to the fixture was right for GRADING — a green there now says something about the tuning
  # that actually ships — but it took this guard with it, so the guard moves here and gets a name.
  #
  # config/settings.yaml is gitignored: it exists on NO runner and in NO fresh clone, and
  # config::load() PANICS on an unreadable config. So a path that hard-loads the config works on a
  # developer box and dies for a new user. That is not hypothetical — it bit twice on 2026-08-09
  # (273a511, 04a74e4), when the loopback stub-server tests reached the real transport -> throttle()
  # -> config::load(); closed in 44fdb07 by pinning THROTTLE inside stub_server. The SOFT accessors
  # (use_adjusted_close, history_proxy, splice_max_weekly_rate, life_cagr_max_years) exist to survive
  # exactly this, and nothing else proves they still do.
  #
  # NOT a second tuning regime, which is the thing (#171) set out to remove: this asserts the binary
  # SURVIVES with no config at all — a compatibility check, not a measurement. No verdict about the
  # heuristic is read from it. A red here is closed by making the code tolerate a missing config,
  # NEVER by giving this job a FOLIOMAN_CONFIG; that would delete the only check of the class.
  unit-tests-configless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#635) job level; see the note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-test
          save-if: false   # (#353) integration-tests is the key's only writer
        # a path that does not exist => merged_config() returns None, exactly as when discovery finds
        # nothing. `FOLIOMAN_CONFIG=` empty is IGNORED and falls through to discovery, so that spelling
        # reproduces nothing — on a runner it finds no file either, but it would not on a dev box.
      - run: FOLIOMAN_CONFIG=/nonexistent/none.yaml cargo test --locked --lib

  # Coverage gate. The numbers steer where the next tests are worth writing AND enforce a floor:
  # COVERAGE_MIN is a no-regression ratchet — line coverage below it fails the job (BLOCKING; the
  # continue-on-error escape hatch is gone). Absolute floor, not a per-PR diff: `--fail-under-lines`
  # trips when total line % drops under COVERAGE_MIN, so a deleted test or an untested new path reds.
  # Ratchet it UP as coverage climbs (never down) — read the "TOTAL" line % off this job's step
  # summary and bump COVERAGE_MIN just under it. A true "dropped vs the base commit" per-PR diff needs
  # a stored baseline; Codecov's project status does exactly that (costs a CODECOV_TOKEN + upload).
  # Summary table + HTML land even on a red (if: always()) so you can see WHICH lines fell.
  # Own cache key: llvm-cov builds with -C instrument-coverage, so its target artifacts must not
  # poison the shared plain-build cache the other jobs restore.
  # Scope: lib unit tests + tests/cli.rs + tests/backtest_fixture.rs. cli.rs drives the COMPILED
  # binary via CARGO_BIN_EXE_folioman, and cargo-llvm-cov instruments that binary too — so main.rs
  # dispatch, arg parsing and the `trade` confirm guards are counted (they read as 0% under a bare --lib).
  # Target scope is EXPLICIT (--lib --test cli --test backtest_fixture) to keep this job fully OFFLINE.
  # It used to come free: tests/network.rs was #[ignore]d, so a bare llvm-cov never ran it. Those nets
  # are unguarded now, and an online coverage job would make the ratchet below flap on the weather — a
  # Yahoo outage covers the skip arms instead of the parse arms, TOTAL moves, and a BLOCKING gate reds
  # for a reason that has nothing to do with the commit. Naming the targets keeps the number deterministic.
  coverage:
    runs-on: ubuntu-24.04
    # (#566) 30 -> 60: the soft gates (#564) score every failer through the full gate list, waiver and
    # dock, so the instrumented fund-lane goldens went from ~3 to ~20 min (34bfee8 cancelled twice at 30).
    timeout-minutes: 60
    env:
      # (#171) The same pin unit-tests, integration-tests and the mutation gate now carry: ONE config
      # regime for every job that runs tests, so a knob is live or inert everywhere at once instead of
      # per-job. Measured cost to THIS number: 0.01pt of line coverage (89.13% config-less -> 89.12%
      # pinned, same tree, local, 2026-08-30). The knobs it makes live barely change which lines run.
      FOLIOMAN_CONFIG: tests/ci-settings.yaml
      CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#838) job level; see the note above `jobs:`
      COVERAGE_MIN: "97"   # ARMED floor (#783). Measured line coverage 97.62% on 2026-10-20 at 7109cb8, read off CI's own log (run 39427856931, job 118644849900, the "TOTAL" line: regions 97.21, functions 96.25, lines 97.62), not a local run. 97 by the rule below: 97.62 sits 0.62 above the integer, outside the ~0.2 band. PREVIOUS: 96 (#759) on 97.19% at 0b35f64 (run 39402624302) on 2026-10-20; it read 97.22% at 287e515 just before the push, and the 0.40 points between that and this are the (#780)-(#782) host seams: the Binance and Trading212 `_at` twins and `Urls.yahoo_query2`, each tested against a loopback stub. Before that: 94 (#427) on 94.42% at 06d0fa4 (run 37109845594) on 2026-10-03; it read 94.06% at c884334 before the push, and the 3.13 points between that and this are the (#759) coverage push: tests only, no production seam, plus five new fixture goldens. Before that: 93 (#365) on 93.94% at 10b9c49 (run 36254293261) on 2026-09-26; the 0.48 points between them are the tests that landed between those two commits. Before that: 92 (#363) on 92.68% at a870cd3 (run 36250536481) the same day; the 1.26 points between them are the (#364) fund-lane golden, the first test to run `backtest ... fund`. Before that: 91 (#356) on 91.51% at e75ed2b (run 36231193580) the same day; the 1.17 points between them are the (#358)/(#359) census tests, which could have vanished without a red. Before that: 88, set on a LOCAL reading of 89.12% (2026-08-30, 1fdd47a plus (#171)); by 2026-09-26 the real number was 91.51, so 3.5 points of slack had accumulated in four weeks: tests that could vanish without a red. Before that: 87 on 87.15% (2026-08-16, 352f496, run 31934809294). Ratchet UP as tests grow; never lower it. Read the current "TOTAL" line off this job's LOG (the step prints it) or its step summary.
      # The measurement's COMMIT is recorded above because its age is what makes it wrong. The 80 this
      # replaced was set against 83.90% at 5c923ae and read as "3.9 points of slack", but twelve commits
      # touching src/tests had landed since — the real number was 86.69%, so the slack was 6.7.
      # NO SUBTRACTED MARGIN, deliberately: this is line coverage over frozen fixtures with no network
      # and no randomness, so it cannot move on its own and any drop is a real regression. Rounding
      # DOWN to the whole percent is the only headroom (here 0.69pt) and it is enough. If a future
      # measurement lands just above an integer (<~0.2), take the next integer down instead — at that
      # width a local-vs-CI difference in rustc or llvm-cov codegen reds the build on nothing.
      # The scope below is load-bearing for THIS number: without --test backtest_fixture the same tree
      # measures ~4 points lower and the job fails the floor it was set against.
      # History, because the gap is the lesson: this sat at 62 against a 63.23% measurement from
      # 2026-07-13 and was never moved, while actual coverage drifted to 73.13% — eleven points of
      # slack, i.e. ~2000 covered lines could have been deleted with the gate still green. A floor
      # that is not re-measured stops being a floor. Measure it the way this job does before moving it:
      #   FOLIOMAN_CONFIG=tests/ci-settings.yaml cargo llvm-cov --locked --lib --test cli --test backtest_fixture --summary-only
      # ((#171) that spelling reproduces THIS job's env, which is now the same pin every other test job
      # carries; it read /nonexistent/none.yaml back when this job was config-less. Either way it has to
      # be spelled out — config/settings.yaml is gitignored, so a local run with one present measures a
      # tree CI does not have.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov   # (#354) follows the action's pin (0.9.1 at v2.87.20)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-coverage   # instrumented build — kept apart from folioman-test
      - name: coverage — lib + integration + binary dispatch (floor-gated)
        # (#591)-(#593) This step builds the crate at the dev profile's opt-level 0, unlike
        # integration-tests. The instrumented fund-lane goldens make it the wall (598s on 0c5394f,
        # 499s of it the goldens), but an optimised build MOVED the per-file table against 0c5394f's
        # (lines 43533/46262, 94.10%). Opt-level 2 (d46eb1e, run 38738363157, 302s): fetch.rs's two
        # never-called `_live` async fns (12 lines) left the report instead of reading uncovered, and
        # in five commands files the outer fn of `async fn run` counted as unexecuted. (#592) Plus
        # CARGO_INCREMENTAL=1 (0b08cd8, run 38743454639, 388s, build 212s against 144s): the five came
        # back, the two `_live` fns did not (lines 43533/46250). A floor whose denominator drops
        # never-called code stops seeing dead code, so both env lines came out. Retry an optimised
        # build only if it gives this table back exactly.
        run: |
          # collect + HTML + the floor gate in one shot; --fail-under-lines is the LAST check, so the
          # HTML/profdata are already written when it trips. Capture its exit (|| guards `set -e`) so the
          # summary still lands on a red — that's exactly when you need to see which lines fell.
          #
          # --test backtest_fixture is in scope because integration-tests ALREADY runs it on every push:
          # leaving it out did not make the number stricter, it made it wrong, hiding ~860 lines of
          # commands/backtest.rs that CI executes anyway (53.87% -> 81.75% the moment it was counted).
          # It is safe here for the same reason it is safe there — FOLIOMAN_OFFLINE, frozen fixture data,
          # deterministic goldens. tests/network.rs stays OUT: it makes live calls.
          #
          # (#837) The test binaries run as two concurrent collections, then one report. The single
          # `cargo llvm-cov` call ran the lib, cli and fixture binaries one after another. Splitting cli
          # off overlaps it with the lib + fixture run. `--no-report` runs skip the cleanup a full run
          # does, so neither deletes the other's profiles (the tool refuses `--no-clean` beside it).
          # The explicit `clean --workspace` first does what the one-shot run did implicitly. Their scratch
          # roots are disjoint: the lib uses target/lib-test-data, and cli and fixture cases use distinct
          # names under CARGO_TARGET_TMPDIR. PROVEN on 7d97dd1 (run 39928990392): step 266s against the
          # one-shot's 308s, job 292s against 325s (run 39847215103). Lines and functions match in every
          # file. Four regions moved, all on screen.rs's intraday `closed(market, Utc::now())` arm,
          # which reads the run's clock: compare the table on that line knowing it can flip.
          cargo llvm-cov clean --workspace
          # (#844) No prebuild of the three binaries first. Measured on 07103c4 against f84aedd: this
          # step went 154s -> 176s while integration-tests, unchanged, went 170s -> 192s, so nothing
          # past runner noise. The build-lock wait it removes was not idle: cli's tests run while lib +
          # fixture still compile, and after a prebuild they run beside the fixture (96s -> 124s).
          # (#861) The lib tests ride with cli, not with the fixture. The fixture's ~103s run is the
          # step's long pole, and on ccc90d3 it started 69.7s in: its call built the lib test binary
          # too, after waiting out cli's build on the lock. Now its call builds one binary. The lib
          # (~5s) and cli (~9s, since (#856)) runs fit in the fixture's shadow.
          # (#875) Three fixture tests are skipped HERE only: each re-runs args another test already pins
          # (`12 fund` / `12 tune`) with the pool reversed or RAYON_NUM_THREADS=1, and no src line branches
          # on either. integration-tests still runs them (`--test '*'`), so the invariants stay graded.
          cargo llvm-cov --no-report --locked --test backtest_fixture -- --skip backtest_fund_report_ignores_pool_order --skip backtest_tune_report_is_bit_identical_on_one_thread --skip backtest_tune_report_ignores_pool_order & a=$!
          cargo llvm-cov --no-report --locked --lib --test cli & b=$!
          wait "$a" || gate=$?
          wait "$b" || gate=$?
          cargo llvm-cov report --html --fail-under-lines "${COVERAGE_MIN}" || gate=$?
          # TOTAL to STDOUT as well as the summary below. The summary is NOT retrievable with
          # `gh run view --log`, so checking the floor used to need either a local llvm-cov or the web
          # UI — which is why it went six points stale. One line makes the next ratchet a log grep.
          # Runs after the gate on purpose (`gate=$?` already caught the failure), so a RED prints the
          # number that failed. Cheap: it only re-reads the profdata just written.
          cargo llvm-cov report --summary-only | tail -1
          {
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
            echo "Floor (COVERAGE_MIN): ${COVERAGE_MIN}% lines — job fails if TOTAL drops below (0 = unarmed)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${gate:-0}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()   # keep the browsable HTML even when the floor gate reds — that's when you need it
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14

  # Everything under tests/ — INCLUDING the live API drift nets in tests/network.rs, which stopped being
  # #[ignore]d and now run here (the separate network-smoke job they used to need is gone; its
  # `-- --ignored` filter would have quietly reduced it to a no-op once nothing was ignored any more).
  #
  # So this job is online, and BLOCKING is still the right call: the nets self-classify (see
  # tests/network.rs) — a 429/5xx/transport hiccup SKIPS green, only a 200-OK-but-broken response
  # FAILS — so the only way this reds is a real regression, API drift or broken code.
  #
  # --nocapture because skip reasons print to stderr, which cargo test swallows on a pass: without it a
  # net that has been silently skipping for months looks identical in the log to one that is asserting.
  # FOLIOMAN_CONFIG because config/settings.yaml is gitignored (private ntfy topic) — point config::load()
  # at the checked-in, secret-free fixture.
  integration-tests:
    runs-on: ubuntu-24.04
    # (#566) 25 -> 45: the debug fund-lane goldens went from ~3 to ~19 min once the soft gates (#564)
    # scored every failer (34bfee8 cancelled twice at 25, every finished test green).
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#635) job level; see the note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: folioman-test   # (#353) the ONLY writer: it builds every dependency a test job needs
      - name: integration + live API drift nets (skip-on-throttle, fail-on-drift)
        # `--test '*'` also picks up backtest_edge_holds, which no longer carries #[ignore]. It
        # green-skips HERE — debug assertions are on, and a runner has no persisted
        # .long_history_cache.json — which is what keeps this job inside 45 min. The backtest-gate job
        # below forces it to run. The same glob is what runs backtest_fixture (the frozen-data golden
        # pin, and the only end-to-end net over real data). Do NOT replace this glob with an explicit
        # list: a new tests/*.rs file joins no job on its own, so the glob is the thing that keeps them
        # wired.
        env:
          # (#591) folioman's own code at opt-level 2, as its dependencies already are (Cargo.toml's
          # dev package."*" override). The fund-lane goldens are CPU-bound in that code: on 0c5394f
          # backtest_fixture took 404s of this job's 441s at 0, seven fund runs packed on 4 vCPUs.
          # Debug assertions and overflow checks stay on (debuginfo is line tables only, from the
          # job-level env above). The goldens are their own check: Rust never contracts or reorders
          # float math, so a byte an opt-level moved would red them; they were blessed at 0, and
          # `cargo t` (profile mutants) runs them at 2. STEP level on purpose: rust-cache hashes
          # job-level CARGO_* env into its key, this job is folioman-test's only writer, and the
          # dependency artifacts it saves do not change. (#635) That holds for opt-level only
          # because Cargo.toml pins the dependencies at 2 whatever this says; nothing pins their
          # debuginfo, which is why that one is job level.
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: FOLIOMAN_CONFIG=tests/ci-settings.yaml cargo test --locked --test '*' -- --nocapture

  # Walk-forward gate. Runs the REAL `backtest {20,12,8} universe` (plus a fourth `8 universe fund` leg,
  # #421) over the live universe and checks the shipped tuning still yields a POSITIVE validated edge
  # AND a positive top-3 held book. Runs on push/PR + manual dispatch. The wide fetch is slow and
  # drifts by the day, so this is
  # NON-blocking by design: same skip-vs-fail contract as the drift nets — a throttle (nonzero exit /
  # <500 tickers resolved) SKIPS green, only a genuine COLLAPSE (GROWTH edge <= 0, top-3 excess <= 0, or
  # both out-of-sample halves negative) FAILS. So a red is never the market, only broken code/tuning.
  # ci-settings.yaml mirrors the real settings.yaml `buy_heuristic`, so the gate scores with the tuning
  # actually shipped. FOLIOMAN_BACKTEST_GATE=1 means FORCE, not opt-in: the test skips itself on a debug
  # build or a cold history cache, and a runner is always both, so without the flag this job would skip
  # too and the gate would quietly stop gating.
  #
  # THREE HORIZONS (plus a fourth, fund-lane 8y leg), ONE FETCH. SHIP RULE v2 grades top-3 at 20y and
  # 8y with 12y as the consistency read,
  # so gating only 12y guarded a lane the rule does not vote on. All three are >= 8y, which takes the
  # MONTHLY path and shares one .long_history_cache.json — the first run pays the wide fetch, the other
  # two read it off disk (~127s each). That is why this costs ~+4 min and not 3x. Do not collapse it
  # back to a single run to "save time"; the saving is small and the coverage loss is the whole point.
  backtest-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # cold release build + one wide-universe fetch + four walk-forward legs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # (#349) its OWN key, not the test jobs'. This is the only job that builds `--release`, and a
          # shared key is written by whichever job finishes FIRST after a Cargo.toml/Cargo.lock change —
          # while this one finishes last. As sole writer, what it restores is always its own release deps.
          shared-key: folioman-gate
      # (#347) Pages' metadata caches, READ-ONLY (`restore`, never saved from here, so Pages stays their
      # only writer). The path list MUST stay identical to pages.yml's "Restore fetch caches": the
      # cache version hashes it, and any difference silently misses. 2.75 MiB. Cold, the universe
      # fetch was ~167s and resolved ~170 fewer names than the warm ~80s one that Pages ships.
      # `.long_history_cache.json` is NOT Pages': the step after this one is its only writer, and
      # (#361) Pages restores it read-only, because `screen` reads it too.
      - name: Restore Pages' fetch caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sec_cache
            .isin_cache.json
            .venue_isins.json
            .regulatory_isins.json
            .fund_facts_cache.json
            .holdings_cache.json
            .eu_listing_cache.json
          key: folioman-fetch-${{ github.run_id }}
          restore-keys: folioman-fetch-
      # (#499) Pages' IPO pond cache, READ-ONLY like the step above; same path as pages.yml's "Restore IPO
      # cache". Cold, the pond is 60 calendar + ~40 profile GETs (~200s locally); warm, one month.
      - name: Restore Pages' IPO cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ipo_cache.json
          key: folioman-ipo2-${{ github.run_id }}
          restore-keys: folioman-ipo2-
      # (#749) Pages' Wikidata young listings, READ-ONLY: a refused live answer had dropped ~43 young EU
      # tickers from the walk, which read like a knob moving windows.
      - name: Restore Pages' Wikidata listings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .wikidata_listings.json
          key: folioman-wikidata-${{ github.run_id }}
          restore-keys: folioman-wikidata-
      # (#352) The monthly history, cached HERE and written by this job only. Live, it was ~90s of the
      # 20y horizon's 143s: ~4700 series at the 60 rps pacer (local: 94s cold vs 5.6s warm). A cache
      # hit is the raw Yahoo payload taking the same parse as a fetch, under the tool's own 7-day
      # per-series TTL, so the gate grades bars at most a week old and refetches the rest. A/B, a
      # 1-day-old cache vs live on 20y: every number the gate votes on identical (edge +742.3, OOS
      # +0.27|+0.18, top-10 excess +5.9); side stats moved <= 0.3 pts. Only successful fetches enter
      # the file, so a throttled run cannot poison it. Yahoo's chart API stays probed live on every
      # push by integration-tests (tests/network.rs). A DAILY key: the first push of a day restores
      # the newest older key and saves once; later pushes hit it exactly and skip the ~150 MB upload.
      # PROVEN on 03c1b16, run 36227840863: cold, the job took 205s and saved 28 MB in under 2s; a
      # gate-only re-run hit the key: job 205s -> 122s, test 148s -> 59s, 20y 143.5s -> 54.7s, and every
      # gate line identical (20y +742.3/+5.9, 12y +229.1/+6.5, 8y +66.0/+7.0).
      - name: Day key for the history cache
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .long_history_cache.json
          key: folioman-longhist-${{ steps.day.outputs.d }}
          restore-keys: folioman-longhist-
      - name: walk-forward edge gate (skip-on-throttle, fail-on-collapse)
        # no `--ignored`: with #[ignore] gone that filter selects NOTHING and the job becomes a silent
        # no-op — the same trap that killed network-smoke.
        run: FOLIOMAN_CONFIG=tests/ci-settings.yaml FOLIOMAN_BACKTEST_GATE=1 cargo test --locked --release --test network backtest_edge_holds -- --nocapture

  # MUTATION GATE — "is the code you just wrote actually covered", asked of the diff and nothing else.
  #
  # The suite reports whether tests PASS. It cannot report whether they would NOTICE a change, and the
  # difference is not academic here: a measured audit of this repo found `tuning_fingerprint`,
  # `read_verdict`, `write_verdict` and the WHOLE of `backtest`'s argument parser could each be
  # replaced with a stub and every test, including six frozen-data goldens, stayed green. cargo-mutants
  # makes exactly those edits and fails if the suite sleeps through them.
  #
  # WHY --in-diff AND NOT A SHARD. Grading the whole backtest module is ~944 mutants at ~16s each —
  # hours, so it can only ever be a slice, and a FIXED slice re-proves the same lines on every push
  # while never reaching the rest. `--in-diff` grades the lines this push actually touched: a docs-only
  # commit costs seconds, a real one costs minutes (measured locally: a 1114-line commit = 26 mutants,
  # ~7 min; a 3-commit span = 90). Cost tracks the change, and the gate means something specific —
  # code you add has to be killed by tests you add with it.
  #
  # A shard DOES appear below, and it does not contradict that: it is a fallback that engages only
  # when one push's diff exceeds the time budget, and it shards THAT diff rather than the module. The
  # gate still only ever grades code this push touched. See the BUDGET check in the step.
  #
  # fetch-depth: 0 because the default shallow clone has no base commit to diff against.
  # (#427) The baseline RUNS again. It was `--baseline skip`, on the reasoning that unit-tests and
  # integration-tests above already prove the tree green, with a fixed `--timeout 90` in its place.
  # That timeout went stale in silence: the fixture ran 247.8s under this job's plain opt-level 0
  # (integration-tests' log, 32b8d9c), a TIMEOUT is neither MISSED nor a red, and a failing fixture
  # test does not stop the others. So every mutant that survived --lib timed out, and the gate went
  # green whether the goldens would have caught it or not. The fixture leg graded nothing. Now the
  # timeout is derived from the measured baseline, and the fixture's growth moves it along.
  #
  # (#588) No `needs:`. Under the old `--baseline skip` this gate had to wait for unit-tests and
  # integration-tests: cargo-mutants scores a mutant CAUGHT when the suite FAILS, and on 04a74e4,
  # with no wait, the killing suite panicked in 5 tests while this gate reported "7 caught, 0
  # missed" and went GREEN. Since (#427) the baseline runs here, under the grading profile itself,
  # and a red baseline grades nothing: cargo-mutants exits 4 before testing any mutant, and the
  # step's no-verdict checks red the job. So the wait bought no safety. It cost wall clock: on run
  # 38696660757 integration-tests took 400s and this gate 433s after it, 837s in all, where coverage
  # (564s) is the tail without the wait. And `needs` SKIPS a job on failure instead of failing it,
  # so a red dependency used to lose the grade on a push.
  mutants:
    # (#854) Two legs on two runners, each grading its half of the push's budget (the picker in the
    # gate step decides which half). One leg ran 248s on a full-budget push: setup, list and upload
    # ~34s, baseline 91s, 6 mutants 122s. Half the mutants per leg should end each near 186s, inside
    # coverage's ~200s; expected, not yet measured. Both legs restore the cache; leg 0 alone saves it.
    name: mutants ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    # 20 is the CEILING THE GATE IS DESIGNED AROUND, not a guess at how long it takes. Measured
    # capacity at that ceiling has fallen with every crate growth — 24 mutants, then ~13, now ~7 (see
    # the BUDGET block for all three); anything larger is sharded down rather than run into the timeout.
    #
    # This should no longer be reachable: the step wraps cargo-mutants in its own shorter `timeout`,
    # so an overrun ends the run cleanly and still reports what it graded. Reaching THIS limit now
    # means something hung outside cargo-mutants — a stuck checkout or cache restore — and raising
    # the number would not fix it. Raising it is what the previous round did (30 -> 45) and the job
    # was cancelled at 45 one commit later.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # --in-diff needs the base commit; the default depth-1 clone has no parent
      # (#354) cargo-mutants pinned by VERSION, not left to the action's manifest: a release can rename
      # or add mutants, which moves the census's byte-compared verdict files and can red this gate on a
      # push that changed nothing it grades. Bump it on purpose, here and in mutation-census.yml
      # together, and re-prove with a census dispatch. PROVEN on 51ce484: census run 36229966422
      # (src/core.rs, convert_price) installed 27.1.0 and graded 18 caught, 0 missed, as before.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      # (#596) Did this push change src/? The cache step's save-if reads the answer, and an action's
      # inputs are fixed when its main step runs, so the answer must exist before rust-cache does.
      # An unreadable "before" (a branch's first push, a force push) counts as a change.
      - name: src changed? (the cache step's save-if)
        id: src
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --quiet "${BEFORE}" HEAD -- src 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # (#596) A key of its own, written by this job alone ((#353): one writer per key). The gate
          # builds in the checkout's target/ (CARGO_TARGET_DIR below), so this restores dependencies
          # already built at the mutants profile; folioman-test holds dev/release ones it can't use.
          # Saved only by a main push that changed src/. One that didn't (a bot's lock-only merge, a
          # YAML edit) exits at "no mutants" before building, and saving then would file the old
          # lock's dependencies under the new lock's key, which an exact hit never saves again.
          # shortcut: a src push with no mutants in its diff (comments only) right after a lock bump
          # can still do that; the cost is rebuilding the bumped crates each run until the next bump.
          # Upgrade: decide save-if from a `cargo mutants --list` run before this step.
          # (#854) Leg 0 alone saves: the two legs build the same dependencies, and (#353) wants one writer.
          shared-key: folioman-mutants
          save-if: ${{ github.ref == 'refs/heads/main' && steps.src.outputs.changed == 'true' && matrix.shard == 0 }}
      - name: mutation gate — changed code must be covered by the suite
        env:
          # push: the commit before this one. PR: the merge base. Both can be all-zeros or empty on a
          # branch's first push, where there is no "before" — the step below falls back to HEAD^.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # (#171) Same pin as unit-tests. It once had to match: `needs: [unit-tests]` running the
          # same suite in the same config regime stood in for the skipped baseline. (#427) runs the
          # baseline here and (#588) dropped the `needs:`, so that reason is gone. The one that
          # stays: a knob reading its shipped value makes its branch observable, so mutants of a
          # config-gated path become killable instead of unkillable-by-construction.
          FOLIOMAN_CONFIG: tests/ci-settings.yaml
          # THE load-bearing setting in this job, and it is an OVERRIDE: Swatinem/rust-cache exports
          # CARGO_INCREMENTAL=0 to keep its cache small, which is right for every other job here and
          # wrong for this one. folioman is one large crate (fetch.rs 8160 lines, picks.rs 9864,
          # core.rs 5958), so with incremental off each mutant recompiles ALL of it at opt-level 2 —
          # ~86s measured locally, against ~25s incremental. That difference is what cancelled the
          # 45-minute run on 038a4b1: 33 mutants x 86s is 47 minutes of build alone.
          #
          # Keep the override, but do not trust its magnitude: on a 4-vCPU runner an incremental
          # rebuild costs 166s as of the latest measurement, not 25s (see the BUDGET block for the
          # series). Incremental IS working; the local figure simply does not transfer, and the gap
          # widens as the crate grows.
          #
          # Safe here specifically because nothing incremental outlives the job. An interrupted run
          # can leave a corrupted incremental cache (`rust-lld: undefined hidden symbol:
          # anon...llvm...` on the next build, seen locally). Since (#596) it sits in the checkout's
          # target/mutants/incremental, but rust-cache's save deletes incremental/ and folioman's own
          # artifacts before it uploads, keeping only dependencies. Do NOT set this on a job that
          # runs --in-place, where the poisoned cache is the checkout itself.
          CARGO_INCREMENTAL: 1
          # (#345) Cargo's own env override of `[profile.mutants]`, as in mutation-census.yml: Cargo.toml
          # and the local `cargo t` stay at opt-level 2. At 2 the compiler WAS this job (see BUDGET).
          # The census A/B proved the verdict does not move: run 36174288986 at 0 against 36172539508
          # at 2, the same 2363 mutants, sorted caught/missed/timeout/unviable files byte-identical
          # (2219/27/0/117), wall clock 1h54m -> 21m. Step-level on purpose: set on the job, it would
          # enter rust-cache's key hash (moot since (#596) gave this job a key of its own).
          CARGO_PROFILE_MUTANTS_OPT_LEVEL: 0
          # (#596) The gate's one scratch tree (`-j 1` below) builds into the checkout's target/.
          # rust-cache restored it by tar, with the mtimes cargo's freshness check compares, so the
          # dependencies come up Fresh and only folioman compiles; a registry crate's fingerprint
          # doesn't depend on the tree's path. On f6bd520, cold, the baseline built 154 crates in
          # 130s, and the second tree paid 151s more to grade one mutant.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          LEG: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          git diff "${BASE}" HEAD > push.diff
          # (#427) Dependencies at opt-level 2, folioman still at 0: mutation-census.yml's (#350) line.
          # It was a loss here while a mutant's test half was ~7s. It is not any more: the fixture runs
          # 247.8s with unoptimised dependencies and 83.3s with optimised ones (census baseline), and
          # every mutant that --lib lets through pays it. The price is a slower cold tree (~50s -> ~125s).
          printf '[profile.mutants.package."*"]\nopt-level = 2\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
          # List first, and print the count into the summary: a slow run then reads as "big diff", not
          # as a hang. `--list` only parses, so this costs seconds. (#855) As JSON: the picker below
          # reads each mutant's genre and file from it.
          #
          # The error is NOT discarded, and that is deliberate. `--in-diff` hard-errors with "Diff
          # content doesn't match source file" when the diff and the tree disagree, and piping its
          # stderr to /dev/null turns that error into a count of zero — which this step would then read
          # as "nothing to grade" and PASS. A gate that goes green because its input was unreadable is
          # the same class of bug as the marker SKIPs this round set out to close, so: listing failure
          # is a RED, and only a genuine empty list is a pass.
          if ! cargo mutants --list --json --in-diff push.diff > mutant-list.json 2> mutant-list.err; then
            echo "cargo mutants --list failed — grading nothing is NOT a pass:" >&2
            cat mutant-list.err >&2
            exit 1
          fi
          # OVERSIZE FALLBACK. A refactor push can generate hundreds of mutants, and the honest
          # failure there is a graded slice, not a cancellation: a job killed by the timeout produces
          # NO survivor list and no verdict, which is indistinguishable from never having run. This
          # only engages above the budget, so an ordinary push is still graded in full.
          #
          # Round-robin so the slice spreads across every file the diff touched — `slice` sharding
          # would spend the whole budget on whichever file sorts first and never reach the rest.
          #
          # WHERE BUDGET COMES FROM — MEASURED ON A RUNNER, not derived. Two early rounds guessed it
          # from local timings and were cancelled. Read the Build/Test phase durations out of
          # mutants.out/outcomes.json on the run's artifact; every number below came from there.
          #
          # CURRENT, (#345) opt-level 0, from census run 36174288986: 2379 mutants under the gate's
          # flags then (-j 2, --copy-target=false, incremental on), so the sample is the whole run:
          #
          #   COLD build per tree      49.6s median, 65.6s max    first mutant in each of the 2 trees
          #   build per mutant          6.4s mean, 5.5s median
          #   test per mutant           7.2s mean, 39s max        a survivor runs the whole suite
          #
          # Work per mutant is 13.6s across 2 workers = 6.8s of wall clock, and the two cold builds run
          # in parallel, so the slower one plus its test covers the first mutant in each tree:
          #   mutants(T) = 2 + (T - 73) / 6.8
          # Sized to finish in backtest-gate's shadow, NOT to fill the 17-minute wrapper. Read off run
          # 36219367047 (warm, after (#349)): this job started at +83s behind integration-tests and paid
          # ~14s of setup, and backtest-gate, the longest job, ended at +200s, so T is ~103s:
          #   73 + 4 * 6.8 = 100s          6 mutants: the opt-level-2 budget, in ~1/9 of its 888s
          # (#352) The history cache moved backtest-gate's end to ~+124s, so on a code push THIS job is
          # the tail (~+185s). BUDGET stays 6 anyway: a smaller one grades only shard 1 of a diff, and CI
          # still ends before the ~207s it did.
          #
          # SUPERSEDED, opt-level 2, run 31946331154: 417/556s cold per tree and 166s per mutant build
          # (98.3% of the run was compiler), so BUDGET was 6 at 556 + 4 * 83 = 888s — on any push that
          # touched code this was CI's slowest job. That build term only ever grew with the crate
          # (65.7s -> ~66s -> 166s), and so will this one: re-read it from a real run's outcomes.json
          # whenever a feature-sized diff lands — a stale build figure is what overran earlier rounds.
          #
          # (#427) STALE until re-read: every figure above predates the baseline run and the optimised
          # dependencies. A mutant that survives --lib now pays the real fixture (83.3s alone on a
          # runner, more with two workers sharing four cores) instead of a 90s TIMEOUT, and the job pays
          # one baseline plus a slower cold tree. BUDGET stays 6 until a code push's outcomes.json says
          # otherwise.
          #
          # (#596) Serial now (`-j 1`), so the two-worker formula above no longer applies. f6bd520
          # (cold, -j 2): list 16s, baseline 130s build + 26s test, ~33s per mutant (build + test).
          # Measured serial: 1386557 built cold and saved the cache (298s job). 8997ea8 restored it on a
          # full key match: list ~8s, baseline 32s build + 26s test (1 `Compiling` line, was 154), each
          # mutant ~5-11s build + ~9s test, so the full budget of 6 took a 166s step and a 177s job, level
          # with backtest-gate (176s). The key hashes Cargo.lock: re-read this after a lock bump lands.
          #
          # (#854) BUDGET is per push, and the two legs split it: each grades its half on its own runner
          # and pays its own baseline, so a full budget costs each leg one baseline and 3 mutants.
          #
          # (#855) Over budget, the picker no longer takes a plain shard. It fills the budget with the
          # mutant kinds that survive, round-robin across files, and only then with fn-value mutants;
          # see .github/scripts/mutants-pick.py. Within the budget it grades everything, as before.
          # Its stdout: the leg's expected count, the summary note, then cargo-mutants arguments, one
          # per line, so `mapfile` keeps each regex whole and an array needs no word-splitting.
          BUDGET=6
          python3 -I .github/scripts/mutants-pick.py "${BUDGET}" "${LEG}" < mutant-list.json > pick.txt
          mapfile -t PICK < pick.txt
          expected=${PICK[0]}
          {
            echo '```text'
            echo "base ${BASE}"
            echo "${PICK[1]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # A push that touches no Rust generates nothing to grade. That is a PASS, not an error —
          # without this guard a README-only commit would red the build. So is leg 1 of a one-mutant
          # diff: the other leg grades it.
          if [ "${expected}" -eq 0 ]; then
            exit 0
          fi
          # --lib + the frozen-data goldens are the killing suite: both are offline and deterministic.
          # network.rs is deliberately NOT in it — a mutant "surviving" because Yahoo throttled would be
          # a false red, which is the one thing a blocking gate must never produce.
          #
          # WHY NOT --in-place, despite it looking faster. It REJECTS `--jobs` ("cannot be used
          # with"), because one tree cannot hold two mutants at once, so it is serial. Settled
          # against the runner measurements above: in-place skips the 423s cold start (it reuses
          # rust-cache's warm target at the original path) but then costs the full 65.7s per mutant
          # with no parallelism — 17.6 mutants in the window, against copy mode's 24. The 45-minute
          # run graded 33 serially on a 4-vCPU runner with three cores idle, and was cancelled.
          #
          # Copy mode gives each parallel job its own tree, which is what makes `-j` legal at all.
          #
          # `--copy-target=false` because copying it BUYS NOTHING HERE. A copied target/ is rebuilt
          # from cold anyway: cargo-mutants stamps every copied file with the copy's time, so cargo
          # reads each dependency as newer than what was built on it (StaleDependency). Measured on
          # the same 14 mutants: 719s of total build with the copy, 750s without — 4%, against
          # copying the whole target/ (12G on the dev box) twice. Skipping it also retires the
          # ENOSPC risk that `-j` would otherwise add on a runner with ~14G free, and ENOSPC mid-run
          # grades nothing at all. (#596) gets the warm dependencies without a copy: CARGO_TARGET_DIR
          # points the tree at the restored target/.
          #
          # `-j 1` since (#596). The one tree uses the warm target/. A second would either share it
          # (cargo locks a target dir, so the two would take turns) or pay the cold dependency build
          # again: on f6bd520 tree 1 spent 151s cold to grade one mutant while tree 0 graded four.
          # It was `-j 2` while the fixture was small: measured locally, two trees more than halved
          # the per-mutant wall clock even after paying the second tree's cold start.
          #
          # THE GATE MUST ALWAYS PRODUCE A VERDICT, and until now it could fail to. Run 31328239009
          # was killed by timeout-minutes while holding a complete, PASSING mutants.out (24 caught,
          # 0 missed) and still went red with no survivor list — indistinguishable from never having
          # run, which is the failure the oversize fallback above exists to prevent.
          #
          # SIGINT is the fix: cargo-mutants stops cleanly and finishes writing its result files.
          # Confirmed twice — interrupted at 206/218 locally and cancelled at 24/31 on the runner,
          # both leaving complete caught/missed files, because those files are appended as each
          # mutant finishes rather than written at the end. So an overrun degrades to "graded 16 of 18
          # mutants, 0 survived" instead of to silence. (#854) It still reds, on the count check
          # below, but with its survivor list in hand. 17m leaves ~3 minutes under timeout-minutes
          # for the 11s setup and the artifact upload.
          #
          # (#427) NO `--timeout`, and the baseline runs: cargo-mutants derives the timeout as a multiple
          # of the measured suite (the log prints "Auto-set test timeout"). The fixed 90 it replaces was
          # sized to a ~25s fixture and hid every fixture-reaching mutant once the fixture outgrew it.
          # A TIMEOUT is not a MISSED, so too tight a cap hides a survivor rather than reddening the gate.
          #
          # (#590) The gate skips the six fund-lane goldens (`backtest_fund_report*` and
          # `backtest_8y_fund_samples*`); integration-tests and coverage still run them on every push.
          # They were ~93% of the fixture's thread time. On 392547b the baseline built in 127s and
          # tested in 354.7s (lib 8.9s, fixture 345.6s), so this job was CI's tail (wall 652s, with
          # integration-tests done at ~351s), and the auto-set timeout (5x the baseline, ~30 min)
          # outlived the 17m wrapper. Figures above that price the full fixture predate this. If a push
          # reds here with a MISSED, re-grade that one mutant on mutation-census.yml, whose `tests`
          # default has no skip. If only a fund golden kills it, the fix is a lib test, not a revert.
          #
          # (#635) --lib and the fixture go in as --cargo-arg, so they reach the Build phase too.
          # Arguments after the first `--` reach the Test phase only, so Build used to run an
          # unfiltered `cargo test --no-run` and compile the bin test harness and the cli and network
          # test crates, which nothing here runs, for the baseline and again for every mutant. The
          # libtest flags now follow a second `--`, so they still reach only the test binaries. Keep
          # --lib out of the trailing arguments: the Test phase appends both lists, so it would reach
          # cargo twice. `cargo mutants --list` names the same mutants under both argument lists
          # (33967 on the whole tree when checked, byte-identical) and the Test phase runs the same
          # command as before. The saving is EXPECTED, not yet measured. On the first code push after
          # this lands, a mutants-out-N artifact's log/baseline.log must show a Build line ending
          # `--lib --test=backtest_fixture`, no rustc line for tests/cli.rs or tests/network.rs, and
          # src/main.rs once, not twice (a9d2bab compiled seven targets there, now four). Then read
          # "Unmutated baseline in Xs build" against 48s on a9d2bab (32s in the note above) and each
          # mutant's Build in outcomes.json against its 6.6-11.6s. A push with no Rust change runs
          # no mutants and is unchanged.
          rc=0
          timeout --signal=INT --kill-after=60s 17m \
            cargo mutants "${PICK[@]:2}" --in-diff push.diff -j 1 --copy-target=false \
              --profile mutants --cargo-arg=--lib --cargo-arg=--test=backtest_fixture \
              -- -- --skip backtest_fund_report --skip backtest_8y_fund_samples || rc=$?
          # THE FILES ARE THE VERDICT, not the exit code: under `timeout` the code conflates
          # "mutants survived" (2), "interrupted" (124) and any internal error, so it is reported
          # for diagnosis and nothing is decided from it.
          #
          # Same rule as the --list guard above — a gate that goes green because its own output was
          # missing is the bug this job exists to prevent. No result files is a RED, and so is a run
          # that graded nothing. This -f check is also what guarantees the glob below expands, so
          # keep it first: `cat` on an unmatched glob would abort the step under `set -o pipefail`.
          if [ ! -f mutants.out/missed.txt ]; then
            echo "cargo mutants wrote no verdict (exit ${rc}) — grading nothing is NOT a pass" >&2
            exit 1
          fi
          graded=$(cat mutants.out/*.txt | wc -l)   # caught + missed + timeout + unviable
          missed=$(wc -l < mutants.out/missed.txt)
          # "of ${expected}": this leg's share, not the diff's count. The note above gives that.
          echo "graded ${graded} of ${expected} mutants, ${missed} survived (exit ${rc})" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${graded}" -eq 0 ]; then
            echo "nothing was graded — treating as a failure, not a pass" >&2
            exit 1
          fi
          if [ "${missed}" -gt 0 ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < mutants.out/missed.txt >&2
            exit 1
          fi
          # (#854) Last, so a short run still prints its survivors first. The picker predicted the
          # count from the same list, so a gap means the run graded other mutants than the picker
          # chose, or the 17m wrapper cut it short. (#855) A pick that escaped its `-F` filter or
          # matched nothing is the first kind.
          if [ "${graded}" -ne "${expected}" ]; then
            echo "graded ${graded}, expected ${expected}: the run graded other mutants than the picker chose, or the 17m wrapper cut it short" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()   # the survivor list is the whole point of a red — keep it
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # Actions housekeeping: each main run supersedes the history, so delete this workflow's older
  # COMPLETED runs (logs + artifacts go with them). Main-only by the `if`: a PR ref is the merge ref
  # (refs/pull/…), so PR runs neither trigger the cleanup nor lose their own history while iterating.
  # --status completed keeps any still-running run (including this one) untouched; per-id `|| true`
  # so one undeletable run never reddens the pipeline. The event-based filtering this used to do —
  # skip `schedule` runs, keep the newest 5 of them because that is where backtest-gate's re-probe
  # WARNs printed — went with the cron: there are no scheduled runs left to retain.
  #
  # CANCELLED runs (the concurrency `cancel-in-progress` kills a superseded commit's in-flight run)
  # carry no useful logs but clutter the Actions tab, and `--status completed` does NOT match them —
  # a cancelled run's status is `cancelled`, not `completed`. So sweep them in their own pass. This
  # runs on every main push, so a burst of superseded pushes is cleared on the next run to finish.
  #
  # (#346) The cancelled pass also sweeps Mutation census, and ONLY that pass does. A cancelled census
  # (a queued dispatch superseded by a newer one, or one stopped by hand) holds no verdict. A completed
  # one is evidence: receipts in tests/ci-settings.yaml cite census runs by ID, and each run's step
  # summary is the missed list a PROOF RULE is checked against. Never add census to the completed pass
  # here: (#553) pages.yml's catch-all deletes a census run 2 days after it finishes, time enough to read it.
  #
  # (#355) Only the NEWEST completed census of a slice (same files, regex and exclude) is the evidence
  # the next round is checked against; the by-hand prune this asked for is gone since (#553): every census
  # run goes 2 days after it ends (the receipt keeps its numbers; only the link dies, and a re-dispatch with
  # the same inputs on the same commit prints the same list).
  cleanup-runs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write   # gh run delete; other jobs keep the default read-only token
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (#402) Completed PR runs are spared: a PR's checks are its review verdict, and any push to
          # main fired this sweep before anyone had read them. (#429) pr-cleanup.yml deletes a
          # merged PR's passed runs; (#553) pages.yml's catch-all takes the rest 2 days after the PR closes.
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --status completed --limit 200 --json databaseId,event -q '.[] | select(.event != "pull_request") | .databaseId'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
          # (#429) pr-cleanup.yml's own runs: its prune and the skipped runs of unmerged closes.
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow pr-cleanup.yml --status completed --limit 200 --json databaseId -q '.[].databaseId'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
          for wf in ci.yml mutation-census.yml; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --status cancelled --limit 200 --json databaseId -q '.[].databaseId'); do
              gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
            done
          done
