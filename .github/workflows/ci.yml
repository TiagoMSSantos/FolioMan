name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ponytail: ubuntu-latest ships a stable Rust toolchain, so no install step needed.
# rust-cache with a shared key: all 3 jobs restore ONE common warm cache from prior runs
# (deps compiled once, not 3×). Parallel jobs can't share THIS run's cache — GitHub saves it
# at job end — so cross-run reuse is the win; within-run hand-off would require `needs: build`.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all 3 jobs (across runs)
      - run: cargo build --verbose

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all 3 jobs (across runs)
      - run: cargo test --lib   # in-module #[cfg(test)] unit tests

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: folioman-ci   # one warm cache shared across all 3 jobs (across runs)
      - run: cargo test --test '*'   # everything under tests/
