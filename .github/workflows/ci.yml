name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ponytail: ubuntu-latest ships a stable Rust toolchain, so no install step needed.
# rust-cache restores the target/ + registry between the 3 jobs (each compiles deps otherwise).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --verbose

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib   # in-module #[cfg(test)] unit tests

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test '*'   # everything under tests/
