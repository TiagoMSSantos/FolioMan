name: Pages

# Publish `screen`'s ranked tables (the stocks / ETFs / crypto lanes and the tables below them) to the
# repo's GitHub Pages site.
#
# SEPARATE FROM ci.yml ON PURPOSE, and the reason is isolation, not the trigger: nothing in ci.yml
# should have to wait on a ~15-minute network run, and nothing here should be able to break one. The
# two files share no job and no permission set. They do share caches, each written by one side only:
# this file writes the fetch, ipo and wikidata caches that ci.yml's backtest-gate restores read-only,
# and backtest-gate writes the monthly history cache that this file restores read-only.
#
# This file now runs on push as well, so BE CLEAR ABOUT WHAT A RED RUN HERE MEANS. It still gates
# nothing — no pull_request trigger, no required check, no merge to block — but a throttled fetch or
# an expired FMP key will put a red X against the commit that happened to be pushed at the time. That
# X is about the morning's network, not about the code. Read it as "the page did not refresh", never
# as "this commit is bad", and check ci.yml for the verdict that actually judges the commit.
#
# ONE PREREQUISITE, AND IT DOES NOT LIVE IN THIS FILE: the repo's Pages source must be "GitHub
# Actions" (`build_type: workflow`). Turning Pages on defaults it to "Deploy from a branch" instead,
# and against a branch source `deploy-pages` dies with a bare `HttpError: Not Found` — a 404 that
# reads like a missing artifact and is really a missing site. Run 32059047479 spent a full 15-minute
# fetch to find that out, with every step before the deploy already green. Check it with
# `gh api repos/OWNER/REPO/pages --jq .build_type` before blaming anything here.
#
# The repo is public, so the site is public and standard-runner minutes are free. That is not licence
# to relax about what ships: `config/settings.yaml` — the real overlay, holding the watchlist and the
# monthly deploy amount — is gitignored and is NOT public today, and this page must never become the
# thing that publishes it.
#
# (#114) The guard used to be a second committed overlay, `config/web-settings.yaml`. It is gone. The
# run below reads `tests/ci-settings.yaml` — the same file `cargo t` grades — and that file ships
# `tickers: []`, `sectors: []`, `monthly_deploy_eur: 0` and a dummy `ntfy_topic`, asserted by
# `the_published_base_leaks_nothing_and_ranks_on_the_validated_lane`. Privacy is now a property of the
# base rather than of a file that had to be kept in sync with it, and the same test refuses to let a
# second overlay come back.
on:
  schedule:
    - cron: "*/5 * * * *" # every 5 min
    # (#831) One tick just after each Intraday cutoff (EU 17:00, US 21:30 UTC), so today's session
    # reaches the table without waiting on a `*/5` tick: on 2026-10-22 none fired from 14:40 to 17:35.
    # Still best-effort; off-the-hour minutes are only less likely to be dropped.
    - cron: "7 17 * * 1-5"
    - cron: "37 21 * * 1-5"
  # Republish whenever main moves, so a heuristic change is visible on the page immediately instead of
  # at the next cron tick: GitHub throttles `*/5` to ~2-4 runs an hour (36 deploys on 2026-09-26). NO `paths` filter, deliberately: the rows are a live universe fetch, so
  # what the page shows depends on the market as much as on the diff, and a docs-only push simply
  # refreshes it. Runner minutes are free on a public repo and the FMP key is optional, so the cost of
  # a wasted run is a wasted run. An allowlist would be the thing that silently stopped rebuilding the
  # day someone added a source directory to it and forgot this file.
  #
  # A push during the cron does NOT double-deploy: `concurrency: pages` serialises them, and the
  # second run republishes the same site a few minutes later.
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# Least privilege: `contents: read` is the checkout. `pages: write` and `id-token: write`, which
# deploy-pages needs to publish and to trade an OIDC token for a deployment, belong to the `deploy` job
# alone. `publish` builds crates and holds the API keys, so it must not be able to deploy.
permissions:
  contents: read

# One deployment at a time, and NEVER cancel one in flight: a half-finished Pages deployment is how a
# site ends up serving a partial artifact. A superseded run waits its turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # ~2 min build + a full-universe fetch that measures ~5 min warm; 45 leaves room for a bad
    # throttling day without letting a wedged socket burn the 6-hour default.
    timeout-minutes: 45
    outputs:
      clean: ${{ steps.validate.outputs.clean }}
      # `deploy` reads the artifact's name from here, not from its own `github.run_attempt`: a re-run of
      # a failed `deploy` alone is attempt 2, while the artifact was uploaded under attempt 1's name.
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The fetch caches, restored from the previous run. This is not a nicety: `resolve_eu_listings`
      # alone is documented at ~4 minutes cold, and the SEC facts cache is append-only history that
      # never needs refetching. Keyed by date so each day writes its own entry, with a prefix
      # restore-key so today warms from yesterday.
      #
      # `.long_history_cache.json` is NOT in this list: ci.yml's backtest-gate owns it, and the step
      # after this one borrows it read-only.
      # (#426) restore and save apart: the combined action saves on job success only, so a run the Validate
      # step refuses threw its whole warm-up away and the next run started from the same half-warm cache
      # (#422). The save below runs after `screen` whatever Validate says. The path list must stay identical
      # in both, and in ci.yml's read-only copy: the cache version hashes it.
      - name: Restore fetch caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sec_cache
            .isin_cache.json
            .venue_isins.json
            .regulatory_isins.json
            .fund_facts_cache.json
            .holdings_cache.json
            .eu_listing_cache.json
          key: folioman-fetch-${{ github.run_id }}
          restore-keys: folioman-fetch-

      # (#397) ISIN -> every venue's listing, written by `screen` only with OPENFIGI_API_KEY. Its OWN
      # entry, not a line in the list above: the cache version hashes that list, so adding to it would
      # cold-start every fetch cache here and in ci.yml's read-only copy of it.
      - name: Restore listing cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .listing_cache.json
          key: folioman-listings-${{ github.run_id }}
          restore-keys: folioman-listings-

      # (#438) The Attention table's Wikimedia pageview series. Its own entry for the same reason; warm, a
      # run refetches only names whose newest complete month is missing (the first runs of a month).
      - name: Restore pageview cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .wiki_pageviews_cache.json
          key: folioman-wikiviews-${{ github.run_id }}
          restore-keys: folioman-wikiviews-

      # (#465) The ETF TD-1Y/TD-5Y cells' yearly tracking-difference series, one trackingdifferences.com page
      # per printed fund. Its own entry so warm runs refetch nothing until the cache is 30 days old.
      - name: Restore TD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .td_cache.json
          key: folioman-td-${{ github.run_id }}
          restore-keys: folioman-td-

      # (#479) The USE/REPL/TOP10% cells justETF fills for printed funds Börse Frankfurt and Yahoo left
      # n/a, one profile page per fund with a gap. Its own entry so warm runs refetch nothing for 30 days.
      - name: Restore justETF cells cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .justetf_cells_cache.json
          key: folioman-justetf-cells-${{ github.run_id }}
          restore-keys: folioman-justetf-cells-

      # (#469) The NAME link and SHORT%/TARGET% facts: three Nasdaq GETs per stock plus one FINRA query.
      # Its own entry so warm runs refetch only rows a week old or partly refused. (#471) profile2: the
      # rows cached before the Wikipedia fallback hold no site for a week, so start cold once. (#481)
      # profile3: the same again for the SECTOR fallback, so the Social names outside the CSV read one.
      # (#482) profile4: a cached site is carried forward, so the Wikipedia articles the title guard now
      # refuses (WHK's "Silver mining in the United States") only leave on a cold start.
      - name: Restore profile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .profile_cache.json
          key: folioman-profile4-${{ github.run_id }}
          restore-keys: folioman-profile4-

      # (#499) The $1B+ IPO pond: one Nasdaq calendar GET per month plus one profile GET per kept name.
      # Past months never change, so a warm run asks only for the current month.
      # (#528) ipo2: the old cache held June 2026 without SpaceX (a substring SPAC test dropped it).
      - name: Restore IPO cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ipo_cache.json
          key: folioman-ipo2-${{ github.run_id }}
          restore-keys: folioman-ipo2-

      # (#749) The Wikidata EU young listings: every runner started cold and asked live, and a refused
      # answer cost the Young table 14 of 64 rows (2026-10-17, 2026-10-19). A copy under a day old answers
      # without a request (tar keeps the mtime); an older one answers when the live GET is refused.
      - name: Restore the Wikidata listings
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .wikidata_listings.json
          key: folioman-wikidata-${{ github.run_id }}
          restore-keys: folioman-wikidata-

      # (#516) The App Store chart's daily ranks: a climb is graded against the week before, so the
      # file must survive between runs or every run is day one.
      - name: Restore App Store ranks cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .appstore_ranks.json
          key: folioman-appstore-${{ github.run_id }}
          restore-keys: folioman-appstore-

      # (#604) Each YouTube channel's last feed with videos, served for 14 days when the channel's RSS
      # answers 404/500 (most tries on 2026-10-16), so a miss stops dropping its names' `s` boost.
      - name: Restore YouTube feeds cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .youtube_feeds.json
          key: folioman-youtube-${{ github.run_id }}
          restore-keys: folioman-youtube-

      # (#520) Berkshire's EDINET reports and the day range already scanned: a past day's list never
      # changes, so without this every run would restart the 2020-08 backfill.
      - name: Restore EDINET cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .edinet_brk.json
          key: folioman-edinet-${{ github.run_id }}
          restore-keys: folioman-edinet-

      # (#519) Eulerpool FCF rows (30 days) and market caps (1 day): without it every run re-asks ~176 names
      # twice, and the 100k monthly quota would carry ~10k calls instead of ~5k.
      - name: Restore Eulerpool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .eulerpool_fcf.json
          key: folioman-eulerpool-${{ github.run_id }}
          restore-keys: folioman-eulerpool-

      # (#707) Eulerpool's annual statements behind `ep_fund` (30 days), four calls a month per name with no SEC row.
      - name: Restore Eulerpool fundamentals cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .eulerpool_fund.json
          key: folioman-epfund-${{ github.run_id }}
          restore-keys: folioman-epfund-

      # (#366) The three PERMANENT BLS decades behind the USA 20Y/30Y/40Y inflation cells. `.fmp_cache`
      # is otherwise cold on every run, so each run would re-ask BLS for all three plus the fresh
      # window: 4 keyless calls per run against a 25/day per-IP cap. With this it is 1. Its own step,
      # so adding it did not re-version the fetch cache above. A new calendar year invalidates each
      # decade by content (`old_window_covers`), not by key, and the run refetches it.
      # (#368) And the day-fresh feeds, the EU ones above all. Run 36257549768's two Eurostat GETs came
      # back empty inside the 3s connect timeout, with no copy on disk to fall back on, so the page
      # published EU as "no data" and dropped the 27Y column that EU's span sets. Kept here, a copy under
      # a day old answers without a request, and a failed fetch serves the last good one. tar keeps each
      # file's mtime, which is what that day is measured from.
      # (#486) And the Bonds table's FRED series, same day cache, same fallback.
      - name: Restore the inflation feeds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .fmp_cache/us_cpi*.json
            .fmp_cache/pt_cpi.json
            .fmp_cache/eu_hicp*.json
            .fmp_cache/fred_*.json
          key: folioman-macro-${{ github.run_id }}
          restore-keys: folioman-macro-

      # (#361) The monthly history backtest-gate saves once a day (#352), READ-ONLY here so that job
      # stays its only writer. `screen` reads it (`quote_one` -> `chart_json_long`, 7-day per-series
      # TTL); an older comment here called it backtest-only, and without it every run fetched each
      # name's `range=max` series live (run 36247201539: 18718 paced calls, 0 cache hits, 343s).
      # The path MUST match ci.yml's: the cache version hashes it. The key never matches exactly, so
      # the prefix restore takes the newest day. After a week with no push the entries age past the
      # TTL and are refetched, which is where this run started, not worse.
      - name: Restore the monthly history cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .long_history_cache.json
          key: folioman-longhist-
          restore-keys: folioman-longhist-

      # (#686) The binary, keyed on everything compiled into it. rust-cache keeps only the deps, so each
      # cron run recompiled the crate (49-97s) for a tree the run before had built. rustc is in the key
      # because a new runner image ships a new one, and this file is, so a changed build line rebuilds. An
      # exact key only, no restore-keys: a stale binary never runs. Saved right after the build, so a red
      # Screen still keeps it.
      - name: Key the binary
        id: bin-key
        run: echo "key=folioman-bin-$(rustc -V | cut -d' ' -f2)-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', '.github/workflows/pages.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the binary
        id: bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/release/folioman
          key: ${{ steps.bin-key.outputs.key }}
      # Only on a miss: on a hit no build runs, and rust-cache's post step would save the empty target
      # under its own key whenever its entry had been evicted, leaving every later build cold. So a push
      # that moves web/engine alone builds the engine below without rust-cache: slower, never red.
      - if: steps.bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # (#701) The crate at opt-level 1, its dependencies still at 3. An override for this package leaves
      # their artifacts valid, so rust-cache still serves them. Run 39068294070 spent 62s of this step on
      # the crate alone. Its Screen then used 28s of CPU in a 173s wall clock, and its 8799 paced calls
      # need 147s at the 60/s pacer, so slower crate code mostly runs while the pacer waits. A cron run
      # restores the binary and pays only that CPU. No result can move: Rust emits no fast-math flags at
      # any opt-level (see .cargo/config.toml).
      - name: Build
        if: steps.bin.outputs.cache-hit != 'true'
        run: cargo build --release --locked --config 'profile.release.package.folioman.opt-level=1'
      - name: Save the binary
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/release/folioman
          key: ${{ steps.bin-key.outputs.key }}

      # (#392) The page's engine: `picks::render` compiled to wasm, which re-ranks universe.json under
      # a reader's uploaded settings.yaml in their own browser. Rebuilt only when its source moves; the
      # cron runs restore it. EVERY step is continue-on-error: a wasm break costs the upload control
      # (the page hides it when engine/ is missing), never the deploy. ci.yml's `wasm` job is what
      # reds the push that broke it.
      - name: Restore the page engine
        id: engine
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: engine-dist
          key: folioman-engine-${{ hashFiles('src/**', 'web/engine/**', 'Cargo.toml') }}

      # Built aside and moved in whole, so a failed build never leaves a half engine for the cache
      # to save under this key.
      #
      # (#695) In the background, under the Screen step: the build is CPU work and the screen waits on
      # the network. After the screen it took 34s and 37s of runs 39061202492 and 39063079997. The log
      # goes to a file, not to this step's pipes, so the step ends at once. The subshell exits with
      # the build's status, and `Wait for the page engine` prints the log and checks engine-dist.
      - name: Build the page engine
        if: steps.engine.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          ( set -e
            rustup target add wasm32-unknown-unknown
            cargo install --locked wasm-bindgen-cli --version 0.2.130   # = web/engine's pin; a no-op once installed
            cargo build --locked --release --target wasm32-unknown-unknown --manifest-path web/engine/Cargo.toml
            wasm-bindgen --target web --out-dir engine-tmp web/engine/target/wasm32-unknown-unknown/release/folioman_engine.wasm
            cp web/engine/worker.js engine-tmp/
            mv engine-tmp engine-dist
          ) > engine-build.log 2>&1 &
          echo "$!" > engine-build.pid

      # The run itself. FMP_API_KEY reaches it through `env:` and nothing else — never an argument,
      # never echoed — and it is OPTIONAL: without it the value/quality tilts go neutral, which
      # empties the `#` flag and some columns rather than failing.
      - name: Screen
        env:
          # (#114) THE COMMITTED BASE, DIRECTLY — no overlay. This used to point at
          # config/web-settings.yaml, a second tracked config that merged over this one. That file had
          # grown twelve `buy_heuristic` overrides (including `use_life_cagr: true`, condemned at #3j
          # and again at #3k), so this job published a ranking no receipt in the repo had graded. The
          # overlay is deleted; the page now ranks on exactly what `cargo t` grades.
          #
          # `config::ci_base_yaml` refuses to self-merge a path ending in `ci-settings.yaml`, so this is
          # the pure fixture, and `heuristic_drift` stays quiet for the same reason — correct here,
          # since there is no longer a baseline for it to differ from.
          #
          # ABSOLUTE, deliberately: `data_path` anchors the caches and the payload on the config's
          # GRANDPARENT directory, so this resolves to the workspace root — the same directory the old
          # overlay anchored on, which keeps the fetch caches below keyed to the same paths.
          FOLIOMAN_CONFIG: ${{ github.workspace }}/tests/ci-settings.yaml
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # (#397) OPTIONAL too: it resolves each ETF's other venues, so an uploaded pin on one (VUAA.DE)
          # shows as the pool's line (VUAA.L). Without it the map is whatever `.listing_cache.json` holds.
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          # (#520) OPTIONAL: Berkshire's Japan stakes (EDINET). Without it the lane logs one line, stays off.
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # (#519) OPTIONAL: FAIR/MOS% on non-US stocks (Eulerpool FCF). Without it the lane logs one line, stays off.
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          # (#689) 64 quote fetches in flight, the value the pacer note in ci-settings.yaml measured.
          # The shared multiplier gives this 4-core runner 32, which left the 60/s pacer at ~41/s.
          # Here, not in ci-settings: backtest-gate and the probes fetch live through the same knob.
          FOLIOMAN_FETCH_CONCURRENCY: 64
        # (#698) bash's `time` adds the run's CPU seconds (user + sys) under its wall clock. The pacer
        # holds most of that wall clock, so a slower run reads as network or as code from the log alone.
        run: time ./target/release/folioman screen

      # (#766) Not on a cancelled run: one cut mid-write saves a torn cache file, its reader takes it as
      # empty, and the next run starts cold.
      - name: Save fetch caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sec_cache
            .isin_cache.json
            .venue_isins.json
            .regulatory_isins.json
            .fund_facts_cache.json
            .holdings_cache.json
            .eu_listing_cache.json
          key: folioman-fetch-${{ github.run_id }}

      # Fail HERE, before the deploy, when the run came back empty. Pages keeps serving the last
      # successful deployment, so a throttled morning leaves yesterday's page up — which the page's
      # own staleness banner then labels — instead of publishing three empty tables. That is the
      # whole fallback: no last-good store to maintain, because not deploying IS the fallback.
      - name: Validate the payload
        id: validate
        run: |
          test -f .screen_web.json || { echo "screen wrote no payload"; exit 1; }
          jq -e '(.stocks | length) + (.etfs | length) + (.crypto | length) > 0' .screen_web.json \
            > /dev/null || { echo "every lane came back empty — not deploying over a good page"; exit 1; }
          # (#418) and never over a broken one: BUY% not summing to 100, a ticker twice, a NaN cell.
          jq -e -f web/payload-contracts.jq .screen_web.json > /dev/null \
            || { echo "payload breaks a contract (BUY% sum / duplicate ticker / NaN) — not deploying over a good page"; exit 1; }
          # (#421) nor over a pool whose fundamentals thinned: a SEC tag drift ranks hundreds of names on the fill.
          jq -e -f web/universe-contracts.jq .screen_universe.json > /dev/null \
            || { echo "fund coverage under a web/universe-contracts.jq floor — not deploying over a good page"; exit 1; }
          jq -r '"generated \(.generated): stocks \(.stocks|length) etfs \(.etfs|length) crypto \(.crypto|length) rows"' .screen_web.json
          # (#765) read by `record`: a degraded run deploys, but its journal line waits for a clean run
          echo "clean=$(jq '(.degraded // []) | length == 0' .screen_web.json)" >> "$GITHUB_OUTPUT"

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css _site/
          # (#433) The CDN caches each file 10 min on its own, so a deploy could pair the new page with
          # the old app.js for that long. A per-run query string makes each deploy's page ask for its
          # own copies. The engine's own files (folioman_engine.js, the wasm) still ride the 10 min.
          v="v=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sed -i "s|href=\"style.css\"|href=\"style.css?$v\"|; s|src=\"app.js\"|src=\"app.js?$v\"|" _site/index.html
          sed -i "s|\"engine/worker.js\"|\"engine/worker.js?$v\"|g" _site/app.js
          if ! grep -q "style.css?$v" _site/index.html || ! grep -q "app.js?$v" _site/index.html \
             || [ "$(grep -c "worker.js?$v" _site/app.js)" != 2 ]; then echo "cache-bust sed missed a URL"; exit 1; fi
          cp .screen_web.json _site/data.json
          cp .screen_universe.json _site/universe.json
          # (#401) The page marks names that joined a table since YESTERDAY's last deploy. The live
          # data.json is the previous deploy: on the first deploy of a new UTC day it becomes prev.json,
          # and every later deploy that day carries the live prev.json forward. The query string sidesteps
          # the Pages CDN's 10-minute cache, which could hand back the prev.json from BEFORE the day's
          # roll and carry that forward all day. Best effort: no prev.json = no marks, never a red run.
          # (#768) A same-day deploy that cannot read the live prev.json ships none. It used to ship the
          # live data.json in its place, so "new since yesterday" meant new since this morning's deploy.
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          get() { curl -sfL --retry 3 --retry-all-errors --max-time 30 "$site/$1?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$2" && jq -e .generated "$2" >/dev/null 2>&1; }
          if get data.json live.json; then
            if [ "$(jq -r '.generated[:10]' live.json)" != "$(jq -r '.generated[:10]' _site/data.json)" ]; then
              mv live.json _site/prev.json
            else
              get prev.json _site/prev.json || rm -f _site/prev.json
            fi
          fi
          rm -f live.json

      # (#695) The background build's end. `kill -0` holds while its subshell lives; then the build's
      # output prints here, and a missing engine-dist reds this step as a failed build reddened the
      # build step before.
      - name: Wait for the page engine
        if: steps.engine.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          while kill -0 "$(cat engine-build.pid)" 2>/dev/null; do sleep 1; done
          cat engine-build.log
          test -d engine-dist

      # The parity pin: with no upload the engine must reprint data.json's rows from universe.json.
      # A drift ships the page WITHOUT the engine rather than one that ranks differently from `screen`.
      - name: Publish the page engine
        continue-on-error: true
        run: |
          cp -r engine-dist _site/engine
          node web/engine/smoke.mjs _site || { rm -rf _site/engine; exit 1; }

      # (#398) Named per ATTEMPT: a re-run keeps the earlier attempt's artifacts, and deploy-pages
      # refuses a run holding two `github-pages` (run 36318617516, attempt 2).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # (#333) Hand the journal to the `record` job. The file is TRACKED, so the checkout above put
      # the existing record in the workspace and `screen` has just appended to it — or not, if a run
      # earlier today already did. Either way it exists, and `if-no-files-found: error` makes its
      # absence a red run rather than a day that silently went unrecorded.
      #
      # AFTER THE PAGE ARTIFACT, AND `continue-on-error`, ON PURPOSE: publishing the page is this
      # workflow's job and recording the journal is a passenger, so a broken upload must never be what
      # keeps `deploy` from running (it needs this job green). The first attempt at this sat before
      # `Assemble the site` and reddened the run without deploying; a failed upload now costs the day's
      # line instead, because `record` fails on the missing artifact.
      #
      # `include-hidden-files` IS LOAD-BEARING: upload-artifact skips dotfiles by default, so without
      # it this step reports "No files were found with the provided path" for a file that is sitting
      # right there in the workspace — which is exactly how that first attempt failed.
      - name: Upload the journal
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screen-journal
          path: .screen_snapshots.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # THE DEPLOY, APART FROM `publish`, SO THE JOB THAT RUNS DEPENDENCY CODE HOLDS NO DEPLOY RIGHTS. `publish`
  # runs `cargo build`, `cargo install` and the screen with the API keys; a crate bumped and auto-merged
  # runs its build script there. Holding `pages: write` and `id-token: write` it could have published
  # arbitrary content to the site. This job runs no repo code and checks nothing out: it only hands the
  # uploaded artifact to deploy-pages. Job-level permissions REPLACE the workflow block, so it holds
  # these two and not even `contents: read`. The `github-pages` environment (main only) moved with it.
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      # (#485) ONE RETRY. GitHub's Pages backend sometimes answers a good artifact with "Deployment
      # failed, try again later." (run 37316867519: build green, publish red, a re-run deployed it).
      # The first attempt may fail without reddening the run; the second, a minute later, may not.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.publish.outputs.artifact }}
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.publish.outputs.artifact }}

  # (#333) COMMIT THE DAY'S JOURNAL LINE BACK, so the forward record survives the runner.
  #
  # `screen` appends one line per day to `.screen_snapshots.jsonl` and that line is the ONLY record
  # every one of `track`'s forward sections reads. There were five when this job landed — the verdict
  # book, the CORE shortlist, the flat twin, the notch shadow covering all 14 gate refusals, and
  # (#332)'s PEG shadow — and fourteen sections follow the verdict book today. Each of those five needs
  # 12 MONTHLY lines before its verdict can say anything but "wait" (`track::REOPEN_LINES`). Until
  # this job existed the line died with the ephemeral runner, and the record accrued only when someone
  # ran `screen` locally and kept the file — which it did not survive: 48 lines spanning
  # 2026-07-16..09-08 were lost to a probe's backup/restore, leaving one line behind.
  #
  # ONE COMMIT A DAY, and the cron needs no help to get there. `append_snapshot` returns early when
  # the journal's last line already carries today's date, so the first run of the day appends and this
  # job pushes it; every later run of the ~288 writes nothing, and this job finds the run's last line
  # no newer than main's and pushes nothing.
  #
  # A SECOND JOB RATHER THAN A STEP IN `publish`, and the reason is the FMP key. Job-level permissions
  # REPLACE the workflow block, so this job holds `contents: write` and nothing else — while `publish`,
  # which is the job that sees `secrets.FMP_API_KEY`, keeps `contents: read`, and `deploy` alone holds
  # `pages: write` / `id-token: write`. Nothing that can push to main ever holds the key.
  #
  # NO LOOP: a push authored by GITHUB_TOKEN does not trigger workflows, so this cannot re-enter
  # `on: push`. If that ever changed, the same-date guard above makes the triggered run a no-op.
  # The workflow-level `concurrency: pages` serialises runs, so two of our own pushes cannot race;
  # the rebase-and-retry below is for a HUMAN push landing between this job's checkout and its push.
  record:
    needs: [publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: screen-journal
          path: run-journal
      - name: Commit today's line
        env:
          CLEAN: ${{ needs.publish.outputs.clean }}
        run: |
          # (#765) A degraded run's line used to be the day's line for good when it came first, though a
          # clean run could follow. It waits now, unless main has no line for yesterday either: a feed can
          # stay degraded for weeks, and the forward record still needs a line a month.
          [ "$CLEAN" = true ] || [[ "$(tail -n 1 .screen_snapshots.jsonl | jq -r .date)" < "$(date -u -d yesterday +%F)" ]] \
            || { echo "degraded run: its line waits for a clean run"; exit 0; }
          # (#605) Append the run's LAST line, never copy its file, and only when it is dated after
          # main's last one: a queued or re-run job checks out an older SHA than main. (#637) That
          # test is .github/scripts/journal-newer-line.sh, which the actionlint job runs on five
          # journals. Sourced, not run: `day` below and the early `exit 0` of an unchanged journal
          # are this step's own.
          . .github/scripts/journal-newer-line.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .screen_snapshots.jsonl
          git commit -m "chore(track): journal the $day ranked snapshot"
          for attempt in 1 2; do
            if git pull --rebase && git push; then
              echo "recorded $day"
              exit 0
            fi
            echo "push attempt $attempt lost a race with a concurrent push; retrying"
          done
          echo "could not push the journal line for $day"
          exit 1

  # Actions housekeeping: a Pages run is superseded the moment the next one starts, so delete this
  # workflow's older COMPLETED runs, failed and cancelled ones included (their logs go with them).
  # Mirrors ci.yml's cleanup-runs job.
  #
  # (#399) This used to sweep `--status success` only and KEEP every red run, because a red log is the
  # only record of why a publish failed (run 32059047479's bare `HttpError: Not Found` was read out of
  # one). Kept forever, though, a red run outlived its cause: 36318617516 — a re-run that #398 fixed —
  # sat in the Actions tab under newer green runs. Now a red log lives until the NEXT run starts (the
  # cron, ~5-20 min): read it before then, or re-run the failed run to keep it on screen.
  #
  # CANCELLED in its own pass, as ci.yml does, whose note says `completed` misses them (a superseded
  # pending run here is cancelled by `concurrency: pages`). If `completed` does cover them, the second
  # pass simply finds nothing.
  #
  # `--status completed` cannot match the run doing the sweeping — it is still `in_progress` when the
  # filter is applied — so "previous" needs no keep-the-newest bookkeeping. Per-id `|| true` so one
  # undeletable run never reddens the page. No `if:` guard is needed either, unlike ci.yml's copy:
  # that one runs on `pull_request` too and must exclude merge refs, while this workflow triggers
  # only on `push: branches: [main]`, the cron and dispatch.
  #
  # (#132) NO `needs:`, SO THIS RACES THE DEPLOY — CHOSEN, NOT OVERLOOKED. A publish that dies at the
  # fetch, or a deploy that dies at `deploy-pages`, does not stop the sweep, so a red run can leave
  # no earlier run in the history to diff against — only itself, until the next run sweeps it too.
  #
  # Deleting a run does NOT delete its Pages deployment or take the site down. The live page is served
  # from Pages storage, not from the run's artifact: deployment 5949614221 is still listed under the
  # github-pages environment with no surviving workflow run behind it.
  cleanup-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job-level permissions REPLACE the workflow block, so this job holds `actions: write` and none of
    # the deploy job's `pages: write` / `id-token: write`. Deleting runs must not carry deploy rights.
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in completed cancelled; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --status "$status" --limit 200 --json databaseId -q '.[].databaseId'); do
              gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
            done
          done
          # (#553) CATCH-ALL, EVERY WORKFLOW: a run that finished 2+ days ago is deleted, whatever made it.
          # The per-workflow sweeps above, in ci.yml and in codeql.yml each name their own workflow, so one
          # added later leaked: 21 Probe, 11 Mutation census, 7 phantom `dynamic/dependabot` and a Renovate
          # run had piled up by 2026-10-11. This lives HERE because the cron is the only clock that always
          # ticks: ci.yml's sweep fires on a human push only (the journal push is GITHUB_TOKEN's, which
          # triggers nothing). A census or probe log is read once and acted on; a receipt keeps its numbers,
          # and a census re-dispatched with the same inputs on the same commit prints the same list.
          # Runs of a still-OPEN PR are its review verdict (#402) and are never touched; once the PR closes,
          # merged or not, its runs go too, failed ones included. REST `status: completed` covers cancelled,
          # failed and skipped; an in-flight run is never listed. The 2 days count from the finish.
          # (#1227) A `Probe dump` run (probe.yml with a `grid`) holds samples dumps a later rescore reads, and
          # deleting a run deletes its artifacts, so it is kept until they expire at 90 days.
          cutoff=$(date -u -d '2 days ago' +%FT%TZ)
          dumps=$(date -u -d '90 days ago' +%FT%TZ)
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName -q '[.[].headRefName]')
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&created=%3C$cutoff" \
              | jq -r --arg cutoff "$cutoff" --arg dumps "$dumps" --argjson open "$open" '.workflow_runs[]
                  | select(.status == "completed" and .updated_at < $cutoff)
                  | select(.display_title != "Probe dump" or .updated_at < $dumps)
                  | select(.event != "pull_request" or (.head_branch as $b | $open | index($b) | not))
                  | .id'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
          # (#562) COUNT CAP, PER WORKFLOW: keep the 20 newest completed runs of each workflow and delete
          # the rest, even when they are younger than 2 days. The cap only bites where runs pile up: a
          # 10-arm probe batch made 67 runs on 2026-10-11. ci/codeql/pages and (#611) automerge already
          # keep ~1 each through their own sweeps, which stay as they are. One probe batch (<= 10 runs)
          # still fits under 20, so its logs survive until they are tallied. Open-PR runs are exempt and
          # are not counted, and so (#1227) are `Probe dump` runs, which the 90-day rule above ends.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=completed" --jq '.workflow_runs[]' \
              | jq -rs --argjson open "$open" '[.[] | select(.display_title != "Probe dump")
                  | select(.event != "pull_request" or (.head_branch as $b | $open | index($b) | not))]
                  | group_by(.workflow_id)[] | sort_by(.created_at) | reverse | .[20:][] | .id'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
          # (#612) DEPENDABOT, NEWEST PER JOB: Dependabot Updates (dynamic, no workflow file) keeps the
          # newest finished run of each job, its title minus " - Update #N": `cargo in /.` is the monthly
          # version check, `cargo in / for serde_json, tokio` one PR's refresh. A newer run of the same job
          # replaces the older log, and a red newest run stays on screen. One run in total would drop the
          # other ecosystem's last log.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=completed" \
              --jq '.workflow_runs[] | select(.path == "dynamic/dependabot/dependabot-updates")' \
              | jq -rs 'group_by(.display_title | sub(" - Update #[0-9]+$"; ""))[] | sort_by(.created_at) | reverse | .[1:][] | .id'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
          # (#1189) CACHE CAP, NEWEST TWO PER FAMILY: every run saves each `folioman-<family>-<run_id>`
          # cache anew and every reader restores by prefix, which takes the newest, so the older copies
          # are never read again. 105 copies of each had piled up by 2026-10-27, 4.7 GB of a 10 GB repo
          # cap, and GitHub evicts by last use, so after two days with no push the rust-cache entries
          # went before them and the next push built cold. A family is the key minus its last
          # `-` segment, per ref; rust-cache's own keys start `v0-rust-` and are not touched.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("folioman-"))' \
              | jq -rs 'group_by([.ref, (.key | sub("-[^-]+$"; ""))])[] | sort_by(.created_at) | reverse | .[2:][] | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || true
          done
