name: Pages

# Publish `screen`'s three #1 rows (stocks / ETFs / crypto) to the repo's GitHub Pages site.
#
# SEPARATE FROM ci.yml ON PURPOSE, and the reason is isolation, not the trigger: nothing in ci.yml
# should have to wait on a ~15-minute network run, and nothing here should be able to break one. The
# two files share no job, no cache key and no permission set.
#
# This file now runs on push as well, so BE CLEAR ABOUT WHAT A RED RUN HERE MEANS. It still gates
# nothing — no pull_request trigger, no required check, no merge to block — but a throttled fetch or
# an expired FMP key will put a red X against the commit that happened to be pushed at the time. That
# X is about the morning's network, not about the code. Read it as "the page did not refresh", never
# as "this commit is bad", and check ci.yml for the verdict that actually judges the commit.
#
# ONE PREREQUISITE, AND IT DOES NOT LIVE IN THIS FILE: the repo's Pages source must be "GitHub
# Actions" (`build_type: workflow`). Turning Pages on defaults it to "Deploy from a branch" instead,
# and against a branch source `deploy-pages` dies with a bare `HttpError: Not Found` — a 404 that
# reads like a missing artifact and is really a missing site. Run 32059047479 spent a full 15-minute
# fetch to find that out, with every step before the deploy already green. Check it with
# `gh api repos/OWNER/REPO/pages --jq .build_type` before blaming anything here.
#
# The repo is public, so the site is public and standard-runner minutes are free. That is not licence
# to relax about what ships: `config/settings.yaml` — the real overlay, holding the watchlist and the
# monthly deploy amount — is gitignored and is NOT public today, and this page must never become the
# thing that publishes it.
#
# (#114) The guard used to be a second committed overlay, `config/web-settings.yaml`. It is gone. The
# run below reads `tests/ci-settings.yaml` — the same file `cargo t` grades — and that file ships
# `tickers: []`, `sectors: []`, `monthly_deploy_eur: 0` and a dummy `ntfy_topic`, asserted by
# `the_published_base_leaks_nothing_and_ranks_on_the_validated_lane`. Privacy is now a property of the
# base rather than of a file that had to be kept in sync with it, and the same test refuses to let a
# second overlay come back.
on:
  schedule:
    - cron: "*/5 * * * *" # every 5 min
  # Republish whenever main moves, so a heuristic change is visible on the page immediately instead of
  # at 05:30 the next weekday. NO `paths` filter, deliberately: the rows are a live universe fetch, so
  # what the page shows depends on the market as much as on the diff, and a docs-only push simply
  # refreshes it. Runner minutes are free on a public repo and the FMP key is optional, so the cost of
  # a wasted run is a wasted run. An allowlist would be the thing that silently stopped rebuilding the
  # day someone added a source directory to it and forgot this file.
  #
  # A push during the cron does NOT double-deploy: `concurrency: pages` serialises them, and the
  # second run republishes the same site a few minutes later.
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# Least privilege, plus exactly what deploy-pages needs: `pages: write` to publish and `id-token:
# write` for the OIDC token it trades for a deployment. `contents: read` is the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and NEVER cancel one in flight: a half-finished Pages deployment is how a
# site ends up serving a partial artifact. A superseded run waits its turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # ~2 min build + a full-universe fetch that measures ~5 min warm; 45 leaves room for a bad
    # throttling day without letting a wedged socket burn the 6-hour default.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The fetch caches, restored from the previous run. This is not a nicety: `resolve_eu_listings`
      # alone is documented at ~4 minutes cold, and the SEC facts cache is append-only history that
      # never needs refetching. Keyed by date so each day writes its own entry, with a prefix
      # restore-key so today warms from yesterday.
      #
      # `.long_history_cache.json` is NOT in this list: ci.yml's backtest-gate owns it, and the step
      # after this one borrows it read-only.
      - name: Restore fetch caches
        uses: actions/cache@v6
        with:
          path: |
            .sec_cache
            .isin_cache.json
            .venue_isins.json
            .regulatory_isins.json
            .fund_facts_cache.json
            .holdings_cache.json
            .eu_listing_cache.json
          key: folioman-fetch-${{ github.run_id }}
          restore-keys: folioman-fetch-

      # (#366) The three PERMANENT BLS decades behind the USA 20Y/30Y/40Y inflation cells. `.fmp_cache`
      # is otherwise cold on every run, so each run would re-ask BLS for all three plus the fresh
      # window: 4 keyless calls per run against a 25/day per-IP cap. With this it is 1. Its own step,
      # so adding it did not re-version the fetch cache above. A new calendar year invalidates each
      # decade by content (`old_window_covers`), not by key, and the run refetches it.
      # (#368) And the day-fresh feeds, the EU ones above all. Run 36257549768's two Eurostat GETs came
      # back empty inside the 3s connect timeout, with no copy on disk to fall back on, so the page
      # published EU as "no data" and dropped the 27Y column that EU's span sets. Kept here, a copy under
      # a day old answers without a request, and a failed fetch serves the last good one. tar keeps each
      # file's mtime, which is what that day is measured from.
      - name: Restore the inflation feeds
        uses: actions/cache@v6
        with:
          path: |
            .fmp_cache/us_cpi*.json
            .fmp_cache/pt_cpi.json
            .fmp_cache/eu_hicp*.json
          key: folioman-macro-${{ github.run_id }}
          restore-keys: folioman-macro-

      # (#361) The monthly history backtest-gate saves once a day (#352), READ-ONLY here so that job
      # stays its only writer. `screen` reads it (`quote_one` -> `chart_json_long`, 7-day per-series
      # TTL); an older comment here called it backtest-only, and without it every run fetched each
      # name's `range=max` series live (run 36247201539: 18718 paced calls, 0 cache hits, 343s).
      # The path MUST match ci.yml's: the cache version hashes it. The key never matches exactly, so
      # the prefix restore takes the newest day. After a week with no push the entries age past the
      # TTL and are refetched, which is where this run started, not worse.
      - name: Restore the monthly history cache
        uses: actions/cache/restore@v6
        with:
          path: .long_history_cache.json
          key: folioman-longhist-
          restore-keys: folioman-longhist-

      - name: Build
        run: cargo build --release --locked

      # The run itself. FMP_API_KEY reaches it through `env:` and nothing else — never an argument,
      # never echoed — and it is OPTIONAL: without it the value/quality tilts go neutral, which
      # empties the `#` flag and some columns rather than failing.
      - name: Screen
        env:
          # (#114) THE COMMITTED BASE, DIRECTLY — no overlay. This used to point at
          # config/web-settings.yaml, a second tracked config that merged over this one. That file had
          # grown twelve `buy_heuristic` overrides (including `use_life_cagr: true`, condemned at #3j
          # and again at #3k), so this job published a ranking no receipt in the repo had graded. The
          # overlay is deleted; the page now ranks on exactly what `cargo t` grades.
          #
          # `config::ci_base_yaml` refuses to self-merge a path ending in `ci-settings.yaml`, so this is
          # the pure fixture, and `heuristic_drift` stays quiet for the same reason — correct here,
          # since there is no longer a baseline for it to differ from.
          #
          # ABSOLUTE, deliberately: `data_path` anchors the caches and the payload on the config's
          # GRANDPARENT directory, so this resolves to the workspace root — the same directory the old
          # overlay anchored on, which keeps the fetch caches below keyed to the same paths.
          FOLIOMAN_CONFIG: ${{ github.workspace }}/tests/ci-settings.yaml
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: ./target/release/folioman screen

      # Fail HERE, before the deploy, when the run came back empty. Pages keeps serving the last
      # successful deployment, so a throttled morning leaves yesterday's page up — which the page's
      # own staleness banner then labels — instead of publishing three empty tables. That is the
      # whole fallback: no last-good store to maintain, because not deploying IS the fallback.
      - name: Validate the payload
        run: |
          test -f .screen_web.json || { echo "screen wrote no payload"; exit 1; }
          jq -e '(.stocks | length) + (.etfs | length) + (.crypto | length) > 0' .screen_web.json \
            > /dev/null || { echo "every lane came back empty — not deploying over a good page"; exit 1; }
          jq -r '"generated \(.generated): stocks \(.stocks|length) etfs \(.etfs|length) crypto \(.crypto|length) rows"' .screen_web.json

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp .screen_web.json _site/data.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # (#333) Hand the journal to the `record` job. The file is TRACKED, so the checkout above put
      # the existing record in the workspace and `screen` has just appended to it — or not, if a run
      # earlier today already did. Either way it exists, and `if-no-files-found: error` makes its
      # absence a red run rather than a day that silently went unrecorded.
      #
      # LAST, AFTER THE DEPLOY, ON PURPOSE: publishing the page is this workflow's job and recording
      # the journal is a passenger, so a broken upload must never be what takes the site down. The
      # first attempt at this sat before `Assemble the site` and reddened the run without deploying.
      #
      # `include-hidden-files` IS LOAD-BEARING: upload-artifact skips dotfiles by default, so without
      # it this step reports "No files were found with the provided path" for a file that is sitting
      # right there in the workspace — which is exactly how that first attempt failed.
      - name: Upload the journal
        uses: actions/upload-artifact@v7
        with:
          name: screen-journal
          path: .screen_snapshots.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # (#333) COMMIT THE DAY'S JOURNAL LINE BACK, so the forward record survives the runner.
  #
  # `screen` appends one line per day to `.screen_snapshots.jsonl` and that line is the ONLY record
  # all five of `track`'s forward sections read — the verdict book, the CORE shortlist, the flat twin,
  # the notch shadow covering all 14 gate refusals, and (#332)'s PEG shadow. Every one of them needs
  # 12 MONTHLY lines before its verdict can say anything but "wait" (`track::REOPEN_LINES`). Until
  # this job existed the line died with the ephemeral runner, and the record accrued only when someone
  # ran `screen` locally and kept the file — which it did not survive: 48 lines spanning
  # 2026-07-16..09-08 were lost to a probe's backup/restore, leaving one line behind.
  #
  # ONE COMMIT A DAY, and the cron needs no help to get there. `append_snapshot` returns early when
  # the journal's last line already carries today's date, so the first run of the day appends and this
  # job pushes it; every later run of the ~288 writes nothing, and this job finds a clean diff and
  # pushes nothing.
  #
  # A SECOND JOB RATHER THAN A STEP IN `publish`, and the reason is the FMP key. Job-level permissions
  # REPLACE the workflow block, so this job holds `contents: write` and none of publish's
  # `pages: write` / `id-token: write` — while `publish`, which is the job that sees
  # `secrets.FMP_API_KEY`, keeps `contents: read`. Nothing that can push to main ever holds the key.
  #
  # NO LOOP: a push authored by GITHUB_TOKEN does not trigger workflows, so this cannot re-enter
  # `on: push`. If that ever changed, the same-date guard above makes the triggered run a no-op.
  # The workflow-level `concurrency: pages` serialises runs, so two of our own pushes cannot race;
  # the rebase-and-retry below is for a HUMAN push landing between this job's checkout and its push.
  record:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: screen-journal
      - name: Commit today's line
        run: |
          if git diff --quiet -- .screen_snapshots.jsonl; then
            echo "journal unchanged — today's line was already recorded"
            exit 0
          fi
          # The date comes from the line itself, not from `date`, so a run crossing midnight UTC
          # cannot label a snapshot with a day it was not taken on.
          day=$(tail -n 1 .screen_snapshots.jsonl | jq -r .date)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .screen_snapshots.jsonl
          git commit -m "chore(track): journal the $day ranked snapshot"
          for attempt in 1 2; do
            if git pull --rebase && git push; then
              echo "recorded $day"
              exit 0
            fi
            echo "push attempt $attempt lost a race with a concurrent push; retrying"
          done
          echo "could not push the journal line for $day"
          exit 1

  # Actions housekeeping: a Pages run is superseded the moment the next one deploys, so delete this
  # workflow's older SUCCESSFUL runs (their logs go with them). Mirrors ci.yml's cleanup-runs job,
  # with one deliberate difference: `--status success`, NOT `completed`.
  # A red run is the only record of why a morning failed to publish — the bare `HttpError: Not Found`
  # that cost run 32059047479 a full 15-minute fetch to diagnose was read out of exactly such a log —
  # so failed and cancelled runs are KEPT here, deliberately, however long they accumulate.
  #
  # `--status success` cannot match the run doing the sweeping — it is still `in_progress` when the
  # filter is applied — so "previous" needs no keep-the-newest bookkeeping. Per-id `|| true` so one
  # undeletable run never reddens the page. No `if:` guard is needed either, unlike ci.yml's copy:
  # that one runs on `pull_request` too and must exclude merge refs, while this workflow triggers
  # only on `push: branches: [main]`, the cron and dispatch.
  #
  # (#132) NO `needs:`, SO THIS RACES THE DEPLOY — CHOSEN, NOT OVERLOOKED. It used to carry
  # `needs: publish` and that line was documented here as a safety: history was swept only after a new
  # good deploy existed, never while this run might still fail. Running in parallel gives that up. The
  # failure case is now real: a publish that dies at the fetch or at `deploy-pages` no longer stops the
  # sweep, so a red morning can leave NO successful run in the history to diff against — only the red
  # one. That was accepted deliberately, for parity with ci.yml's unguarded cleanup and because the
  # log this job exists to protect is the FAILED one, which `--status success` never matches.
  # A `tail -n +2` on the id list would buy the old safety back for one pipe if that trade ever bites.
  #
  # Deleting a run does NOT delete its Pages deployment or take the site down. The live page is served
  # from Pages storage, not from the run's artifact: deployment 5949614221 is still listed under the
  # github-pages environment with no surviving workflow run behind it.
  cleanup-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions REPLACE the workflow block, so this job holds `actions: write` and none of
    # the publish job's `pages: write` / `id-token: write`. Deleting runs must not carry deploy rights.
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --status success --limit 200 --json databaseId -q '.[].databaseId'); do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
