name: Probe
# (#1227) A `grid` run is titled `Probe dump`, so pages.yml's sweep can keep its dumps 90 days.
run-name: Probe${{ inputs.grid != '' && ' dump' || '' }}

# (#548) A `backtest` run graded on CI, not on the local PC (USER DECISION 2026-10-11: CI runs what CI
# already runs). ci.yml's backtest-gate runs the same binary on the same caches, but through
# tests/network.rs, which prints only the lines the gate votes on, and never with `pit`. This prints the
# whole report — every fund factor's AUC, the held-book and survival rows — for a factor or knob probe.
# Read it with `gh run view <id> --log`, and check `windows scored` on every horizon before grading.
# Read it within 2 days: (#553) pages.yml's catch-all deletes every run 2 days after it finishes, except
# (#1227) a `grid` run, kept 90 days.
#
# MANUAL ONLY, and it never writes a cache Pages or the gate read. The caches it saves are (#559)'s
# `folioman-fec-`, (#728)'s `folioman-fail-` and (#752)'s `folioman-tiingo-`, which only a `pac` /
# `failures` / (#756) `dead` + `fill` probe fills and nothing else restores.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "backtest horizons, one run each (space-separated)"
        default: "12 8"
      args:
        description: "backtest args after the horizon"
        default: "universe fund pit"
      knobs:
        description: "(#550) ci-settings overrides for this run only, space-separated key=value (numbers only)"
        default: ""
      extra:
        description: "(#742) growth_fund_extra terms added for this run only, space-separated factor:weight:cap:neutral"
        default: ""
      bless:
        description: "(#554) re-bless tests/fixture/*.golden instead of a backtest; uploads them as an artifact"
        type: boolean
        default: false
      fill:
        description: "(#756) a `dead` probe also fetches the next Tiingo names and saves the cache; one fill run at a time, never an A/B arm"
        type: boolean
        default: false
      grid:
        description: "(#1227) a JSON array of buy_heuristic rows, e.g. [{}, {\"growth_accel_weight\": 0}]: each horizon also dumps its samples (encrypted, kept 90 days) and `backtest rescore` re-runs the books once per row"
        default: ""

# No concurrency group (#550): a probe saves no shared cache (each FEC save is keyed on its own run id), so arms dispatched together run in parallel.
# (#752) Tiingo fills are the exception: dispatch them one at a time, an hour apart (see the fill step).
# A shared group kept one run going and one pending, and a third dispatch silently cancelled the pending one.
permissions:
  contents: read

# Copied from ci.yml's top-level env; they MUST stay identical, or rust-cache computes a key of its own
# (see mutation-census.yml).
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.grid != '' && 180 || 60 }} # (#1227) a grid run walks each horizon twice, then rescores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # backtest-gate's release deps, or (#554) integration-tests' debug deps for a bless; each keeps its
      # own single writer. (#635) Two steps, because folioman-test's writers set CARGO_PROFILE_DEV_DEBUG
      # at job level and rust-cache hashes it into the key: the bless restore needs it, the gate's must
      # not see it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.bless }}
        with:
          shared-key: folioman-gate
          save-if: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.bless
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        with:
          shared-key: folioman-test
          save-if: false
      # The three restores below MUST stay identical to backtest-gate's in ci.yml (the path list is
      # hashed into the cache version, and any difference silently misses).
      - name: Restore Pages' fetch caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sec_cache
            .isin_cache.json
            .venue_isins.json
            .regulatory_isins.json
            .fund_facts_cache.json
            .holdings_cache.json
            .eu_listing_cache.json
          key: folioman-fetch-${{ github.run_id }}
          restore-keys: folioman-fetch-
      - name: Restore Pages' IPO cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ipo_cache.json
          key: folioman-ipo2-${{ github.run_id }}
          restore-keys: folioman-ipo2-
      - name: Restore Pages' Wikidata listings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .wikidata_listings.json
          key: folioman-wikidata-${{ github.run_id }}
          restore-keys: folioman-wikidata-
      - name: Restore the gate's history cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .long_history_cache.json
          key: folioman-longhist-${{ github.run_id }}
          restore-keys: folioman-longhist-
      # (#559) FEC bulk breadth per cycle + SEC former names, for `backtest … pac` only.
      - name: Restore the FEC cache
        if: ${{ contains(inputs.args, 'pac') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .fec_cache
          key: folioman-fec-${{ github.run_id }}
          restore-keys: folioman-fec-
      # (#728) the failure library's SEC facts by CIK, for `backtest … failures` only. A dead filer files
      # nothing new, so the rows are kept forever and each run only fetches the CIKs it has not seen.
      - name: Restore the failure cache
        if: ${{ contains(inputs.args, 'failures') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .fail_cache
          key: folioman-fail-${{ github.run_id }}
          restore-keys: folioman-fail-
      # (#752) Tiingo's bars of exited S&P members, for `backtest … pit dead` only. Licensed for personal
      # use and the repo is public, so the cache holds them encrypted with the key: a fork's pull_request
      # run can restore this repo's caches but gets no secret. A wrong or rotated key drops the file, and
      # the fills start over.
      - name: Restore the Tiingo cache
        if: ${{ contains(inputs.args, 'dead') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tiingo_dead_members.csv.enc
          key: folioman-tiingo-${{ github.run_id }}
          restore-keys: folioman-tiingo-
      - name: Decrypt the Tiingo cache
        if: ${{ contains(inputs.args, 'dead') }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          [[ -f .tiingo_dead_members.csv.enc && -n $TIINGO_API_KEY ]] || exit 0
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TIINGO_API_KEY -in .tiingo_dead_members.csv.enc -out .tiingo_dead_members.csv \
            || { rm -f .tiingo_dead_members.csv; echo "::warning::the Tiingo cache did not decrypt, so this run reads the archive alone"; }
      - name: backtest
        if: ${{ !inputs.bless }}
        env:
          FOLIOMAN_CONFIG: tests/ci-settings.yaml
          YEARS: ${{ inputs.years }}
          ARGS: ${{ inputs.args }}
          KNOBS: ${{ inputs.knobs }}
          EXTRA: ${{ inputs.extra }}
          GRID: ${{ inputs.grid }}
          # (#1227) every horizon grades one universe, as backtest-gate's do. A grid run's dump walk must
          # also see the names its report walk saw, or `rescore` row {} would not reprint that report.
          FOLIOMAN_UNIVERSE_SNAPSHOT: ${{ runner.temp }}/universe.json
        # Inputs reach the shell only through env and `read -ra`, never as interpolated script text.
        run: |
          read -ra years <<< "$YEARS"
          read -ra args <<< "$ARGS"
          read -ra knobs <<< "$KNOBS"
          read -ra extra <<< "$EXTRA"
          # (#550) an arm edits the checked-out yaml in place: each key must already sit on exactly one
          # `  key:` line and the value must be a plain number, so a typo fails the run instead of grading
          # the control under an arm's name. (#570) `true`/`false` too, for the bool knobs.
          for kv in "${knobs[@]}"; do
            k=${kv%%=*}; v=${kv#*=}
            [[ $kv == *=* && $k =~ ^[a-z0-9_]+$ && $v =~ ^(-?[0-9]+(\.[0-9]+)?|true|false)$ ]] || { echo "::error::bad knob '$kv'"; exit 1; }
            [[ $(grep -c "^  $k: " tests/ci-settings.yaml) == 1 ]] || { echo "::error::'$k' is not one ci-settings line"; exit 1; }
            sed -i -E "s/^(  $k: )[^ ]+/\1$v/" tests/ci-settings.yaml
            grep "^  $k: " tests/ci-settings.yaml | cut -c1-80
          done
          # (#742) a knob cannot add an item to a list, so a term arm appends to `growth_fund_extra`. The
          # factor must be a name `select_fund_factor` routes: an unknown one reads None and grades the
          # neutral fill as a constant under the factor's name.
          for t in "${extra[@]}"; do
            IFS=: read -r f w c n <<< "$t"
            num='^-?[0-9]+(\.[0-9]+)?$'
            [[ $f =~ ^[a-z0-9_]+$ && $w =~ $num && $c =~ $num && $n =~ $num && $t == "$f:$w:$c:$n" ]] || { echo "::error::bad extra '$t'"; exit 1; }
            grep -q "^        \"$f\" =>" src/core.rs || { echo "::error::'$f' is not a fund factor"; exit 1; }
            [[ $(grep -c '^  growth_fund_extra:$' tests/ci-settings.yaml) == 1 ]] || { echo "::error::no growth_fund_extra list"; exit 1; }
            sed -i -E "s/^(  growth_fund_extra:)$/\1\n    - {factor: $f, weight: $w, cap: $c, neutral: $n}/" tests/ci-settings.yaml
            grep -A1 '^  growth_fund_extra:$' tests/ci-settings.yaml
          done
          # (#1227) one grid row per line, the shape `backtest rescore` reads.
          if [[ -n $GRID ]]; then
            jq -c 'if type == "array" then .[] else error("the grid must be a JSON array") end' <<< "$GRID" > grid.jsonl
          fi
          cargo build --locked --release
          for y in "${years[@]}"; do
            echo "::group::backtest $y ${args[*]}"
            ./target/release/folioman backtest "$y" "${args[@]}"
            echo "::endgroup::"
            # (#1227) the dump run stops before any report, so it walks the horizon a second time. Row {} of
            # the rescore must reprint the report's own top-10 line; a row that differs is the arm's cost.
            if [[ -n $GRID ]]; then
              FOLIOMAN_BACKTEST_SAMPLES=samples-$y.jsonl ./target/release/folioman backtest "$y" "${args[@]}"
              echo "::group::rescore $y"
              ./target/release/folioman backtest rescore "samples-$y.jsonl" grid.jsonl
              echo "::endgroup::"
            fi
          done
      # (#752) After the backtests, because the `pit` run writes the membership spans it reads. It fetches
      # up to 45 names a run (a free key allows 50 requests an hour), so dispatch fills one at a time, an
      # hour apart: `years=8 args="universe pit dead" fill=true`. Once every candidate is answered, a run
      # asks nothing. Progress is encrypted even when the tool stops on an error. (#756) Only a `fill` run
      # fills and saves: an A/B's `dead` arms run in parallel, so each spent the key and saved its own
      # copy, the newest save won the next restore, and a new month's first arm saved a restarted file.
      - name: Fill the Tiingo cache
        if: ${{ !cancelled() && !inputs.bless && inputs.fill && contains(inputs.args, 'dead') }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          [[ -n $TIINGO_API_KEY ]] || { echo "::notice::no TIINGO_API_KEY secret, so nothing to fill"; exit 0; }
          [[ -f .sp500_history.json ]] || { echo "::warning::no membership spans, so nothing to fill: run with pit"; exit 0; }
          rc=0
          python3 -I tools/dead_members_from_tiingo.py || rc=$?
          if [[ -f .tiingo_dead_members.csv ]]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TIINGO_API_KEY -in .tiingo_dead_members.csv -out .tiingo_dead_members.csv.enc
          fi
          exit $rc
      - name: Save the Tiingo cache
        if: ${{ !cancelled() && inputs.fill && contains(inputs.args, 'dead') && hashFiles('.tiingo_dead_members.csv.enc') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tiingo_dead_members.csv.enc
          key: folioman-tiingo-${{ github.run_id }}
      - name: Save the FEC cache
        if: ${{ !cancelled() && contains(inputs.args, 'pac') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .fec_cache
          key: folioman-fec-${{ github.run_id }}
      - name: Save the failure cache
        if: ${{ !cancelled() && contains(inputs.args, 'failures') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .fail_cache
          key: folioman-fail-${{ github.run_id }}
      # (#1227) A grid run's dumps, for a later rescore on the same samples. Their rows are priced from
      # Tiingo and Yahoo bars and the repo is public, so each horizon's dump and bench file are packed and
      # encrypted with the Tiingo key, as the cache above is. Unpack with
      # `openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TIINGO_API_KEY -in <file> | tar xzf -`.
      - name: Encrypt the samples dumps
        if: ${{ !cancelled() && !inputs.bless && inputs.grid != '' }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          [[ -n $TIINGO_API_KEY ]] || { echo "::warning::no TIINGO_API_KEY secret, so the dumps are not kept"; exit 0; }
          for f in samples-*.jsonl; do
            [[ -f $f ]] || continue
            tar czf - "$f" "$f.bench.json" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TIINGO_API_KEY -out "$f.tgz.enc"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && !inputs.bless && inputs.grid != '' }}
        with:
          name: samples
          path: samples-*.jsonl.tgz.enc
          if-no-files-found: ignore
          retention-days: 90
      # (#1225) A `pit dead` run journals the SIZED record `screen` cites under BUY NOW, but only on this
      # runner. Upload it so the row can be copied into a local journal without a local run. It is graded
      # on tests/ci-settings.yaml, so a local `screen` on other settings prints it with its drift warning.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && !inputs.bless && contains(inputs.args, 'dead') }}
        with:
          name: sized-journal
          path: .backtest_sized.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 2
      # (#554) A knob ship moves a frozen-data golden, and the CI log prints only its FIRST changed line.
      # This writes every `*report_is_pinned` golden at the dispatched commit, in the debug profile
      # integration-tests checks them in, and uploads them: download, review the diff, commit. Each
      # pinned test writes its own file; the invariance tests that only READ a golden are not run.
      - name: bless goldens
        if: inputs.bless
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only   # (#635) builds what the folioman-test restore holds
        run: FOLIOMAN_BLESS=1 FOLIOMAN_CONFIG=tests/ci-settings.yaml cargo test --locked --test backtest_fixture -- report_is_pinned --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.bless
        with:
          name: goldens
          path: tests/fixture/*.golden
          retention-days: 2
