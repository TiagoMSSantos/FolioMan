# (#589) Merges the bot PRs in the owner's auto-merge scope once every check on the PR is green:
# Dependabot's `actions` and `cargo` groups (.github/dependabot.yml) and the Renovate app's
# web/engine lock maintenance and wasm-bindgen pair (.github/renovate.json5). The cargo-mutants PR
# is never on the list: (#354) a census dispatch must re-prove the gate on a new version first.
#
# (#610) It runs when a CI, CodeQL, probe or census run completes, so a PR merges about a minute
# after its last check goes green, and a merge held by a busy main retries when the run holding it
# ends. An hourly cron backs that up: a young Renovate head has no event to wait on, and GitHub can
# drop scheduled runs under load. It reads nothing from the event: each run lists the PRs itself.
# Not Renovate's own automerge (it cannot see whether main is busy, and it skips Dependabot). It
# merges only while no CI, CodeQL, probe or census run is in flight on main, so a bot push never
# cancels an owner run (cancel-in-progress per ref) or lands inside a probe batch. One merge per
# run, so the next run sees that merge's main CI.
#
# It holds while main's newest finished CI run is red. No finished run at all (the (#553) 2-day
# sweep deletes them) is not a hold. Pages is not read: each Pages run deletes the ones before it,
# red ones too, and its reds are the morning's network, not the code (pages.yml's header).
#
# It never checks out or runs PR code. RENOVATE_TOKEN, a fine-grained PAT on this repo (Contents,
# Pull requests and Workflows read/write; Workflows to merge an actions bump), makes the merge: a
# push made with GITHUB_TOKEN would start no CI, CodeQL or Pages run on main. If the PAT expires,
# the run reds and nothing merges. Convert a PR to draft to hold it.
name: automerge

on:
  workflow_run:
    workflows: [CI, CodeQL, Probe, Mutation census]
    types: [completed]
  schedule:
    - cron: "41 * * * *"   # hourly, off the top of the hour, when GitHub's load peaks
  workflow_dispatch:
    inputs:
      dry_run:
        description: "report what would merge, merge nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Merge one green bot PR
        env:
          MERGE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          api() { gh api "repos/${GH_REPO}/$1"; }
          for wf in ci.yml codeql.yml probe.yml mutation-census.yml; do
            busy=$(api "actions/workflows/${wf}/runs?branch=main&per_page=30" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "${busy}" -ne 0 ]; then echo "${wf}: ${busy} run(s) in flight on main, next tick"; exit 0; fi
          done
          last=$(api "actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=30" \
            | jq -r '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].conclusion // "none"')
          if [ "${last}" != success ] && [ "${last}" != none ]; then echo "ci.yml: last main run is ${last}, holding"; exit 0; fi
          need='["build","lint","doc","wasm","audit","actionlint","unit-tests","unit-tests-configless","coverage","integration-tests","backtest-gate","mutants 0","mutants 1","Analyze (rust)"]'
          gh pr list --base main --state open --limit 50 \
            --json number,author,headRefName,headRefOid,isDraft,isCrossRepository,mergeable \
            --jq '.[] | select((.isDraft | not) and (.isCrossRepository | not)
                and (.author.login == "app/renovate" or .author.login == "app/dependabot")
                and (.headRefName | test("^(dependabot/github_actions/actions-[0-9a-f]+|dependabot/cargo/cargo-[0-9a-f]+|renovate/lock-file-maintenance|renovate/rust-wasm-bindgen-monorepo)$")))
              | "\(.number) \(.headRefOid) \(.headRefName) \(.mergeable)"' |
          while read -r pr sha ref mergeable; do
            # (#610) GitHub works out mergeability lazily, and a push to main resets it. The list call
            # starts the check, so an UNKNOWN PR is read once more; it used to drop out silently, and
            # the second PR of a pair waited for the next run.
            if [ "${mergeable}" = UNKNOWN ]; then
              sleep 20
              mergeable=$(gh pr view "${pr}" --json mergeable --jq .mergeable)
            fi
            if [ "${mergeable}" != MERGEABLE ]; then echo "#${pr}: mergeable is ${mergeable}"; continue; fi
            # Supply-chain delay: a Renovate head is 3 days old, so a bad release has time to be
            # yanked. A refreshed head restarts the clock. (#610) Dependabot PRs skip this: their
            # cooldown (.github/dependabot.yml) proposes only versions out 3 days. Renovate sets no
            # release age, and one would not cover lock maintenance's `cargo update`. `made` is read
            # apart from the arithmetic, where a failed call would count as age 0 and pass.
            if [[ ${ref} == renovate/* ]]; then
              made=$(api "commits/${sha}" | jq -e '.commit.committer.date | fromdate')
              age=$(( $(date +%s) - made ))
              if [ "${age}" -lt 259200 ]; then echo "#${pr}: head is $(( age / 3600 ))h old"; continue; fi
            fi
            # Every check run finished green, and each CI job plus CodeQL's rust leg ran (not skipped).
            if ! api "commits/${sha}/check-runs?per_page=100" | jq -e --argjson need "${need}" '
                .check_runs as $r
                | ($r | all(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral"))))
                  and ($need | all(. as $n | $r | any(.name == $n and .conclusion == "success")))' > /dev/null; then
              echo "#${pr}: checks not all green"; continue
            fi
            # No commit status, or all green: a head with none reads `pending` with total_count 0.
            if ! api "commits/${sha}/status" | jq -e '.total_count == 0 or .state == "success"' > /dev/null; then
              echo "#${pr}: commit status not green"; continue
            fi
            if [ "${DRY_RUN}" = true ]; then echo "would merge #${pr} at ${sha}"; exit 0; fi
            # --match-head-commit: a push to the PR after these checks aborts the merge.
            GH_TOKEN="${MERGE_TOKEN}" gh pr merge "${pr}" --rebase --match-head-commit "${sha}"
            echo "merged #${pr} at ${sha}"
            exit 0
          done

  # (#611) Each run deletes this workflow's older finished runs, red and cancelled ones too, as
  # pages.yml's (#399) sweep does for Pages. It fires on every CI, CodeQL, probe and census finish
  # plus hourly, 20-40 times a day, nearly all no-ops ("in flight on main, next tick"), so it sat at
  # pages.yml's (#562) 20-run cap. A red run's log lives until the next run starts; while its cause
  # lasts (an expired PAT) each later run reds the same way, so the newest run still shows it. A
  # merge's record is the PR itself. Its own job, so the merge job's token stays read-only. The
  # concurrency group runs one at a time, and `completed` never lists this run or a pending one.
  cleanup-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in completed cancelled; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow automerge.yml --status "$status" --limit 200 --json databaseId -q '.[].databaseId'); do
              gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
            done
          done
