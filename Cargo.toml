[package]
name = "folioman"
version = "0.1.0"
edition = "2021"
description = "Personal investment-review CLI (price/perf/screen/alert) + opt-in live trading (trade212/binance)."

[[bin]]
name = "folioman"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "cookies"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }  # `raw_value` = the long-history cache holds byte spans, not parsed trees (see `long_cache_load`)
serde_yaml = "0.9"   # archived upstream but stable; swap for serde_norway if it ever breaks
regex = "1"
# `serde` is here for ONE cache: `.sp500_history.json` stores NaiveDate spans directly rather than
# round-tripping them through strings by hand. No new crate — serde is already a dependency.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hmac = "0.12"        # Binance order signing (HMAC-SHA256)
sha2 = "0.10"
md-5 = "0.10"        # Börse Frankfurt API request signing (MD5 trace/security headers)
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }  # FIRDS FULINS_C weekly zips (ESMA/FCA ETF universe)
rayon = "1"          # CPU parallelism for the backtest walk + sweeps; tokio's pool is for I/O and `buffer_unordered` is one task on one thread
mutants = "0.0.4"   # no-op attribute shim: `#[mutants::skip]` marks the handful of functions cargo-mutants CANNOT grade (see src/broker/*.rs). Compiles to nothing, pulls in nothing

# No `unsafe` in this crate and none wanted. Declared here rather than as `#![forbid(unsafe_code)]`
# in lib.rs because `src/main.rs` is a separate crate root that an inner attribute in the library
# would not reach; the table covers every target, including tests, from one place.
[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
# (#68) On, because the two profiles disagreed about integer overflow and only the wrong one was
# tested. `[profile.mutants]` inherits `dev`, so overflow-checks were already on under `cargo t` —
# while this profile, which builds both the daily screen and CI's `backtest-gate`, set only the two
# lines above and left them off. Every integer bug was therefore a loud panic in the suite and a
# silent wrap in the artifact that handles money. (#66) was exactly that: a per-tier counter typed
# `u8` that wrapped at 256 and let the tier admit three more rows, unobservable from any test.
# Costs nothing measurable here — overflow-checks instruments integer add/sub/mul/neg/shift, and the
# backtest's hot loop is `f64`, which is not instrumented at all.
overflow-checks = true

# Killing-suite profile for `cargo mutants`. The report pin (tests/backtest_fixture.rs) replays 200
# tickers of history six times, which at `dev`'s opt-level 0 costs 38s per mutant against an 11s
# rebuild — the mutation run is then 80% arithmetic that optimises away for free. `opt-level = 2`
# with no debuginfo turns that into a build-bound run. Not `release`: `lto = true` there costs more
# link time per mutant than it saves.
#
# The same trade-off is what the offline test loop wants, so `cargo t` (.cargo/config.toml) runs on
# this profile too — 6-9s for the whole non-network suite against 400.8s under `--release`. The name
# is now load-bearing for both; renaming it would also need the `--profile mutants` in ci.yml.
[profile.mutants]
inherits = "dev"
opt-level = 2
debug = false
