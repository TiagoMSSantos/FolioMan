                                 #   to the digit at 20y and 12y and differ by 5 scored windows out of 1158 at 8y.
                                 #   `horizon_changes` fills the 2Y leg whenever 2y of history exists, so the 1Y
                                 #   rung only ever catches a name with 1-2y of record that ALSO survives the full
                                 #   forward horizon — a cohort that barely exists. The rung is kept (it is what
