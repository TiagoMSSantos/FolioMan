                                 #   at every horizon (+5.8->+6.2, +6.4->+6.9, +7.0->+7.7) while rank-1 and h2h
                                 #   collapse. Read h2h. At 8y the arm's mean rank-1 is nearly flat (+7.2->+7.0)
                                 #   but its MEDIAN drops +8.2->+5.8 — fatter tails, worse typical outcome, which
                                 #   is the wrong trade for a buy-and-hold book.
                                 #   Knob KEPT at the default so the null stays reproducible via the ablation row
                                 #   and the curve, exactly as growth_trust_ladder is kept. Do not re-propose the
                                 #   admit-young idea as another multiplier; the next attempt has to change what
                                 #   gets ADMITTED or how the score is BUILT, not what it is multiplied by.

  # (B) Value-trap dock: a name bleeding for YEARS (1Y AND 5Y both deep red) is not a dip — dock it.
  sustained_decline_pct: -40.0   # [FOIL] both 1Y and 5Y must be <= this to count as a multi-year bleed
  sustained_decline_penalty: 0.4 # [FOIL] score ×this when that holds (0..1; lower = harsher)
  # Harsher tier for a 7y+ deep bleed (e.g. LTC: 5Y -73% riding an ancient 10Y pump): if the 5Y is
  # past deep_decline_pct, use the steeper deep_decline_penalty instead of the -40% one.
  deep_decline_pct: -70.0        # [FOIL] 5Y <= this = a years-deep bleed, not a recoverable dip
  deep_decline_penalty: 0.15     # [FOIL] score ×this then (lower than sustained_decline_penalty)

  # (A) Hide ranked rows scoring <= this so the per-class tables stop padding to top_picks with
  # near-the-high names (score ~1-2 = not really "on sale"). Fewer rows when few names qualify.
  min_score: -100.0              # [FOIL] on-sale trim. (The LIVE growth equivalent is growth_min_score below.) 0 = show all
                                 #   EVERY NEGATIVE VALUE IS THE SAME VALUE (read off the code 2026-08-02, no run needed):
                                 #   `ranked` trims with `*s > min_score.max(0.0)` (picks.rs), so the floor is CLAMPED AT 0
                                 #   and -20, -100 and -1e6 all mean the identical "show everything above 0". Turning this
                                 #   more negative is not a knob turn and no backtest can separate the settings. The -20 here
                                 #   is therefore cosmetic — it documents intent, not behaviour. To actually admit
                                 #   negative-scored on-sale rows, the clamp has to go first; that is a code change, not config.
                                 #   (Deliberately NOT done: the trim's whole job is dropping near-the-high padding rows.)

  # (C) Structural-cheap reward: how far below the ~200wk trend line (SMA = Simple Moving Average) the
  # price sits. Complements the OFF-HI drawdown (distance below the peak) with "cheap vs the long trend".
  cheap_weight: 0.07             # [FOIL] (#4) reward per % below the 200wk SMA — halved from 0.15: "structural cheap"
                                 #   is another dip term the backtest doesn't reward; demoted toward trend/quality.
  cheap_cap: 60.0                # [FOIL] cap the below-SMA % fed in

  # --- SCORE — SHARED / LIVE tilts (read by the growth lane `screen` prints) ---
  # (D) Dividend reward: REVIVED 2026-07-25 at 0.5, now scored NET of Portuguese tax (see tax_keep_*).
