# CANONICAL BASE config — the full, documented, shared configuration. NO secrets: ntfy_topic is a dummy
# (the tests never push), every URL below is a public, unauthenticated endpoint. THREE consumers:
#   - network-smoke (per-PR): only urls.yahoo_chart is exercised.
#   - backtest-gate (nightly + push/PR): runs `backtest 12 universe`, scoring with buy_heuristic below.
#   - the private config/settings.yaml INHERITS this file (config::load deep-merges it as the base), so the
#     gitignored local overlay only OVERRIDES what it changes. By convention it now carries ONLY the
#     watchlist (tickers), the table column layout (widths), and any local secret (a real ntfy_topic) or
#     knob under test — EVERYTHING ELSE lives HERE. Overlay wins field-by-field. Edit shared config HERE.
# Omitted knobs fall back to the code's #[serde(default)] (== the shipped defaults).
tickers: []

# --- `check` / `alert` / `perf` display + scan knobs (display/report only — NOT scored by the backtest gate) ---
# OFF-HI anchor: 0 = drawdown vs the ALL-TIME high over the fetched ~10y history (recommended for a
# decades buy-and-hold: "on sale vs the proven peak", pairs with the below-200wk-SMA cheap reward).
# Or set N days for a trailing-N-day high (365 = last year only, recency-biased; 1825 = ~5y cycle).
high_days: 0
drawdown_pct: 1000.0
dip_days: 30       # trailing window (days) for the vs-high dip
drop_pct: 5.0      # `alert` fires when a name is >= this % below that window high
top_picks: 20      # how many "buy candidate" rows `check` lists after the table
# deploy-math base (€ you put in per month): `screen` prints "DEPLOY THIS MONTH: €base × entry-state
# multiplier" (near-high 1×, pullback 1.5×, drawdown 2× — the backtest's deploy-faster shape). 0 = line
# off. PERSONAL number — set it in the private config/settings.yaml overlay, never here.
monthly_deploy_eur: 0

# Per-horizon ±days averaged around each horizon's anchor date when computing 1D/1W/.../20Y %
# changes (smooths a single outlier day; 0 = exact day). All optional — omit the block or any
# label to use the built-in defaults (core::default_anchor_half): 1D 0, 1W 7, 1M 30, 6M/1Y 90,
# 5Y/10Y/20Y 365. Override only the labels you want to change.
anchor_windows:
  1D: 0
  1W: 3
  1M: 15
  6M: 91
  1Y: 182
  5Y: 365
  10Y: 365
  20Y: 365

# Show REAL (inflation-adjusted) returns on the 1Y/5Y/10Y/20Y % columns instead of nominal. A
# coin/stock up +50% over a span that saw +10% inflation is really only ~+36% in purchasing power.
# Deflates by the ACTUAL cumulative EU HICP inflation over each horizon, fetched live (same source
# as the check footer) — no rate to guess. Shorter horizons (1D/1W/1M/6M) are never adjusted.
inflation_adjust:
  enabled: true       # true = deflate long-horizon returns by live EU HICP; false = raw nominal %

# ============================================================================================
# BUY HEURISTIC (src/picks.rs). Acronyms (CAGR, ROE, P/E, NUPL, SMA, FX, ...): see Glossary in README.md.
#
# This is the COMMITTED, canonical base. BOTH the backtest-gate scores AND the live `screen` read it:
# the gitignored config/settings.yaml deep-merges OVER this file field-by-field, so the local overlay
# only needs to carry what it OVERRIDES (a secret, the watchlist, or a knob under test). Edit a value
# here to move the validated default for everyone; the rich "why" comments below are the shared record.
#
# There are TWO scoring lanes, and `screen` prints ONLY ONE of them:
#
#   • GROWTH lane (`growth_score`)  --> THIS is what `screen` prints. Proven compounders at/near
#       their own ~10y high, still climbing — the only lane with a validated forward edge. Live score:
#         base  = growth_trend_weight·CAGR + growth_accel_weight·accel + risk + quality + dividend
#         score = base · proximity · value(P/E tilt) · geomean(trust, overext_brake) + liquidity
#       (CAGR = Compound Annual Growth Rate; accel = how much the last 1Y outpaced that CAGR.)
#
#   • ON-SALE lane (`buy_score`)    --> BACKTEST FOIL ONLY. `screen` does NOT print this. It exists so
#       `cargo run -- backtest` can demonstrate that dip-buying has NEGATIVE edge over a 20yr+ hold.
#       Every knob tagged "[FOIL]" feeds ONLY this lane: changing it does NOT change `screen` output.
#
# So to tune what `screen` shows, touch ONLY the knobs NOT tagged "[FOIL]". GATES drop a candidate
# outright (and reshape the ranking the most — tune these first); SCORE knobs only re-rank the
# survivors. All knobs optional (omit any -> built-in default). See README.md "Tuning the buy heuristic".
# ============================================================================================
buy_heuristic:
  # --- GATES (fail any one -> excluded before scoring) ---
  min_1y_pct: -25.0              # [FOIL] on-sale only: reject if 1Y % <= this (the growth lane reads growth_min_1y_pct below, not this)
  growth_min_1y_pct: 0.0         # LIVE (equities): the growth lane's 1Y floor — reject if 1Y % <= this. 0.0 = must be climbing this year.
                                 #   Was a hardcoded 0.0 until the knob was restored; this value is the constant it replaced, so shipping
                                 #   it changes nothing. It is written down because the number is EARNED, not conservative-by-default.
                                 #   MEASURED AND REVERTED ONCE (round 5, 2026-07-03, `.claude/growth_heuristic_plan.md:205`), on the same
                                 #   question that brought the knob back — "aren't down-1Y-but-up-5Y names good growth candidates?":
                                 #     same-batch triple: baseline edge +106.6 (OOS +0.11|+0.06) | floor -10 -> +101.1 | floor -20 -> +94.4
                                 #     decisive: the n=284 names a -10 floor NEWLY ADMITS average -108.1 pts forward peer-relative.
                                 #   Down-1Y-near-high names are falling out of favour, not resting — the on-sale foil's profile, and it
                                 #   loses here too. README lists removing this floor under "measured dead — don't re-run these".
                                 #   WHY THE KNOB EXISTS ANYWAY: so the cohort is re-measurable instead of quoted. `backtest universe`
                                 #   prints a `growth_min_1y_pct -10` GATE SWEEP row (restored with the knob) giving n + mean fwd return
                                 #   on TODAY's sample; `screen` prints a `Down year` tail naming the live names the floor drops. Read
                                 #   both, then leave this at 0.0 unless the sweep flips POSITIVE — and even then, only after a full
                                 #   `backtest universe` re-validation with both OOS halves positive. Edge-affecting.
                                 #   RE-MEASURED 2026-07-27 (`backtest universe`, 8445 cutoffs / 4881 tickers, growth lane 249 windows,
                                 #   edge +49.7 OOS +0.10|+0.21):
                                 #     growth_min_1y_pct -10   n=4   mean fwd peer-relative -85.0 pts
                                 #   Same SIGN and magnitude class as round 5's -108.1, so nothing here reopens the question — but say
                                 #   what it is: n=4 is far too small to confirm or overturn anything on its own. It is corroboration,
                                 #   not a replication. The n collapsed 284 -> 4 because the LANE is much stricter now than in round 5
                                 #   (growth_min_cagr 16.0 + use_life_cagr), so hardly any name reaches the point where the 1Y floor is
                                 #   its SOLE blocker — the same reason the growth lane scores only 249 windows here.
                                 #   READING THE SWEEP: its "<- TOO TIGHT" flag is NOT sample-size aware. The same run flags
                                 #   `growth_min_range_pct -10` at n=1 (+163.8) and `growth_maxdd_cap ->off` at n=1 (+75.7). Check n
                                 #   before believing any row in that table, including this one.
                                 #   PARTLY FIXED 2026-08-01: the sweep and the GATE AUDIT were reporting BARE MEANS of forward
                                 #   peer-relative return — the most skew-prone quantity in the tool — while every other slice in
                                 #   the report prints mean|median for exactly that reason. Both now print both, and the TOO TIGHT
                                 #   flag needs BOTH positive; disagreement prints SPLIT instead of a verdict. This killed most of
                                 #   the historical flags outright (see the PEG receipt at growth_max_peg for the full list). It
                                 #   does NOT make the flag sample-size aware — small n is still small n — but it does mean a row
                                 #   flagged TOO TIGHT is no longer one survivor carrying the average.
                                 #   SWEPT SOLO 2026-07-30 (per-knob stress grid, floor removed at -1e6): the floor is HORIZON-SPLIT.
                                 #   8y-s: removal WINS (edge +100.0 vs +79.2, top-10 +7.0 vs +6.5) — dip-buying pays inside a decade.
                                 #   20y-s KING: lane edge CRASHES +623.5 -> +429.8 (−31%) — down-year names admitted into the top half
                                 #   are secular decliners over 20y, the round-5 −108-pts cohort seen at lane level. The top-10 BOOK
                                 #   actually ticks up (+6.4/+6.1 vs +6.1/+5.8), so the wound is below the buy line — but the 20y+ hold
                                 #   goal keeps the floor. VERDICT: 0.0 stays; an overlay running -1e6 should return to 0.0.
  min_1y_pct_crypto: -50.0       # LIVE (crypto/FX -EUR/-USD): 1Y floor for the crypto growth lane — coins swing far harder than
                                 #   stocks, but a coin down worse than -50% on the year is a crash, not a swing (BTC's own bad
                                 #   year is -33.5%, comfortably inside; GT -62 / BGB -60 out). Was -75, which let deep crashers rank
  max_1m_drop_pct: -20.0         # LIVE: reject if 1M % <= this (a hard monthly crash = falling knife) — both lanes
                                 #   SWEPT SOLO 2026-07-30 (off at -1e6, per-knob stress grid): noise (20y-s +629.8 vs +623.5,
                                 #   12y-s −4.4, 8y-s −1.2, book metrics flat). The gate is FREE in backtest — keep −20 for the
                                 #   live mid-crash month it exists to catch; an overlay running -1e6 gains nothing by it.
  max_1m_drop_pct_crypto: -35.0  # LIVE (crypto/FX): looser knife — a -20%/month alt is normal — both lanes
  min_long_pct: 30.0             # [FOIL] on-sale only: reject unless EVERY 5Y/10Y/20Y leg is > this (the growth lane has its own per-rung floors below)
  min_long_pct_crypto: -70.0     # [FOIL] on-sale only: reject if the >2Y leg <= this CUMULATIVE % (a corpse, e.g. -95%)
  growth_min_5y_pct: 0.0         # LIVE: growth-lane 5Y CUMULATIVE-return floor — reject if the 5Y leg <= this. Like growth_min_1y_pct above,
                                 #   this is the constant it replaced (a hardcoded 0.0 at both gate sites), so shipping it changes nothing
                                 #   FOR EQUITIES. It is written down because ONE thing did change with it: the gate used to carry a
                                 #   `!crypto` guard and no longer does — a coin now answers to this bar too (round 2026-07-27, by request).
                                 #   THE EQUITY HALF IS MEASURED NEUTRAL, not assumed: `backtest universe fund 12` run on the pre-change and
                                 #   post-change binaries is IDENTICAL line for line — 1642 windows, Spearman +0.18, edge +146.2, net +146.0,
                                 #   winsorized +118.0, OOS +0.11|+0.11. The only line that moves is the bootstrap band, and that is
                                 #   resampling noise: three runs of the SAME binary gave [+79.7…+179.1], [+82.1…+176.5], [+84.3…+180.5]
                                 #   while every deterministic number stayed pinned. Do not read a moved band as a moved edge.
                                 #   THE BACKTEST CANNOT GRADE THE CRYPTO HALF. Every edge metric drops crypto before scoring (backtest.rs:1058 "equal-
                                 #   weight, non-crypto"; :1075 `continue` on a coin; the `gated, non-crypto` pools at :1224/:1468/:1522/:1625),
                                 #   so an unchanged edge here is NOT evidence the crypto half is harmless — it is evidence the metric never
                                 #   looked. The check that means something is the live `screen` crypto lane, read by eye.
                                 #   THE VIEW THIS OVERRODE, so it isn't rediscovered from scratch: both lanes had independently concluded a
                                 #   -EUR 5Y is peak-anchored noise and the range gate is the right tool for bled coins. The foil lane STILL
                                 #   holds that view — see its separate, much looser min_long_pct_crypto -70.0 two lines up. If the crypto
                                 #   lane thins out unexpectedly, this knob going negative is the fix, and it loosens equities at the same
                                 #   time, because it is now one shared number. Edge-affecting for equities -> re-validate before moving it.
                                 #   SWEPT SOLO 2026-07-30 (off at -1e6, per-knob stress grid): noise at every horizon (20y-s +614.1
                                 #   vs +623.5, 12y-s +224.4 vs +221.7, 8y-s +82.4 vs +79.2; book metrics byte-identical). At 0.0 the
                                 #   bar almost never binds once growth_min_cagr is in force. TIE — 0.0 stays.
  growth_min_8y_pct: -1e9        # OFF here, but it is the rung that BITES — arm it in the local settings.yaml if wanted. MEASURED live
                                 #   2026-07-27 at growth_max_peg 2.0, +50% bar: it rejects FOUR names, and all four sit against the fence —
                                 #     AMGN 8Y +44.0% · GILD +40.7% · SCHW +48.2% · ULTA +49.2%
                                 #   That is 4.4-5.1%/yr over 8 years from names that all clear a 16%/yr LIFE CAGR — precisely the pattern
                                 #   this gate was asked for: a long record flattering a mediocre recent decade. Nothing else reads that
                                 #   window (under use_life_cagr the leg check and the life check are the same number).
                                 #   HOW MUCH IT BITES DEPENDS ON A KNOB 60 LINES AWAY. The same bar rejected NOBODY when first measured,
                                 #   because that run had growth_max_peg 1.0 and only 5 stocks reached the ranking at all. Raising the PEG
                                 #   ceiling to 2.0 admitted the wider cohort these four live in. Re-measure after ANY move to growth_max_peg
                                 #   rather than quoting this line — the two gates compose, and the 8Y bar reads as dead until it isn't.
                                 #   Note it is still ~4x slacker than a gate already in force: +50% over 8y is 5.20%/yr, while
                                 #   growth_min_cagr 16.0 implies +228%. It bites anyway because it constrains a DIFFERENT window.
                                 #   Ships off because the number is unvalidated, not because it is inert. The legs ARE backtest-visible for
                                 #   equities (backtest_quote fills perf from the full [..=as_of] slice), unlike the age/AUM/turnover gates —
                                 #   so sweep it before arming it in anger.
                                 #   SWEPT 2026-07-30 as asked (+50 bar, per-knob stress grid): NEAR-INERT there — 20y-s +624.2 vs
                                 #   +623.5 with the book byte-identical, 12y-s −6.0 edge, 8y-s +1.4. The AMGN/GILD/SCHW/ULTA pattern
                                 #   never assembles in the survivors-only pool (a name failing +50%/8y while clearing the CAGR and
                                 #   range bars barely exists there). The backtest neither convicts nor acquits: arming it live at 50
                                 #   stays a judgement call riding the live receipt above.
  growth_min_20y_pct: -1e9       # OFF, and unlike the 8Y rung above this one really does reject NOBODY at the +200 requested — confirmed on
                                 #   the same live run (5.65%/yr; growth_min_cagr 16.0 implies +1846% over 20y).
                                 #   READ THIS BEFORE ARMING IT: the bar reaches LONG-LISTED STOCKS ONLY. No UCITS ETF and no coin in the
                                 #   universe has 20 years of history, so their 20Y leg is `n/a` and is SKIPPED — a missing leg is never read
                                 #   as a failed one (that rule is the request's "if value is not N/A", pinned by test). Consequence worth
                                 #   stating plainly: this gate is harshest on the longest records and silent on the youngest, which is the
                                 #   opposite of the intuition. It was asked for to catch a real pattern the CAGR gates miss — under
                                 #   use_life_cagr the leg check and the life check are the SAME number, so nothing reads the 20Y window at
                                 #   all, and a name whose great decades are early clears every bar on history it will not repeat. PGR is the
                                 #   live case: +418% over its last 20y = 8.6%/yr, behind a 16%/yr life CAGR. At +200 it clears easily —
                                 #   catching PGR needs a bar near the CAGR-implied level, which is a much bigger change and unmeasured.
                                 #   SWEPT 2026-07-30 (+200, per-knob stress grid): inert there too (+0.7 edge at king = a bottom-half
                                 #   sliver; 8y-s byte-identical). Live and backtest agree the bar rejects ~nobody — cosmetic at 200.
  perf_fill_coverage_pct: 90.0   # DISPLAY ONLY — this knob cannot move a rank, a score or a gate. 100.0 = off (the code default).
                                 #   The problem: YRS rounds to nearest, a leg needs its full span minus 31d, so each rung has a ~5-month
                                 #   band where the row contradicts itself — WTAI.MI at ~7.7y printed "YRS 8" beside "8Y n/a" (8Y needs 7.91y).
                                 #   YRS now carries a decimal (7.7), and a cell inside that band prints the WHOLE-LIFE MEASURED return marked
                                 #   `≈`. NOT a projection: `(1+CAGR)^N` re-renders two columns already on screen while READING as a
                                 #   measurement, and on WTAI it swings 7.6x on which CAGR feeds it (+3141% at the +19% headline vs +414% at
                                 #   the real recent 8.5%/yr). The value is deflated by live EU HICP like every other >=1Y cell (inflation_adjust
                                 #   is on) — a nominal fill in a real column would be ~25pp wrong on an 8-year span.
                                 #   MEASURED live 2026-07-28 at 90 — six cells fill, and note the count only became visible once YRS carried a
                                 #   decimal (a rounded-YRS reading of the same table predicted three):
                                 #     8Y  — WTAI.MI 7.7y (96%) ≈+176.7% · XAIX.DE 7.5y (94%) ≈+206.6% · PANX.PA 7.3y (91%) ≈+180.7%
                                 #     20Y — NASD.L 18.5y (93%) ≈+1459% · EQQQ.MI 18.5y (93%) ≈+1233% · V 18.3y (92%) ≈+924.6%
                                 #   The bar is doing real work at the boundary: XMTD.L 17.6y and XMUS.L 17.5y are both 88% of the 20Y rung and
                                 #   stay n/a, as do XACT-BULL 16.7y, XLKS.L 16.6y, CSNDX.SW 16.5y and ANX.PA 16.1y.
                                 #   WHY 90 AND NOT LOWER: 0A08.L (iShares JPM EM Bond, ranked in the 2026-07-27 run) sits at 87.6% of the 8Y
                                 #   rung and its first close is a data artifact — CAGR +62%/yr against a 5Y of +17.3%, so its whole-life return
                                 #   is ~+3900%. 90 blocks that by 2.4 points; anything under ~88 prints it as if it were an 8-year number.
                                 #   PROOF IT CANNOT MOVE A RANK, both ways: the same binary run at 100.0 (off) and at 90.0 produced an
                                 #   IDENTICAL ranking in all three lanes; and statically, `perf_fill` has exactly two callers (the perf cell and
                                 #   the legend collector) while `life_return_pct` has exactly one reader (`perf_fill`) — no path into scoring.
  min_avg_turnover_eur: 500000   # LIVE: reject names with < this avg daily turnover (EUR) on THIS listing — both lanes.
                                 #   Set 2026-07-02 at 100K after zeroing the turnover SCORE tilt (which never docked
                                 #   junk): a hard gate is the honest tool for untradeable listings. 100K killed the real
                                 #   junk (Expat Romania €11K/day, Expat Greece €0K, GraniteShares FAANG €0K).
                                 #   Raised to 500K 2026-07-03 (live full-screen A/B vs 100K): drops exactly 4 thin ETF
                                 #   listings — both silver ETCs (XSLE.DE €327K, XSLR.MI €125K, commodity spikes ranked
                                 #   #1-2 on sub-5y history) + CHIP.SW €266K + WTEC.SW €164K (side listings; semis/tech
                                 #   coverage kept via VVSM.DE €38M, SEMI.AS €6M, XDWT.L €3M). Stocks + crypto tables
                                 #   byte-identical. Turnover is PER LISTING, not fund AUM — 500K still spares any
                                 #   listing a retail order can actually exit. Pinned watchlist names bypass all gates
                                 #   (sentinel score). BACKTEST-BLIND (backtest quotes carry no turnover) — the
                                 #   validated edge and CI gate are untouched. 0 = off
  endpoint_smooth_days: 105      # LIVE+BACKTEST: the "current price" used by the LONG-horizon MEASUREMENTS (>=1Y
                                 #   perf %/long CAGR legs, range position, drawdown — so the hard range gate) = mean
                                 #   of the closes in the last N TRADING DAYS. 105 ≈ 5 months. The span converts to
                                 #   bars by the run's cadence (105 daily closes live; 5 monthly bars in the 12y
                                 #   backtest) so the smoothing covers the SAME calendar time both sides — train ==
                                 #   serve. What stays RAW on purpose: the displayed price, the short legs (1D/1W/1M
                                 #   incl. the 1M knife — a months-wide average would make "this month" meaningless),
                                 #   and the overext brake (smoothing it measured WORSE: it under-reads fresh spikes).
                                 #   VALIDATED 2026-07-02, window swept on the monthly engine (bars: edge):
                                 #   1: +109.7 | 2: +103.3 | 3: +109.4 | 5: +115.7..+120.2 | 8: +103.0 — clean hump
                                 #   at 5 bars ≈ 105 trading days, all OOS halves +. 1 = raw last close (old
                                 #   behaviour). Edge-affecting: re-validate `backtest 12 universe` before changing.

  # --- SCORE — ON-SALE LANE (`buy_score`) — [FOIL] ALL of this section is backtest-only; `screen` ignores it ---
  normal_volatility_pct: 2.0     # [FOIL] a "typical" daily swing %; the dip is scaled by normal/asset vol,
                                 #   so a calm name's pullback counts for more than a wild one's
  discount_cap: 35.0             # [FOIL] cap on that volatility-scaled dip (one very deep name can't dominate)
  discount_weight: 0.35          # [FOIL] (#4) multiplier on the dip reward — on-sale dip-depth carries no selection skill (rho
                                 #   negative on 53 names, ~0 on the 354-name wide sample), so 0.35 shifts weight to the
                                 #   CAGR/sharpe terms WITHOUT gutting on-sale scores (0.15 dropped normal names below
                                 #   min_score for only a noise-level rho gain). 1.0 = old behaviour, 0 = drop it entirely.
  # Goal = multi-decade buy-and-hold, so momentum is NEUTRAL (1.0/1.0): a green/red WEEK is noise
  # over a 10-50y hold and must not reorder the ranking. Want a short-term timing view (e.g. for
  # `check`)? Set bounce ~1.3 / knife ~0.6 to reward a confirmed turn and dock a falling knife.
  momentum_bounce: 1.0           # [FOIL] discount ×this on a green week off a dip — 1.0 = ignore weekly timing
  momentum_knife: 1.0            # [FOIL] discount ×this while still falling — 1.0 = ignore weekly timing
  # (A) Long-trend reward = the proven-compounder signal for a decades hold, now on the long leg's
  # CAGR (Compound Annual Growth Rate, %/yr — annualized so a 10Y and a 20Y leg compare fairly).
  long_trend_weight: 0.5         # [FOIL] on-sale reward per %/yr of long-leg CAGR (×cap below = max bonus, ~15)
  long_trend_cap: 30.0           # LIVE+FOIL (SHARED). (#3k) 2026-07-29 RESTORED at 30 on the first-ever
                                 #   20y-STRESS ladder (the goal horizon, corpses injected), trend weight at
                                 #   its new 0.15: 15 +559.3 | 20 +579.7 | 25 +593.0 | 30 +623.5 (peak) |
                                 #   40 +589.1 | uncapped-at-0.35 +552.5. Clean hump, peak 30. The old 12y
                                 #   curve preferred 25 (+191.2 vs 30 +181.3) — measured at trend 0.35, on
                                 #   the advisory horizon; 20y king overrules. Rank-1 med/h2h IDENTICAL
                                 #   (+4.4 / 41%) across the whole ladder — the cap tunes lane edge only,
                                 #   the argmax cure lives in the WEIGHT (see growth_trend_weight).
                                 #   history: #16 sweep 2026-06-28: 20/30/40/50/1000 all edge ≈ -100337360 (flat) → cap inert on that run; 2026-07-02 re-test 30→50 on `backtest 12 universe` DROPPED growth edge +103.2→+87.7 → 30 read protective (parabolic names mean-revert), kept 30; (#3g) 2026-07-26 full curve confirmed the ceiling wanted to go DOWN (25 +191.2) not up; (#3h) same day removed it anyway on request, measured cost -11.5 edge at 12y; (#3k) restored on 20y-stress measurement
  health_zero_cagr: -10.0        # [FOIL] long-leg CAGR (%/yr) where on-sale trend_health hits 0; health=1 at flat/rising

  # --- (B) total-return inputs + (E) endpoint-robust CAGR + (#8) geomean shape — EDGE-AFFECTING, validate before trusting ---
  # All flow to LIVE screen AND the backtest (train==serve), so a `backtest 12 universe` measures them
  # honestly. UNVALIDATED at flip time — run .claude/run_me.sh steps B/E and REVERT any that drops rho/edge
  # or pushes an OOS half negative. Reversible (set back to false).
  splice_max_weekly_rate: 2.0    # (splice) 2026-07-29: trim history BEFORE the last step whose implied
                                 #   WEEKLY growth factor exceeds 2.0 (or drops under 0.5) — vendor series
                                 #   that glue two denominations (0A08.L: MXN head, GBP tail, ×19.59 in 28d)
                                 #   otherwise print fictional life CAGRs (+62%/yr vs the fund's true +6.7)
                                 #   and fake −99% MAXDDs on the ÷100 GBp→GBP cluster. 2.0 sits in a MEASURED
                                 #   VALLEY: fastest real survivor 3USL.L 1.87×/wk (3× leveraged ETP), slowest
                                 #   splice COFF.L 2.06×/wk, nothing between; on the down half every real
                                 #   crash clears the 0.5 mirror (NCLH 0.744 Mar-2020, CVNA 0.576) while the
                                 #   redenominations land 0.32–0.35. Weekly RATE not raw ratio (NVR ×26/92d =
                                 #   1.28×/wk survives); sub-week gaps clamp to 7d (a lone −10% day is 0.9,
                                 #   not 0.9^7); crypto exempt (SHIB really did 13×/wk). Trims 138/3346
                                 #   non-crypto series (4.1%); median trimmed series loses 72% of its record —
                                 #   correct: leveraged ETPs that fell ~99% then reverse-split are two
                                 #   instruments glued together, and growth_min_age_years gates the stubs.
                                 #   BACKTEST-BLIND: changes the INPUT universe, so before/after edges are two
                                 #   different measurements, never an A/B. 0.0 = off.
  growth_geomean_fold: false     # (#8) REVERTED 2026-07-02: folding proximity+value into the geomean DROPPED edge +103.2->+79.2 (Δ-24) and flattened OOS-early +0.06->-0.00. The raw proximity multiply carries real selection weight; the geomean's 4th-root softens it too far. Golden rule reverts. Knob kept inert in code
  use_adjusted_close: false      # (B) REVERTED 2026-06-28: backtest 12 universe edge unchanged (raw
                                 #   -100337371.5 vs adj -100337372.0), OOS halves identical (+0.09/-0.05).
                                 #   No improvement → golden rule reverts. Flip true only if a re-run lifts edge.
  use_trend_cagr: false          # (E,#14) REVERTED 2026-06-28: slope CAGR edge -100337434.4 vs endpoint
                                 #   -100337336.3 (WORSE), OOS halves identical. Crypto's 1e9-scale peer-rel
                                 #   swamps this sample → knob inert + edge straddles 0 (noise). Keep endpoint.
  use_life_cagr: false           # (#3j) REVERTED 2026-07-26: ranking on the WHOLE-LIFE CAGR (the `cagr`
                                 #   column's number) instead of the 20/8/5Y leg read edge +125.6 vs +167.6,
                                 #   rho +0.17 vs +0.20, BOTH OOS halves down. Its ablation is the damning
                                 #   part: zeroing growth_trend_weight GAINS +3.8 under it (vs -37.6 under
                                 #   the leg) — the term stops carrying information. "Life" is an unbounded
                                 #   window (5y for one row here, 46y for another), so it mostly encodes
                                 #   listing age. Keep the leg. Full receipt: (#3j) below.
                                 #   (#3k) 2026-07-29 RE-CONDEMNED on the first stress grid — true at all
                                 #   FOUR horizons, corpses injected, splice-trimmed data: 20y-s edge
                                 #   +437.5 vs +552.5 (-115), 12y-s +144.6 vs +205.9 (-61), 8y-s top-10
                                 #   excess +5.7 vs +6.4, 5yL-s edge +31.0 vs +40.5. Loses EVERY view it
                                 #   was graded on. Do not re-propose. (It is also what ranked the corrupt
                                 #   0A08.L splice #1 pre-trim: an unbounded window maximizes exposure to
                                 #   glued-denomination history.) A local settings.yaml overlay carrying
                                 #   `use_life_cagr: true` silently reverses all of this — check yours.
                                 #   (#3m) 2026-07-29 WHY WHOLE ROWS MOVE WITH THIS FLAG (asked once,
                                 #   answered forever): it flips THE growth number (`long_cagr_from`,
                                 #   picks.rs) and by (#14)/(#37) design that ONE value feeds the score,
                                 #   the growth_min_cagr gate, trend, accel, sharpe, calmar, the LEG
                                 #   column AND the PEG divisor — so SCORE/S-8Y/PEG/LEG/rank all move
                                 #   together, on crypto too. Same-cache A/B: NVDA rank 2→13, PEG
                                 #   1.25→1.12, score 12.8→13.3; the rank drop is dilution — life CAGR
                                 #   walks MSFT/ORCL/GOOG/MA past the 19-floor that their 20Y rung
                                 #   fails, tripling the gated field. The CAGR column is whole-life
                                 #   DISPLAY (the "cagr" cell in picks.rs) and does not move with the
                                 #   flag; small CAGR/PE/daily diffs between two manual screen runs are
                                 #   live-quote drift between fetches, not the flag.
  life_cagr_max_years: 0.0       # (#3l) MEASURED OFF 2026-07-29: >0 swaps false-mode's 20/8/5Y rung ladder
                                 #   for a CAGR over the last min(age, N) years (true mode stays whole-life;
                                 #   a name the capped fn declines — <5y history — keeps its rung, so the
                                 #   pool only moves through the growth_min_cagr gate reading a different
                                 #   number). Motivation was the 8→20 dead band: an 18y-old name is ranked
                                 #   on its 8Y window. Two arms on the shipped (#3k) config, stress grid:
                                 #   N=20 20y-s: edge +536.6, top-10 +5.8(+5.6), rank1 +4.8|+3.7 win 81%,
                                 #     h2h 54% — the only >50% h2h ever recorded, but the rank-1 MEDIAN
                                 #     drops 0.7 and the lane edge 87 vs ship +623.5/+6.1(+5.8)/+4.4|+4.4/41%.
                                 #   N=20 12y-s +182.7/+6.0(+5.9)/+2.9|+3.7/28% and 8y-s +75.6/+5.9(+6.5)/
                                 #     +3.4|+3.0/47% lose EVERY metric vs ship (+221.7/+6.7(+6.8)/+3.2|+4.8/
                                 #     33% and +79.2/+6.5(+7.3)/+3.9|+4.5/48%).
                                 #   N=30: clamp never fires at the 20y-hold king (series ≤ ~25y), so its
                                 #     king run IS whole-life under the shipped weights: edge +557.9, still
                                 #     -66 vs the rung — (#3j)/(#3k) re-confirmed with modern weights.
                                 #     12y-s +180.4/28%, 8y-s +74.8/47%: same losses as N=20.
                                 #   Widening the window fixes the dead band and LOSES at every horizon
                                 #   that can see it — the recent-window rung is the signal, not a proxy.
                                 #   Keep 0.0. Inertness verified: knob-0 binary = ship metrics exactly.
  # fixed_cagr_years still 0, but the reason has CHANGED and the old one is dead. It said "#15 is redundant
  # because use_trend_cagr overrides a pinned window with the whole-series slope" — use_trend_cagr was then
  # REVERTED two lines up, so #15 sat untested on a stale rationale. (#3j) finally measured it: pinning every
  # name to its 10Y window reads edge +160.1 vs the leg's +167.6, i.e. -7.5, INSIDE the bootstrap band and
  # with a much steadier era table (worst era +111.2 vs +40.5). Best remaining candidate; golden rule still
  # reverts a drop. #16: sweep long_trend_cap (above) per run_me.sh, no flag.

  # (B) Value-trap dock: a name bleeding for YEARS (1Y AND 5Y both deep red) is not a dip — dock it.
  sustained_decline_pct: -40.0   # [FOIL] both 1Y and 5Y must be <= this to count as a multi-year bleed
  sustained_decline_penalty: 0.4 # [FOIL] score ×this when that holds (0..1; lower = harsher)
  # Harsher tier for a 7y+ deep bleed (e.g. LTC: 5Y -73% riding an ancient 10Y pump): if the 5Y is
  # past deep_decline_pct, use the steeper deep_decline_penalty instead of the -40% one.
  deep_decline_pct: -70.0        # [FOIL] 5Y <= this = a years-deep bleed, not a recoverable dip
  deep_decline_penalty: 0.15     # [FOIL] score ×this then (lower than sustained_decline_penalty)

  # (A) Hide ranked rows scoring <= this so the per-class tables stop padding to top_picks with
  # near-the-high names (score ~1-2 = not really "on sale"). Fewer rows when few names qualify.
  min_score: -20.0               # [FOIL] on-sale trim. (The LIVE growth equivalent is growth_min_score below.) 0 = show all

  # (C) Structural-cheap reward: how far below the ~200wk trend line (SMA = Simple Moving Average) the
  # price sits. Complements the OFF-HI drawdown (distance below the peak) with "cheap vs the long trend".
  cheap_weight: 0.07             # [FOIL] (#4) reward per % below the 200wk SMA — halved from 0.15: "structural cheap"
                                 #   is another dip term the backtest doesn't reward; demoted toward trend/quality.
  cheap_cap: 60.0                # [FOIL] cap the below-SMA % fed in

  # --- SCORE — SHARED / LIVE tilts (read by the growth lane `screen` prints) ---
  # (D) Dividend reward: REVIVED 2026-07-25 at 0.5, now scored NET of Portuguese tax (see tax_keep_*).
  #   HISTORY: shipped 1.5, demoted to 0 on 2026-07-15 because it is BACKTEST-BLIND and its rationale
  #   (price-only CAGR misses reinvested dividends) was tested DIRECTLY by the use_adjusted_close
  #   total-return probe, which came back NO-EDGE (reverted false 2026-06-28).
  #   WHY IT COMES BACK, AND WHY WITHOUT A RECEIPT: `backtest_quote` cannot reconstruct as-of dividends
  #   (module header, commands/backtest.rs), so NO walk-forward run can grade this term at ANY weight —
  #   the usual "re-validate, both OOS halves positive" receipt is not pending here, it is IMPOSSIBLE.
  #   dividend_weight is not even in the growth_knobs ablation list. It therefore ships as an explicitly
  #   blind judgment lever, the same class as quality_weight:0.15 and nupl_boost_ceiling, and is sized
  #   accordingly: 0.5 peaks the term at +2.25 (6% yield × cap), comfortably under quality's +6 blind
  #   ceiling and far under the old 1.5's +9 — that magnitude is exactly what got it cut.
  #   HONEST SIZING: the TAX scaling below is worth ~0.06 pts on a 5–19 pt score at a 4% yield. Reviving
  #   the term at all is the ranking change; the tax rule rides along as a correctness fix, not an edge
  #   claim. Acceptance is an eyeballed top-N, not a backtest. Set 0.0 to go back to the 2026-07-15 state.
  #   Read by BOTH lanes.
  dividend_weight: 0.5           # LIVE: reward per % of trailing-1Y yield, AFTER the tax keep-rate (0 = OFF)
  dividend_cap: 6.0              # LIVE: cap the yield % fed in — applied BEFORE the keep-rate (see below)

  # (D/PT) Portuguese dividend tax, as two after-tax KEEP fractions. Art. 40.º-A CIRS englobates only
  #   50% of a dividend from an EU-resident company meeting the Parent-Subsidiary Directive conditions,
  #   IF you opt for englobamento on the IRS return; a US/other payer is taxed in full. No tax law is
  #   encoded in the code — THESE TWO NUMBERS ARE THE WHOLE MODEL, and they are yours to compute from
  #   your own bracket, your englobamento choice, and the source withholding you actually eat after any
  #   reclaim. The values below are a worked example at a ~43.5% marginal rate, NOT advice: recompute
  #   them. 1.0/1.0 = tax off (the code default), lane byte-identical to the pre-tax version.
  #   ORDER MATTERS: the cap is applied to the GROSS yield, then the keep-rate scales it. Capping the
  #   scaled yield instead would saturate EU and non-EU onto the same value for every above-cap yielder,
  #   erasing the distinction exactly where yields are highest.
  #   EU set = the 12 members as core::suffix_country spells them (UK/Switzerland/Norway are NOT EU).
  #   Venue is the proxy for the payer: an Irish-domiciled S&P 500 name (ACN, ETN, MDT) reads "USA" and
  #   is under-credited — conservative, never the reverse. Funds take tax_keep_other at any domicile: an
  #   OICVM distribution is not a PSD company's *lucro*, so no exclusion.
  #   CEILING: one EU rate blends source withholding from 12.8% (France) to 35% (Finland). That 22-pt
  #   within-EU spread is ~3× the EU-vs-US gap this models — a real approximation, accepted knowingly.
  #   Upgrade path if it bites: a per-market map keyed on Quote.market.
  tax_keep_eu: 0.76              # LIVE: fraction kept from an EU company's dividend (englobamento, 50% excluded)
  tax_keep_other: 0.72           # LIVE: fraction kept from every other payer, and from any fund

  # (E) Valuation tilt: cheap on EARNINGS, not just recently dropped. value = ref_pe / P/E, clamped
  # [0.5,1.5] (P/E = Price-to-Earnings ratio). Needs a trailing P/E -> set FMP_API_KEY (Financial
  # Modeling Prep) in the ENV (never here); free tiers are rate-limited so it populates at `check`
  # scale, stays neutral (×1.0) across the big `screen`. Read by BOTH lanes.
  ref_pe: 20.0                   # LIVE: "fair" trailing P/E; P/E 10 -> ×1.5 (cheap), P/E 40 -> ×0.5 (rich)

  # (F) Profitability/QUALITY tilt: reward trailing return-on-capital — ROE (Return On Equity, the
  # canonical quality factor; high-ROE firms out-compound long-run), or ROA where equity is negative
  # (`core::quality_return`). Same FMP_API_KEY opt-in as ref_pe for the LIVE screen (populates at
  # `check` scale). Read by BOTH lanes. 0 = off.
  # NO LONGER BACKTEST-BLIND, and the first measurement is a large one. This term was shipped for
  # rounds against a backtest that could not see it: `backtest_quote` builds from `Quote::stub` (roe
  # None) and fills only closes-derived fields, so `quality_reward` was 0.15 × 0 for EVERY sample in
  # EVERY lane — the ablation row read 0.0 by CONSTRUCTION, not by measurement. `4975f23` filled
  # `Quote.roe` from the as-of fundamentals in the backtest loop (same look-ahead guard as the three
  # yields), and this is its first wide run — `backtest universe fund 12`, 11690 cutoffs, 8458 with
  # as-of fundamentals:
  #     BUY lane    (full rho +0.04, edge +111.6): zeroing it -> rho -0.06 Δ-0.10, edge +62.9 Δ-48.7
  #     GROWTH lane (full rho +0.18, edge +181.6): zeroing it -> rho +0.18 Δ-0.00, edge +169.0 Δ-12.6
  #   The buy-lane Δ is the biggest RHO hit of any knob in that lane (bigger than cheap_weight, whose
  #   -50.4 edge comes with Δrho 0.00) — zeroing quality flips the lane's rank correlation NEGATIVE.
  #   Keep at 0.15. It is no longer a "small blind tilt"; it is load-bearing in the on-sale lane.
  # STANDALONE, though, it does NOT rank on its own: `quality(roe/roa) n=1826 rho -0.01 edge -115.1
  #   OOS +0.04 | -0.06`, and raw ROE alone is worse (rho -0.03, edge -123.2). It works as a MODIFIER
  #   on a price-led score, not as a selector. Held-book view agrees it is not junk (top-10 held 12y:
  #   +15.9%/yr, excess +4.3, win 100%, worst +2.5, OOS +4.7/+4.0 n=266) — the standalone edge is
  #   negative because ranking PURELY on ROE buys expensive quality.
  # NEITHER PIN GUARDS THIS TERM — do not read a green `cargo test` as a regression net for it:
  #   `walk_forward_edge_pin` builds samples with `core::backtest_quote` and `fund: None`, never
  #   routing through the run() loop's `quote.roe = ...`, so roe is None and the term is 0 for every
  #   pinned sample. `scoring_regression_pin` DOES set `stock.roe = Some(40.0)` by hand, so it pins
  #   `quality_reward`'s arithmetic — but never `core::quality_return`, which is where the ROE/ROA
  #   choice is actually made. That is why both pins sat still through `4975f23`. Expected, not lucky.
  quality_weight: 0.15           # LIVE + MEASURED: reward per % return-on-capital (×cap = max bonus, ~6 at 40%)
  quality_cap: 40.0              # LIVE: cap the ROE % fed in (a buyback-levered 200% ROE doesn't dominate)
  # (#42) "why does Apple print n/m as ROE" — asked 2026-07-27. The answer was a display rule reading the
  #   WRONG AXIS, and chasing it found the score doing the same thing. Two thresholds existed for one
  #   claim: the cell called ROE meaningless above 100, the score stopped believing it above quality_cap
  #   40 — and the looser one was the one the user saw, so a name could be hidden while collecting the
  #   full +6.0 quality reward.
  #   LEVEL DOES NOT SEPARATE "earned a lot on its assets" from "has no equity left". The discriminator is
  #   the EQUITY MULTIPLIER, ROE/ROA = assets/equity. Across the 447 cached filers with a positive ROE:
  #     CL    ROE +3948  ROA 13.1  mult 302x   equity is 0.33% of assets — artifact
  #     LYV   ROE  +183  ROA  2.2  mult  85x   artifact
  #     GDDY  ROE  +407  ROA 10.9  mult  37x   artifact
  #     BA    ROE   +41  ROA  1.3  mult  31x   artifact — and it PRINTED CLEAN under the old rule
  #     AAPL  ROE  +152  ROA 31.2  mult 4.9x   p78 leverage on an elite ROA — HIDDEN under the old rule
  #     ITW   ROE   +95  ROA 19.0  mult 5.0x   the SAME leverage as AAPL, printed clean
  #     APP   ROE  +156  ROA 45.9  mult 3.4x   hidden
  #   So `quality_return` now swaps ROE -> ROA on `roe/roa >= core::MAX_EQUITY_MULT` (20x, equity under
  #   1/20th of assets, p97) in ADDITION to the existing negative-equity sign test, and the |ROE|>100 n/m
  #   cell is DELETED — a number reaching the cell is now one that survived the multiplier check, and
  #   hiding a figure the score is already acting on was the inconsistency, not the cure.
  #   MEASURED, `backtest universe fund 12`, three binaries, one frozen config. All three scored the
  #   IDENTICAL universe (on-sale 4612, growth 1272), so (#40) noise did not fire and the deltas are real:
  #                        growth rho | edge | winsor      on-sale rho | edge | winsor
  #     off (baseline)       +0.19  +140.0  +120.2           +0.05  +121.2  +57.9
  #     mult >= 20 SHIPPED   +0.19  +140.0  +120.2           +0.04  +118.3  +55.0
  #     mult >= 40           +0.19  +140.0  +120.2           +0.04  +118.3  +55.0
  #   THE GROWTH LANE DOES NOT MOVE AT ALL — byte-identical, and the `quality(roe/roa)` held-book probe is
  #   identical too (n=236, +15.4%/yr, excess +3.8, win 100%). The whole cost is -2.9 on-sale edge, sitting
  #   entirely in one era (2011-05..2014-07: +179.7 -> +167.0), and it is CL/LYV/COR losing quality credit
  #   they were earning on a collapsed denominator.
  #   SHIPPED AT A MEASURED LOSS, deliberately, as a correctness fix rather than an edge claim — the
  #   mirror of (#39), which was refused while edge-POSITIVE because its mechanism was wrong. Here the
  #   mechanism is right and the price is 2.9 pts in a lane the fix was not aimed at.
  #   BONUS RESULT: the known misfire is unpriced. Balance-sheet businesses sit in the artifact band and
  #   are NOT artifacts (IBKR 37.9x, AMP 29.2x, PFG 28.7x, MET 26.2x, PRU 23.9x — for a broker the leverage
  #   IS the business and ROA is ~0.5% by construction), and 20x sweeps them up. But mult>=40 swaps ZERO
  #   financials and lands on the SAME numbers to the decimal, so those names never reach the scored pool.
  #   The accepted risk costs nothing measurable. Do not re-litigate it without new pool coverage.
  #   NOT A KNOB: `fund_factors(rows, cutoff, yrs)` takes no tuning, so a knob costs its signature and
  #   every caller, and 20x is an accounting fact. Measured by rebuilding the const (INFINITY / 20 / 40).

  # === GROWTH LANE — THIS is the ranking `screen` actually prints. =============================
  # Proven compounders the on-sale lane can't surface: a name AT/NEAR its own ~10y high, with a
  # strong proven long-term CAGR, still climbing. Gated hard (near-high + proven CAGR + positive 1Y +
  # not crashing) and P/E-tilted so it isn't just top-chasing. Every knob below is LIVE. ===========
  growth_min_range_pct: 80.0     # GATE: must sit in the top 20% of its own ~10y range. SETTLED 2026-07-02:
                                 #   A/B'd 70 vs 80 on `backtest 12 universe` — 80 WINS: edge +109.8 vs +103.2
                                 #   AND better on both OOS halves (+0.07/+0.09 vs +0.06/+0.08). 70 fell short of
                                 #   its own ">=117 both-OOS+" keep-rule; the gate-sweep "70 too tight" flag was a
                                 #   small-sample mirage. 80 is the validated base.
                                 #   THE MIRAGE IS NOW MEASURED, not just asserted (2026-08-01, sweep given a median): the
                                 #   `growth_min_range_pct -10` row was mean-only, and the median reverses its sign at two of three
                                 #   horizons — 20y-s mean +394.2 vs med -236.9 (n=10), 8y-s mean +54.6 vs med -3.1 (n=15). The
                                 #   names that row admits are a few big winners on top of a losing majority, which is precisely
                                 #   what "mirage" meant. It survives at 12y-s only (mean +76.6 | med +44.2, n=15) — still n=15,
                                 #   still below anything worth acting on, and against two A/B'd sweeps that both said 80.
                                 #   RE-CONFIRMED 2026-07-30 from the other side: 50 swept solo on the stress grid LOSES edge at
                                 #   every horizon (20y-s +573.0 vs +623.5, 12y-s +203.4 vs +221.7, 8y-s +76.0 vs +79.2) with no
                                 #   book metric improving. 80 -> 70 -> 50 is monotone damage; the 80 bar is load-bearing. An
                                 #   overlay running 50 should return to 80.
  growth_min_range_pct_crypto: 40.0 # GATE (crypto only): looser range floor (top 60% of its own range) so MORE coins
                                 #   surface — alts spend most of their life far below ATH yet still out-compound. The
                                 #   BTC-relative tilt below + the NUPL damp keep the wider crypto table honest. Stocks/ETFs
                                 #   keep the strict 80 gate above. Lower toward 0 for even more coins, raise toward 80 to tighten.
  growth_min_range_pct_8y: 80.0  # GATE: the SAME 80 bar re-measured on the LAST 8 YEARS (`stats_8y.range_pct`).
                                 #   WHY BOTH: `range_pct` is a PERCENTILE of today's price over the window's closes, so a
                                 #   name whose old, much-lower closes sit in the ~10y chart clears 80 on the strength of
                                 #   history that has nothing to do with the last 8 years. PGR ranked #1 (22.3 vs 20.9 next)
                                 #   at 2Y -14.0%, 29.4% off its high, life CAGR +17%/yr powered by decades now outside the
                                 #   window. Measured 2026-07-28 on the live screen: PGR 76%, TDG 75% — the only two names
                                 #   the bar cut, and exactly the two worst 2Y in the lane (-14.0%, -10.9%; next is NXPI at
                                 #   -3.6%, which scrapes through). ETF and crypto lanes came out byte-identical.
                                 #   80 SPECIFICALLY, not "a bar": it is the level that makes this gate EQUAL the `S-8Y`
                                 #   column's bare `n/a`. That column re-scores under an 8Y pin which neutralizes the CAGR
                                 #   floors, and range is the only stat the pin swaps that any gate can newly reject on — so
                                 #   at 80 the gate fires exactly when the cell blanks, and a ranked row can no longer print
                                 #   `n/a` there. Any other level breaks that equality (picks.rs pins it in a test).
                                 #   BACKTEST-BLIND: `stats_8y` is set only in fetch.rs; `backtest_quote` builds from
                                 #   `Quote::stub`, so this gate cannot fire in a backtest — same standing as the age/AUM
                                 #   gates. It is armed on the live read alone and CANNOT be A/B'd like the 70-vs-80 sweep
                                 #   above. Code default is 0.0 (off), so this line is the whole of the shipped behaviour.
  growth_min_range_pct_8y_crypto: 40.0 # GATE (crypto only): same split as the pair above, same 40. INERT on today's table —
                                 #   BNB and BTC keep an S-8Y (29.0, 18.5) at 43-53% off their highs, because a coin's normal
                                 #   life is far below ATH. Here so the crypto lane can never inherit the equity 80 by accident.
  growth_btc_outperf_weight: 0.3 # SCORE (crypto only): tilt a coin by its 1Y return vs BITCOIN's (the market base) — beats
                                 #   BTC -> boost, lags -> mild dock, bounded 0.5x..2x. BTC itself = 1.0x (the neutral anchor
                                 #   you read the others against). SCREEN/CHECK-only (backtest-blind, validated edge untouched). 0 = off.
  growth_min_cagr: 19.0          # GATE, TWO LEGS, one number: the long leg (20/8/5Y rung) AND (#3i) the whole-life CAGR
                                 #   must BOTH compound >=14%/yr to count as a proven grower. (STALE-FIXED
                                 #   2026-07-29: this note said the life leg was screen-only because
                                 #   "backtest_quote leaves life_cagr None" — false since 2026-07-27,
                                 #   backtest_quote fills life_cagr, so the gate's BOTH-legs form is what
                                 #   every grid below measured, train==serve.) The gate, not a
                                 #   weight, is what moves the signal (additive/multiplier knobs are inert; gates reshape the scored pool).
                                 #   12y MAX-monthly knee (the real 20y-hold horizon): 12->14 lifts GROWTH edge +91.1->+92.7 AND
                                 #   flips top-half peer-relative -5.2->+4.6 (the bought basket now BEATS its peers, not just loses less);
                                 #   16 overshoots (edge +86.3, top-half flat, pool thins 1987->1609). OOS both-positive. 5y proxy preferred
                                 #   12 (rho +0.15 sym) but the 12y horizon — what the 20y goal actually targets — peaks at 14.
                                 #   RAISED 14 -> 19 (2026-07-30, user-proposed, per-knob stress grid vs the (#3k) ship baseline):
                                 #   the SECOND winner's-curse cure. h2h >50% at ALL THREE horizons for the first time (20y-s 60%,
                                 #   12y-s 69%, 8y-s 60% vs 41/33/48) with rank-1 quality UP everywhere — 20y-s +5.4|+5.3 win 81%
