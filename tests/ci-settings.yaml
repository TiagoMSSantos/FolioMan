  #   DOWNSIDE-ONLY (std of negative deviations), or paired with `margin_trend` so improvement is not
  #   punished. That is a different gate and needs its own measurement.
  #   growth_fund_extra: interest_cover — REJECTED. Best row in the held-book-by-factor probe (+17.4%/yr,
  #   excess +5.8 TYING the full growth_score, win 100%, worst +1.8 vs -7.8, OOS +5.7/+5.9), so it looked
  #   like the strongest signal on record and costs zero code. Its WITHIN-RUN ablation says otherwise at
  #   every weight (cap 20): removing the term is Δ+0.0 at 0.1, Δ+0.0/+1.2 at 0.25, Δ+5.4 at 0.5. The term
  #   never pays, and at 0.5 it costs. A factor that selects a good BOOK on its own is not the same claim
  #   as a factor that adds information to a score that already reads price, momentum and PEG.
  # (#40) METHODOLOGY, worth more than either result above and it invalidates a class of comparison used
  #   throughout these receipts. `backtest universe` FETCHES THE LIVE UNIVERSE EVERY RUN, and exchange
  #   endpoints fail differently each time ("Euronext ETF list failed 504 / venue list unavailable — using
  #   last-good copy (793 ISINs)" on one run, "Euronext Lisbon failed 500" on the next). The universe is
  #   therefore NOT constant across runs. Same config, same binary, same day, back to back:
  #     interest_cover w=0.25   run 1: scored 1385  rho +0.19  edge +145.9
  #                             run 2: scored 1378  rho +0.18  edge +138.6
  #   ~7 edge points and 0.01 rho of pure run-to-run noise, and it was caught only because a SCORE tilt
  #   cannot legally change `windows scored` — the pool moving 1378 -> 1385 was the tell. Without that
  #   impossible-by-construction check the +145.9 would have shipped as a +6.2 win.
  #   RULE: a cross-run edge delta under ~7 pts is NOT evidence. Two instruments are immune because they
  #   compare inside ONE universe: (a) the ablation lines, (b) the sweeps a single run prints itself
  #   (CORR-CAP, VALUE-GATE, SURVIVAL-GATE, held-book-by-factor, the weight CURVEs). Prefer those. Where a
  #   cross-run comparison is unavoidable — every GATE, since a gate changes the pool by design and cannot
  #   be ablated — require a SWEEP whose values all sit above baseline, not a single pair. (#37) survives
  #   exactly that test: 1.5/2.0/2.5/3.0/4.0 all landed +136..+149 against off's +122.4, five draws with
  #   none falling back. (#38)'s floor straddled baseline and was rejected; consistent.
  growth_fund_cap: 300.0     # (#3) clamp in the factor's OWN pts before weighting. 300 <=> PEG >= 0.33 stays
                             #   orderable; above that a data artifact would run away with the rank. The code
                             #   default stays 30 (earnings_yield's scale) per the house rule that defaults are
                             #   the neutral value and this fixture carries the live one.
  # (#43) ROIC — the FIRST non-empty `growth_fund_extra` entry, so the mechanism stops being inert here.
  #   WHAT IT IS: pre-tax EBIT / (equity + net debt), derived in core::roic_return from levels already
  #   cached (no refetch, no cache-key bump). Equity is reconstructed as NI / ROE, which is signed right
  #   by construction — a loss-maker has NI<0 AND ROE<0 so equity comes out positive, and genuine
  #   negative equity is where those signs DISAGREE.
  #   WHY, when `quality` already scores return-on-capital: ROE divides by equity ALONE. Over a 20-year
  #   hold a business compounds at what it earns on ALL capital, borrowed included, and quality_cap 40
  #   means everything above 40% ROE already scores identically — so the discriminating band is exactly
  #   where the leverage gap lives.
  #   ABLATION, three runs, weights 0.1/0.25/0.5 at cap 40. THE DECISIVE INSTRUMENT (within-run, so #40
  #   immune) and all three scored 1098 windows — an IDENTICAL pool, which is the (#40) tell coming back
  #   clean, so even the cross-run read is legal this time:
  #        weight   fund_extra:roic      quality_weight (SHIPPED, 0.15)
  #        0.1      edge Δ-2.8           Δ-1.9
  #        0.25     edge Δ-6.2   <- peak Δ-5.6
  #        0.5      edge Δ-2.3           Δ+4.5   <- the ROE term COSTS here; roic still pays
  #   Negative Δ = removing the term costs edge = the term pays. It pays at EVERY weight, peaks at 0.25,
  #   and beats the shipped ROE-based term at all three. Contrast the rejected `interest_cover` directly
  #   above: Δ+0.0 / +0.0 / +5.4 — never paid, and cost at 0.5. Opposite result on the same instrument.
  #   HELD-BOOK (same runs, identical n=178 across all three): book +15.4%/yr, excess +3.9, win 100%,
  #   worst +0.1, OOS +3.3/+4.3 — beats quality(roe/roa) (+15.1/+3.5, OOS +2.7/+4.1) and roe_raw
  #   (+15.1/+3.4, OOS +2.5/+4.1) on every column, within-run. It does NOT beat growth_score's +6.5
  #   excess, so it is not a better standalone book SELECTOR; the ablation says it ADDS information to a
  #   score that already reads price, momentum and PEG, which is the different and stronger claim — and
  #   the exact claim interest_cover failed while topping this very table.
  #   MECHANISM (live screen, roic on vs off, the check that rejected growth_max_margin_swing). Promotes
  #   AZO 10->3 and ORLY 12->7: buybacks drove BOTH to negative equity, so ROE is garbage (-73%, -332%),
  #   quality_return falls back to ROA (12.9%, 15.3%) and ROA understates them 4-5x. ROIC reads 70.6% and
  #   68.4%. MA 4->1 (116.9%, capped). GOOGL 6->9 at an honest 29.8%, passed by names that gained more.
  #   The direction is right everywhere the factor applies — the opposite of margin_swing, which cut the
  #   names it advertised protecting.
  #   THE COVERAGE ASYMMETRY — recorded here as "accepted", now FIXED by `neutral` below. 114 of 509
  #   cached filers (22.4% — banks, insurers, REITs, and also CVX/COP/DE/ADM/BMY/BIIB/HCA) file no
  #   operating margin, so roic is None, contributed 0, and in a RANKING a 0 is a relative demotion of up
  #   to weight x cap = 10 pts, not neutrality. PGR fell 1->10 and HCA 5->13 on ABSENT DATA, not on
  #   leverage. Re-censused on the `_facts10` cache: `op_margin` is the ONLY missing leg (77.6%) — revenue
  #   and net_margin and roe and roa all read 100%, net_debt 99.6% — so `core::roic_return`'s ROA fallback
  #   branch fires ZERO times, because the bail is `op_margin?` and sits before it.
  #   The old defence ("smaller than the primary tilt's 0.07 x cap 300 = 21 pts, identical shape") compared
  #   unlike things and is withdrawn. The primary's misses are CROSS-CLASS — an ETF or a coin has no PEG,
  #   and filling it from a filer median would flatter it — so all-or-nothing is right there. This term's
  #   misses are WITHIN-class: US filers, same lane, same peers, one absent line item. That is a data gap,
  #   and a data gap must not be scored as the worst possible business.
  #   NO credibility multiplier like MAX_EQUITY_MULT: only 6 names clear 150%, and a bar cutting MCK's
  #   artifact (1,639% on invested capital = 0.5% of assets) would take DECK (213% on 16%) with it, which
  #   is genuinely capital-light. The term's own `cap` already clamps both to any excellent business.
  growth_fund_extra:
    - factor: roic
      weight: 0.25           # the ablation peak above. 0.1 and 0.5 both still pay; 0.25 pays most
      cap: 40.0              # matches quality_cap — the band where return-on-capital still discriminates
      # (N) what a MISSING roic scores, instead of the old hard 0. 17.3 is the MEDIAN roic of the 395
      # covered filers under this same clamp(0,40) (mean 20.2; 19% clamp at the cap; 24 read negative).
      # "Unknown" therefore ranks as TYPICAL rather than as worst, while a KNOWN-BAD roic still floors at
      # 0 and ranks BELOW an unknown one — the clamp is outside the fill precisely to keep that ordering.
      # BACKTEST-BLIND, same label as growth_min_age_years / growth_min_aum_etf / growth_turnover_weight,
      # and blind for a reason worth stating: roic builds NO book on the as-of path (the held-book loop
      # now prints `roic n=0 rows` instead of silently skipping it), so there is no OOS split to read and
      # the census of today's filers is the only honest basis. If a later run gives roic as-of coverage,
      # sweep this value the way (#43) swept the weight.
      neutral: 17.3
  # (1) Overextension brake: how far ABOVE its own 200wk SMA a growth name has run. The P/E tilt
  # can't brake crypto/ETFs (no earnings); this can — it's price-only. Taper the score toward the
  # floor as price stretches above trend, killing blow-off-top chasing.
  growth_overext_cap: 100.0      # % above the 200wk SMA where the brake maxes out. Biting harder (100->60) cut edge +1.9->-9.5: over-penalizes good compounders that keep running above trend. Keep 100
  growth_max_above_ma: 150.0     # (#24) HARD gate above the brake: reject equities >150% above the 200wk SMA (crypto exempt).
                                 #   Past the brake cap the damp saturates, so a +486% blow-off (WDC 2026-07) scored like a +100%
                                 #   name; the brake can floor it but never remove it. Same-batch triple 2026-07-03:
                                 #   off +106.6 (wins +84.1, OOS +0.11|+0.06) / 100 +106.9 (edge-flat) / 150 +115.9
                                 #   (wins +88.1, OOS +0.13|+0.08) — and the names the 150 gate excludes average -125.1 pts
                                 #   forward vs peers (n=267). NOT the same cohort as the rejected R² gate (round 4: low-R²
                                 #   names near a high BEAT the field +61/+64): an ugly PAST is fine, an extreme PRESENT
                                 #   stretch is a measured loser. 150 > brake cap on purpose — the 100..150 band stays in the
                                 #   table (marked `!`), only the blow-off tail is cut. 0 = off.
  growth_maxdd_cap: 84.0         # (#26) reject equities whose worst-EVER peak-to-trough loss exceeds 83% (magnitude; crypto
                                 #   exempt — BTC itself is -83%). A >83% wipeout survivor is a lottery ticket, not a compounder.
                                 #   Same-batch pair 2026-07-03: off +119.5 (wins +91.5, OOS +0.13|+0.08) / on +128.4 (wins
                                 #   +98.3, OOS +0.14|+0.11 — BOTH halves up); the n=171 names it excludes average -16.5 pts
                                 #   fwd vs peers. Second gate-beats-damp case (after #24): Calmar as a continuous damp was
                                 #   measured harmful, yet the hard tail cut pays — damp-verdicts don't transfer to gates.
                                 #   0 = off.
  growth_maxdd_cap_crypto: 84.0  # (#26) crypto's own maxdd bar = "reject coins that wiped out WORSE than Bitcoin" (BTC -83%,
                                 #   so 84 keeps BTC and cuts the deeper-wipeout alts: ZEC -98, TRX -96, XMR -93, XRP -96,
                                 #   SOL -96...). Coins crash >90% every cycle, hence a separate looser bar than the equity 83.
                                 #   BACKTEST-BLIND in practice (almost no coin has the full 12y window, so the pool carries
                                 #   ~none) -> judgment gate like the turnover floor, validated by live-screen eyeball.
                                 #   If a future bear drags BTC below -84, raise this just above BTC's new mark. 0 = off.
  growth_max_vol_crypto: 3.0     # (#36) crypto-only VOL cap = "reject coins swinging WILDER than Bitcoin day-to-day" — same
                                 #   philosophy as the maxdd bar, applied to daily-return stdev (the VOL column) instead of the
                                 #   worst-ever tail. BTC ~2.4%/day, so 3.0 keeps the base with headroom and cuts the wild alts
                                 #   (OKB 3.4, LEO 3.1). Crypto absent from the backtest pool -> edge-blind by construction;
                                 #   judgment gate validated by live-screen eyeball. 0 = off.
  growth_max_peg: 1.6            # (#37) HARD valuation ceiling: reject an equity whose PEG exceeds this. Stored as PEG
                                 #   (reads like the column and like the request), APPLIED to `fund.peg_yield` — which is
                                 #   1/PEG x 100 — as `peg_yield < 100/growth_max_peg`, so a HIGH peg_yield is cheap. Since
                                 #   2026-07-27 this IS the printed `peg` cell: one PEG, both dividing by the score's own
                                 #   `picks::long_cagr_pct`. It was TWO numbers before (cell on pe_ratio/long_cagr_from, gate
                                 #   on a hardcoded trend_cagr) and they disagreed in both directions — see (#37) above for
                                 #   why that was overruled. Also rejects `eps_ttm <= 0` (no earnings to be cheap against);
                                 #   genuinely absent fundamentals still pass. THE NUMBERS BELOW PRICED THE OLD DEFINITION:
                                 #   +122.4 -> +139.7 edge, worst era +44.0 -> +63.0, every value in [1.5, 4.0] beating off
                                 #   without separating. The on/off finding is the durable half; the threshold half must be
                                 #   re-measured, because life CAGR sits below trend CAGR so every ceiling now bites harder.
                                 #   2.0 stays as the asked-for value inside a plateau, not a fitted optimum. 0 = off.
                                 #   TIGHTENED 2.0 -> 1.6 (2026-07-30, user's live value, per-knob stress grid): 8y-s edge +83.1
                                 #   vs +79.2 with h2h 52% vs 48%; 12y/20y flat (the gate is near-blind at the 20y king — SEC
                                 #   fundamentals start 2007, its cutoffs end 2006). Same [1.5, 4.0] plateau as above, but the
                                 #   cheap end now measures mildly better and costs nothing anywhere. Shipped as a pair with
                                 #   growth_min_cagr 19 (knob-K12 grid — interaction nil, see that receipt).
  growth_min_net_margin: 0.0     # (#38) net-margin floor on `fund.net_margin`. MEASURED AND REJECTED, kept at 0 with the
                                 #   receipt so it is not re-proposed: 5/10/15 all cost edge or era-stability, and combined
                                 #   with growth_max_peg it cancels that gate entirely and turns the newest era negative.
                                 #   Single-digit net margin is an INDUSTRY fact (retail, distribution, industrials), not a
                                 #   quality signal. Raising this cuts sectors, not bad companies. 0 = off.
  growth_max_margin_swing: 0.0   # (#39) MEASURED, EDGE-POSITIVE, AND DELIBERATELY NOT SHIPPED — kept at 0 with the receipt
                                 #   so the good numbers don't get it re-proposed. Rejects on net-margin std, which has no
                                 #   direction, so it cuts NVDA (36%->56%) and ANET (29%->39%) while CF and MPC survive: it
                                 #   punishes margin EXPANSION as readily as cyclicality. Needs downside-only dispersion, or
                                 #   pairing with margin_trend, before it means what its name says. 0 = off.
  growth_require_lifetime_uptrend: true # (#25) reject equities whose WHOLE-LIFE log-trend CAGR is <= 0: moon-crash-partial-recovery
                                 #   names whose 10Y leg looks great but never reclaimed their long-run trend (the ranked CAGR uses
                                 #   the longest 20Y/10Y/5Y leg, so it can't see this). Same-batch pair 2026-07-03: off +115.7
                                 #   (wins +87.9) / on +119.4 (wins +91.5), OOS +0.13|+0.08 both + either way. CAVEAT: barely binds
                                 #   in the backtest (n=10 excluded, mean fwd +30.2 -> sweep prints TOO TIGHT) because the 12y pool
                                 #   is survivors-only — the dot-com-wreck cohort this targets is mostly delisted and never enters.
                                 #   Shipped on live-table semantics + measured-harmless; a strongly POSITIVE sweep row on a future
                                 #   maintenance run is the signal to re-question it. Crypto exempt. false = off.
                                 #   STILL NOT BINDING 2026-08-01: the `->off` row admits 0 new names at ALL THREE stress horizons,
                                 #   so it prints "gate not binding on this sample" rather than any flag. Every name it would reject
                                 #   is already rejected by something else. The re-question signal has not fired; it also cannot fire
                                 #   on a survivors-only pool, so this stays a live-semantics judgment gate, not a measured one.
  growth_min_age_years: 0.0      # (#33) hard age floor on quote.age_years (whole-life listing age, the YRS column): reject a name
                                 #   younger than this many years. Shipped OFF (0.0) to DETECT EARLY WINNERS: a young strong grower
                                 #   (e.g. a fresh S&P 500 ETF, +21%/yr) still surfaces in the ranking, DOCKED by trust_factor (which
                                 #   already down-weights short-history names) instead of hard-cut — early-but-unproven, ranked below the
                                 #   proven compounders, not hidden. BACKTEST-BLIND either way: age_years is None in the backtest pool, so
                                 #   the gate never touches the validated edge; it only shapes the LIVE screen. Set >0 (e.g. 3) for a hard
                                 #   floor that trims the freshest listings entirely; pins always bypass (shown with a gate-review reason).
  growth_min_aum_etf: 100000000  # (AUM) ETF-only hard fund-size floor in EUR (quote.aum_eur, BF etp_search AUM, EUR-approximate —
                                 #   fund currency is EUR/USD mixed; ±10% FX is immaterial vs an order-of-magnitude line): reject a
                                 #   fund smaller than €100M, the industry viability line under which issuers liquidate/merge — the
                                 #   one way a 20y hold ends WITHOUT the strategy failing (a forced taxable exit + re-buy). Measured
                                 #   2026-07-05: median pond AUM €82M, 1791/3391 funds (53%) under this line. None-AUM names are NOT
                                 #   gated (missing data is not a small fund; BF only covers its venue — same stance as #33 age).
                                 #   BACKTEST-BLIND: aum_eur is None in the backtest pool -> gate inert there, validated edge
                                 #   untouched; live-only. 0 = off. Opt-in `aum` column (widths.columns) shows the number per row.
  growth_ter_drag: true          # (#34) ETF cost drag: dock the growth score by the ACTUAL 20-year wealth multiple the expense
                                 #   ratio eats, (1 - TER)^20. The TER is the one cost certain to compound against a decades hold, so
                                 #   two near-identical index ETFs (e.g. iShares vs Amundi Nasdaq-100) rank by NET return instead of
                                 #   momentum noise, and a 0.65% thematic ETF loses ground to a 0.10% broad one it only led on a
                                 #   reverting recent year. ETF-ONLY (expense_ratio is None for stocks/crypto -> x1.0). BACKTEST-BLIND:
                                 #   expense_ratio is None in the backtest pool -> x1.0 there, so the validated edge is byte-identical;
                                 #   this shapes only the LIVE ETF lane. false = off. (Magnitude: 0.10% TER -> x0.980, 0.65% -> x0.878.)
  growth_commodity_damp: 0.8     # (#44) COMMODITY dock: scale the growth score of a row whose earnings are a SPREAD on a
                                 #   traded input price — GICS Energy/Materials, or a fund whose name carries a commodity token
                                 #   (picks::is_commodity). Such a name's long CAGR is a spot-price snapshot, not a compounding
                                 #   record. 1.0 = off. The `c` rank flag prints either way; only the dock is knob-gated.
                                 #
                                 #   WHAT PROMPTED IT (live screen 2026-07-27, top-12 stocks):
                                 #     rank 1  CF Industries   Materials  CAGR +20%  maxdd -62%  R2 0.76  score 22.3
                                 #     rank 8  Marathon Petro  Energy     CAGR +19%  maxdd -81%  R2 0.68  score 10.1
                                 #   CF is a nitrogen producer (P&L = gas cost vs urea price); MPC is a refiner on the crack
                                 #   spread. They held the table's two LOWEST R2 and MPC its worst drawdown.
                                 #
                                 #   WHY NOT JUST READ R2, WHICH IS ALREADY A COLUMN: Amazon's R2 was 0.79 — BETWEEN the two.
                                 #   R2 measures the SYMPTOM (a lumpy climb) and cannot tell a commodity cycle from a dot-com
                                 #   crash. The sector names the CAUSE. Nor does the score already cover it: it prices lumpiness
                                 #   TWICE (growth_smoothness_weight 5.0, growth_underwater_weight 0.3, both swept) and CF
                                 #   cleared both and still ranked first.
                                 #
                                 #   THE ADJACENT NEGATIVE RESULT — the reason to hold this loosely. picks.rs records that (#1)
                                 #   an R2-steadiness damp @0.5 and (#3) a momentum-confirm damp @0.3 were BOTH measured
                                 #   edge-NEGATIVE (backtest universe ablation, 467 win: removing R2 lifted edge +45.6->+68.0,
                                 #   rho +0.18->+0.20) because "R2 docks exactly the parabolic compounders this lane exists to
                                 #   surface". A punish-the-lumpy-name damp has been tried here and it LOST. What differs: this
                                 #   docks a SECTOR, not a SHAPE, so it fires on 2 of 12 rows and never touches NVDA/AMZN — the
                                 #   cohort that killed the R2 version. That is an argument, not a measurement.
                                 #
                                 #   UNMEASURABLE BY CONSTRUCTION: `core::backtest_quote` builds every pool row from
                                 #   `Quote::stub(tk, "", "", tk)` — sector None (nothing outside screen.rs ever writes the
                                 #   field) and name == THE TICKER, not the fund's real name. So the damp is x1.0 in every
                                 #   walk-forward -> the validated edge is untouched AND this knob can NEVER be swept, unlike
                                 #   every weight around it. Same edge-blind class as growth_min_aum_etf/growth_max_vol_crypto.
                                 #   Proven exhaustively, not sampled: `quote_is_etf` falls back to `is_etf(&quote.name)`, and
                                 #   is_etf is a SUBSTRING match, so a ticker could in principle open the fund path. Ran the
                                 #   real predicate over both caches — 3551 backtest-pool tickers (.long_history_cache.json)
                                 #   and 8556 .isin_cache.json entries: 11 tickers DO satisfy quote_is_etf (the Polish
                                 #   "ETFB*.WA" / "TVBETETF.RO" family, which literally contain "etf"), but ZERO satisfy
                                 #   is_commodity — none carries a commodity TOKEN, and is_commodity token-splits where is_etf
                                 #   substring-matches. Both leak vectors closed over the WHOLE pool.
                                 #
                                 #   AND THE A/B THAT WOULD HAVE LIED: ran `backtest universe` at 0.8 and 1.0 anyway. They
                                 #   disagree — edge +58.3 vs +59.9, winsor +47.4 vs +49.0 — which reads as "the damp moved the
                                 #   edge" and is NOT that. `backtest universe` re-fetches the live universe per run and the
                                 #   venue feeds 504 at random: the 0.8 run lost Euronext Lisbon, the 1.0 run lost the Euronext
                                 #   ETF list, so they scored 4878 vs 4868 tickers over 8421 vs 8408 cutoffs. Different pools.
                                 #   A two-run A/B CANNOT prove inertness on this command — the pool noise is larger than any
                                 #   effect being tested. Anyone re-testing this knob: read the fetch header and the ticker
                                 #   count before believing a delta, on this row or any other.
                                 #
                                 #   WHY 0.8: it moves CF out of rank 1 (the thing that prompted the ask) without erasing it —
                                 #   CF 22.3 -> 17.84 (rank 1 -> 4), MPC 10.1 -> 8.08 (rank 8 -> 9). Both sit under EUR 1B
                                 #   turnover so liq_bonus is 0 and x0.8 on the pre-liq product IS x0.8 on the printed score.
                                 #   0.5 was rejected: it puts MPC on 5.05 against a growth_min_score of 5.0, i.e. one tick from
                                 #   vanishing — which defeats a flag whose whole purpose is to be SEEN. Set by judgement; if the
                                 #   ranks stop looking right, return this to 1.0 and keep the flag, which costs nothing.
                                 #
                                 #   ACCEPTED NOISE: Materials is ~50/50. CF/Mosaic/Freeport/Newmont/Nucor/Dow/Lyondell ride the
                                 #   cycle; Sherwin-Williams and PPG (branded paint), Linde and Air Products (industrial gas on
                                 #   15y take-or-pay), Ecolab, Vulcan/Martin Marietta (aggregates, local monopoly pricing) do not.
                                 #   Taken by direction: Energy-only would MISS CF, the rank-1 name this exists for, and the
                                 #   branded/contracted Materials names are slow compounders this momentum lane never surfaces.
  growth_fx_damp: 0.98           # (#45) FX/VENUE dock: scale the growth score of an ETF whose LIVE quote currency is not EUR
                                 #   (Yahoo `quote_currency` — GBp/GBP/USD/SEK/CHF lines all count; picks::is_noneur_etf).
                                 #   Prices what the ranking is otherwise blind to for a EUR buyer: broker FX conversion
                                 #   (~0.25% each way) plus the off-home-venue spread — a cost the EUR line of the SAME
                                 #   multi-listed fund does not carry. Currency, not country (user decision 2026-07-30): a
                                 #   EUR-quoted line on a non-eurozone venue costs no FX and is NOT docked. ETF-only, also a
                                 #   user decision — the stock lane is all-USD by nature, a uniform dock reorders nothing;
                                 #   crypto's -EUR legs already quote EUR. The `x` rank flag prints either way; only the dock
                                 #   is knob-gated, same split as `c`.
                                 #   WHY 0.98: tie-break strength, the user's pick over 0.95/0.90 — ~0.5-0.8% round trip
                                 #   amortized over a long hold is real but small, so it reorders near-equal scores (prefers
                                 #   the EUR twin) without burying a genuinely stronger foreign listing. TER is NOT this
                                 #   knob's job — growth_ter_drag above already prices the recurring cost.
                                 #   UNMEASURABLE BY CONSTRUCTION, same class as (#44): `quote_currency` is written only by
                                 #   the live fetch (fetch.rs chart meta); `core::backtest_quote` stubs leave it None, so the
                                 #   damp is x1.0 in every walk-forward — validated edge untouched, knob can never be swept.
                                 #   Set by judgement; if the ETF ranks stop looking right, return to 1.0 and keep the flag.
                                 #   LIVE EFFECT (screen A/B 2026-07-30, warm cache): IITU.L 8.4->8.2, XLKS.L 8.2->8.1,
                                 #   SEMI.AS 5.1->5.0 — note SEMI.AS is a Euronext AMSTERDAM line quoted in USD, the
                                 #   currency-not-country rule catching what a venue rule would miss. EUR rows (VVSM.DE,
                                 #   VUAA/SPYL/AUM5) and crypto identical; ranks unchanged at today's gaps (tie-break sized).
  growth_overext_floor: 0.05     # growth-score multiplier at full stretch. Tightened 0.2->0.15->0.05, each step a harder blow-off-top brake:
                                 #   buying right after a parabola = poor long-hold entry. The walk-forward sweep ranks 0.05 best: wide
                                 #   5y rho +0.26->+0.28 AND OOS-late rho +0.09->+0.14 (durability up 55%) with edge flat (+108.5->+106.8).
                                 #   The old "0.1 docks NVDA out" worry was regime-bound — at 0.05 today NVDA still scores 6.7 > min_score
                                 #   5 (it's -10.6% off-hi, not parabolic) and the displayed order is unchanged. 1.0 = brake off.
                                 #   RE-FIT ON THE cagr-19 POOL 2026-08-01 (Phase B, pb-of*-*-s.txt): 0.05 HOLDS.
                                 #   THE FINDING IS THE SHAPE, not the winner — this knob has ZERO rank-1 authority. King
                                 #   rank-1 is byte-identical at EVERY value swept (0.02 / 0.05 / 0.10 / 0.20 all read
                                 #   +5.3 median, win 81%, h2h 60%; 0.02 is +5.5 mean vs +5.4, noise) while lane edge falls
                                 #   monotonically as the brake weakens: +684.4 / +677.4 / +631.6 / +553.8. It is a PURE
                                 #   LANE-EDGE lever, and growth_accel_weight is its mirror (pure rank-1, edge-costing).
                                 #   Tune the two independently — that orthogonality is why Phase B could ship accel
                                 #   without re-opening this knob.
                                 #   0.20 costs 18% of king edge and 19% at 8y (+58.4) for rank-1 that never moved —
                                 #   consistent with the ablation table (removing the brake outright = -457 at 20y).
                                 #   0.02 buys +7 at king (noise, inside the band) and SELLS 8% of 12y edge (+198.3 vs
                                 #   +215.1) and 5pp of 8y h2h. 0.05 is the balance point; 0.10 just loses 7% of king.
                                 #   NOTE the 0.10 king run first ABORTED (rc=134, `free(): invalid size` — glibc heap
                                 #   corruption, half the report lost mid-file). Re-run ALONE it exited clean and
                                 #   reproduced edge +631.6 EXACTLY, so the abort hit output teardown, not the maths.
                                 #   Same session had rustc SIGSEGV under memory pressure: environmental, not config.
  growth_turnover_weight: 0.0    # (L) ZEROED 2026-07-02 after a live A/B (screen at 0.5 vs 0.0): the ln(turnover/€1B) tilt is
                                 #   BACKTEST-BLIND (backtest quotes carry no turnover) and the A/B showed it does NOT do its
                                 #   claimed job — it's reward-only, so illiquid junk (ROX.DE €11K/day) sat in the ETF table
                                 #   WITH the tilt on; all it did was float mega-caps (AAPL/AMZN/TSLA) a few rows and swap
                                 #   AMD in over FTNT at the tail on turnover alone. A blind term that reorders with no
                                 #   validated edge gets neutralized (same rule as growth_value_weight). Thin listings are a
                                 #   GATE problem: use min_avg_turnover_eur (e.g. 1000000) to drop them outright. 0.5 = old tilt
  growth_overext_cap_crypto: 100.0 # (#4) crypto's own brake cap; =equity (no change). Raise (e.g. 200) to brake crypto later — unvalidated (crypto windows too sparse to isolate)

  # (4) Crypto market-greed damp from Bitcoin NUPL (already fetched for the screen footer). High NUPL
  # = whole-market euphoria/top -> shrink ALL crypto scores (thins the crypto tables in a frothy top,
  # fattens them after a flush). Applies to both lanes, crypto rows only.
  nupl_euphoria: 0.5             # NUPL above this starts damping crypto (~0.5 = greed/"belief" zone)
  nupl_damp_floor: 0.5           # crypto-score multiplier at NUPL 1.0 (peak euphoria); 1.0 = damp off
  nupl_capitulation: 0.25        # NUPL below this starts BOOSTING crypto (~0.25 = fear/accumulation); 0 = boost off
  nupl_boost_ceiling: 1.3        # crypto-score multiplier at NUPL 0 (deep capitulation); 1.0 = boost off. BACKTEST-BLIND judgment lever — keep mild

  # RISK-ADJUSTED-RETURN tilts (B/C) — Sharpe ratio (return ÷ volatility) and Calmar ratio (return ÷
  # worst peak-to-trough drawdown), from the SAME closes already fetched, ZERO extra network cost.
  # Reward a calm, shallow-drawdown compounder over a knife-y one with the same headline CAGR.
  # (The old R²-smoothness "consistency" damp was deleted: it read pure edge-harm with no rho gain —
  # disabling it had nearly DOUBLED wide 5y edge +50.5->+95.6. Past path-smoothness doesn't predict return.)
  sharpe_weight: 0.05            # (B) GROWTH lane: reward per unit CAGR/volatility. History: 0.3->0.15 halving was peak edge
                                 #   PRE-smoothness. Re-swept 2026-07-04 AFTER growth_smoothness_weight shipped: trend_r2 carries
                                 #   the same calm-compounder signal, so Sharpe's marginal value shrank — 0.05/0/0.10 plateau at
                                 #   edge +148.0/+147.0/+145.8 vs +137.2 at 0.15 (same batch, rho +0.13 flat). 0.05 = measured max;
                                 #   kept NON-zero deliberately: the ETF lane (absent from backtest) leans on the Sharpe leg for its
                                 #   risk reward and the sharpe_cap_etf fix, so zeroing would be an unmeasured live ETF regression. 0 = off
  onsale_sharpe_weight: 0.0      # [FOIL] (B) ON-SALE lane's own Sharpe weight, split from growth because the shared knob conflicted:
                                 #   ablation showed growth wants 0.15 but on-sale wants 0 — zeroing it lifts the on-sale 12y edge
                                 #   +39.2->+62.9 (Δ+23.7) while growth keeps 0.15. 0 = off (the swept on-sale optimum)
  sharpe_cap: 15.0               # (B) cap that CAGR/volatility ratio
  sharpe_cap_etf: 9.0            # (#37) ETF-only Sharpe cap: cross-listed lines of the SAME fund print different daily
                                 #   stdev (NASD.L 1.8%/day vs CSNDX.SW 1.1% for identical Nasdaq-100 holdings — thin-line
                                 #   prints + FX conversion), so ETF CAGR/vol above ~9 measures listing-line noise, not
                                 #   fund risk. Uncapped, that noise (0.15×Δsharpe ≈ 0.7 score) outvotes the real TER
                                 #   difference (2.2% over 20y) and ranks the COSTLIER identical wrapper higher. 9.0 ≈ the
                                 #   noise floor observed across same-index wrapper trios. Stocks keep sharpe_cap; the
                                 #   backtest pool holds stock constituents only -> validated edge byte-identical. 0 = off
  calmar_weight: 0.0             # (C) ZEROED. Calmar (CAGR/max-drawdown) is harmful at the 12y horizon: 1.0->0 lifts GROWTH
                                 #   edge +92.7->+98.0, rho +0.06->+0.07, top-half +4.6->+7.3 — all three improve. Over a 20y hold the
                                 #   deepest-drawdown names are often the biggest compounders; penalizing path-pain deselects them.
                                 #   sharpe (0.15) stays — removing it COSTS edge (Δ-3.1), so volatility-awareness still helps. 0 = off
  calmar_cap: 2.0                # (C) cap that CAGR/max-drawdown ratio

  prefer_eur: true               # dedup currency twins (BTC-EUR/BTC-USD): keep EUR leg if true, else USD
  growth_require_peg: true       # require a PEG to score a name. The growth_score reads PEG (1/PEG x 100) and the gate rejects PEG > growth_max_peg, so a missing PEG is a free pass. This knob forces a missing PEG to fail the gate. Reads `fund.eps_never_reported` (filer-level, never as-of), NOT `peg_yield.is_none()` — the cohort is filers whose 10-K states no per-share element at all, 8 of 509 cached US names, seven of them now FIXED by the XBRL-instance fallback. Residue today: ARES alone. false = off

# --- live-universe fetch breadth + pacing (so the backtest gate scans the same wide pool `screen` does) ---
# How many symbols PER CLASS (crypto + stocks/ETFs) `screen` pulls from the live sources
# (coingecko_markets + sp500_csv URLs below). Bigger = more to scan = slower (one history
# fetch per ticker, in parallel) + more rate-limit risk. `screen TICKER...` overrides everything.
universe_size: 1234000

# Max fetches in flight = CPU cores × this multiplier. In-flight memory holds the large 10y + monthly
# chart payloads, so this is the MEMORY/stability knob, not the speed knob (the pacer below sets speed).
# 8 cores × 8 = 64 was stable across full 3847-name screens; conc=128 (mult 16) got SIGKILLed mid-run.
# Keep cores×mult ≈ 64: on a 16-core box use mult 4, on 4-core use 16. 0 is treated as 1.
fetch_concurrency_multiplier: 8

# Global outbound-request pacer (requests/second) — THE speed knob. Spaces request LAUNCHES so the
# fan-out can't burst-429 (concurrency bounds in-flight count but not the launch burst). Yahoo's limit
# is undocumented. Measured at full universe (3847 names, ~3 Yahoo calls/name): rps 60 = 0 valid names
# lost in 4m27s; rps 40 = 0 lost in 6m37s. 60 nearly saturates conc 64, so higher rps needs more
# concurrency (which risks the memory kill above) for little gain. Lower if you see real names drop,
# 0 disables pacing (a 64-wide burst then drops valid names — e.g. NVDA — so don't).
fetch_requests_per_second: 60.0

# Quote the live-universe crypto in EUR (BTC-EUR) if true, else USD (BTC-USD). Mirrors
# buy_heuristic.prefer_eur but for what `screen` fetches. US stocks/ETFs have no EUR listing.
universe_prefer_eur: true

# `screen` SECTOR FILTER — which type of companies/ETFs to fetch. Case-insensitive substring
# keywords matched against a stock's GICS sector AND an ETF's fund name. Empty list (or omitted) =
# fetch ALL sectors (the default). Stocks are filtered BEFORE fetch (by their GICS sector, so other
# sectors are never even pulled); ETFs carry no GICS, so they're filtered by fund name. Crypto is
# never sector-filtered. `screen TICKER...` (explicit tickers) ignores this. Examples:
#   tech only:  [Technology, Communication, Semiconductor]   ("Technology" catches GICS "Information Technology")
#   healthcare: [Health]                                     energy: [Energy]   financials: [Financ]
#   ALL sectors: []   (empty list — or comment out the `sectors:` line below entirely)
sectors: []

# ntfy.sh topic for `alert`. Anyone who knows it can read your alerts (= your watchlist), so treat it
# like a password: this COMMITTED base carries a DUMMY only. Put a real, long, random private topic in
# the gitignored config/settings.yaml overlay (NEVER here — this file is committed + pushed).
ntfy_topic: "ci-smoke-tests-unused"

# Data-source URLs. Templates use {placeholder} tokens filled at fetch time: {ticker} {range} {n}
# {topic} {key}. Swap a source by editing the URL here, no rebuild of logic needed (only the response
# shape must match what the parser expects). The keys with a built-in code default (constituents_csv,
# euronext_lisbon, fundamentals*) are listed here for documentation — omit
# any and it falls back to the SAME URL, so the backtest gate already fetches them either way.
urls:
  yahoo_chart: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range={range}&interval=1d&events=div,split"
  # hourly bars over ~5 days -> screen 1h/6h/12h columns (counted as 1/6/12 bars back, not wall-clock,
  # so stocks fill too despite overnight gaps; 5d ensures >=13 bars even for a 6.5h trading day).
  yahoo_intraday: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=5d&interval=60m"
  yahoo_search: "https://query1.finance.yahoo.com/v1/finance/search?q={ticker}&newsCount=3&quotesCount=0"
  yahoo_quote: "https://finance.yahoo.com/quote/{ticker}"
  euribor: "https://www.euribor-rates.eu/en/current-euribor-rates/2/euribor-rate-3-months/"
  us_cpi: "https://api.bls.gov/publicAPI/v1/timeseries/data/"  # BLS CPI-U index (monthly); seriesid + year window POSTed by fetch (path-GET ignores years). v1 = no key, 10y/call
  pt_cpi: "https://bpstat.bportugal.pt/data/v1/domains/12/datasets/7f13efcd65fc6bd0c5adb0e8d29d9b44/?lang=EN&series_ids=5721550"
  # COICOP-2018 successor (Feb 2026): prc_hicp_manr was TERMINATED at 2025-12; minr carries the
  # same annual-rate series (unit=RCH_A, all-items now coicop18=TOTAL) but only back to 2000.
  eu_hicp: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_minr?format=JSON&lang=EN&unit=RCH_A&coicop18=TOTAL&geo=EU27_2020"
  # the frozen pre-2026 dataset, still served: merged UNDER the live series for the 1997-1999 tail
  eu_hicp_old: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr?format=JSON&lang=EN&coicop=CP00&geo=EU27_2020"
  # {n} = top-N crypto by market cap; `screen` maps each .symbol to SYMBOL-USD (Yahoo form)
  coingecko_markets: "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page={n}&page=1"
  # S&P 500 constituents CSV (first column = Symbol); `screen` maps '.'->'-' for Yahoo
  sp500_csv: "https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv"
  # (Item 18/32) extra equity ponds APPENDED to the S&P 500 set, to widen the grower pool the proven
  # ranking draws from. Each entry is a CSV (col0=Symbol; col2=GICS Sector, or 2-column Symbol,Name ->
  # sector "other") OR a Wikipedia "List of S&P N companies" page (host picks the parser). A dead URL
  # or unrecognizable page just drops that pond — never crashes the screen.
  # Nasdaq-100 (yfiua/index-constituents, auto-updated monthly): ~13 large growers not (yet) in the
  # S&P 500 (the PDD/ARM profile — exactly what the lane ranks). VALIDATED 2026-07-03, same-batch 12y:
  # baseline edge +126.7 (OOS +0.14|+0.10) -> with n100 +126.8 (OOS identical) — free supply, no dilution.
  # S&P MidCap 400 (Wikipedia page) MEASURED-REJECTED same batch: +400 mid-caps CUT the edge to +85.0
  # and halved rho (+0.13 -> +0.07) — the persistence signal the lane rides is weaker in mid-caps
  # (they mean-revert more). Do NOT re-add without a new same-batch run that clears the bar.
  # FTSE 100 + DAX (yfiua CSVs, the free STOXX-600 proxy) MEASURED-REJECTED 2026-07-04, same-batch
  # 12y: baseline edge +127.6 (rho +0.13, OOS +0.14|+0.10) -> with 140 EU large-caps +117.0
  # (rho +0.11, OOS +0.11|+0.09, winsorized 97.7 -> 89.1) — every dial moved down, same direction
  # as the MidCap rejection: the US-momentum persistence the lane rides is weaker in EU large-caps.
  # RE-TESTED AND REJECTED AGAIN 2026-07-25, this time with FTSE MIB added (the one pond never
  # measured before) — DAX 40 + FTSE MIB 40 + FTSE 100 100, same-batch 12y: baseline 4913 tickers
  # edge +156.8 (rho +0.15, OOS +0.14|+0.12, winsorized +126.7) -> with the three ponds 5077 tickers
  # edge +136.0 (rho +0.13, OOS +0.11|+0.12, winsorized +106.4). Every dial down or flat, none up,
  # and the -20.8 falls well inside the 90% bootstrap bands ([+99.1 … +197.7] vs [+87.6 … +187.2]),
  # so it is not even distinguishable from noise — an indistinguishable result does not overturn a
  # prior measured rejection. Three runs, three ponds, one direction; Italy did not rescue it.
  # Do NOT re-add without a new same-batch run that clears the bar.
  # NOTE for whoever tries a fourth time: the dilution is a POOL effect, not just extra rows being
  # ranked — forward returns are de-meaned per ~6mo cutoff, so +164 EU names move every bucket's
  # mean. Widening the pond can therefore only pay if the new names rank as well as the incumbents,
  # and by three measurements EU large-caps do not.
  constituents_csv:
    - "https://yfiua.github.io/index-constituents/constituents-nasdaq100.csv"
  # Euronext Lisbon equities (POST, DataTables JSON; mics=XLIS) -> Portugal `.LS` stock universe
  euronext_lisbon: "https://live.euronext.com/en/pd_es/data/stocks?mics=XLIS"
  # latest Bitcoin NUPL (net unrealized profit/loss), free on-chain sentiment gauge; `screen` prints it after the crypto table
  nupl: "https://bitcoin-data.com/v1/nupl/last"
  # (E) trailing-P/E source for the valuation tilt. {ticker} + {key} (key from FMP_API_KEY env, NOT
  # here). Equities only, and only when the env key is set — free tiers are rate-limited, so use it
  # for `check` (~55 tickers), not the ~750-ticker `screen` (where P/E stays None -> neutral tilt).
  fundamentals: "https://financialmodelingprep.com/stable/quote?symbol={ticker}&apikey={key}"
  # (F) ROE/quality source for the profitability tilt — FMP stable ratios-ttm (carries returnOnEquityTTM).
  # Same FMP_API_KEY opt-in / `check`-scale profile as `fundamentals` above. (v3 legacy died 2025-08-31.)
  fundamentals_quality: "https://financialmodelingprep.com/stable/ratios-ttm?symbol={ticker}&apikey={key}"
  ntfy: "https://ntfy.sh/{topic}"
