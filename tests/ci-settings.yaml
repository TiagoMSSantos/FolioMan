                                 #     net of cost   -65.1 "too churny"       +85.6
                                 #     eras          -69.6/-7.0/-142.6/-85.5  +45.4/+123.7/+24.2/+83.5
                                 #   Read the eras row twice: ALL FOUR flip sign. This lane ranked BACKWARDS
                                 #   — its band sat entirely below zero, i.e. the names it liked underperformed
                                 #   the ones it did not — and paying for trailing yield was the reason.
                                 #   NOT A NEW DISCOVERY, WHICH IS THE UNCOMFORTABLE PART: the `dividend_weight*`
                                 #   ablation row printed Δ+150.7 in every wide on-sale table for as long as the
                                 #   row has existed, and this arm reproduces it to the decimal (-65.0 + 150.7 =
                                 #   +85.7). It went unread because a footnote asserted the term was inert in a
                                 #   price-only run; that footnote was stale from (#53) and is now fixed.
                                 #   WHY A YIELD TILT RANKS BACKWARDS HERE, offered as mechanism and not proof:
                                 #   this lane already rewards being cheap and beaten-down, and high trailing
                                 #   yield on a fallen price is the same fact a third time — it is a dividend
                                 #   YIELD, so the denominator is the very drop `discount_weight` is paying for.
                                 #   `discount_weight` ablates at Δ-88.9 (removing it HURTS), so the lane wants
                                 #   the dip; it just must not buy the dip twice.
