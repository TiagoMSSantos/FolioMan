  #   the universe's `etf_set`). Both are present in the backtest, and both are the SAME inputs the live
  #   screen scores on — which is the whole bar for gradeability.
  #   THE MEASUREMENT: the `tax_split ->off` ablation — both arms set EQUAL, which is this knob's real "off"
  #   (0.0 would mean an EU dividend is worth nothing, a different question) — reads edge Δ+0.0 at 12y, 20y
  #   and stress, Δ+0.5 at 8y, rho Δ-0.00. The dividend WEIGHT the split scales ablates at Δ+142.8 in the
  #   same table. The split is a rounding detail next to the term it multiplies, which is what the SIZING
  #   note below already implied at ~0.06 pts. VERDICT: 0.76/0.72 STANDS, measured-inert, same as the weight.
  #   WHERE IT IS MEASURED, and why not in the growth lane: sample. The growth gates admit 4 EU payers out
  #   of 80 scored rows on the fixture, so a growth-lane sweep of a tax knob is flat for want of rows
  #   WHATEVER the truth; the on-sale lane scores 526 windows. Reading it across lanes is legitimate because
  #   `tax_keep` is shared by both by construction (see `picks::dividend_reward`). Caveat, stated honestly:
  #   the on-sale lane is a FOIL that ranks backwards on purpose, so a NON-ZERO result there would have
  #   needed care to interpret. A Δ+0.0 does not. A growth-lane `weight_curve` for this knob was built, run
  #   and DELETED — 17 lines of golden output to report the same Δ+0.0 that one ablation row reports.
  #   ALSO BY DESIGN: realized returns stay price-only on BOTH legs, so the excess vs ^GSPC stays
  #   apples-to-apples. This measured whether yield helps SELECT, never total-return performance.
  #   SIZING, unchanged: 0.5 peaks the term at +2.25 (6% yield × cap), under quality's +6 blind ceiling
  #   and far under the old 1.5's +9 — that magnitude is exactly what got it cut. The TAX scaling below is
  #   worth ~0.06 pts on a 5-19 pt score at a 4% yield. Read by BOTH lanes.
