  dividend_weight: 0.5           # LIVE: reward per % of trailing-1Y yield, AFTER the tax keep-rate (0 = OFF). GROWTH LANE ONLY since (#61)
  # (#62) MEASURED AT ZERO WIDE, ON PURPOSE, AND KEPT — so that nobody spends the six runs again. Same
  #   batch and same rule as the `growth_smoothness_weight` deletion above; this arm zeroed the GROWTH
  #   half only (post-(#61), so the on-sale flip is not mixed in) at 20/12/8y, n identical at 481/668/852:
  #     horizon   lane edge          rank-1 mean|med          h2h vs 11-20 book     null floor
  #     20y       +459.5 -> +451.4   +6.2|+6.4 -> +6.2|+6.4   16/21 -> 16/21 (76%)       93.3
  #     12y       +132.0 -> +135.2   +5.8|+7.2 -> +5.8|+7.2   17/30 -> 18/30 (57->60%)   15.4
  #      8y        +59.3 ->  +63.6   +7.2|+8.2 -> +7.2|+8.2   24/38 -> 24/38 (63%)       16.0
  #   BY THE LETTER OF THE DELETION RULE THIS ARM PASSES — the book never degrades, h2h is >=50% at all
  #   three, and the one negative edge move (-8.1 at 20y) is 11x under that horizon's floor while 12y and
  #   8y come back POSITIVE. It is kept anyway, for two reasons that are not "the number was close".
  #   ONE: the rank-1 column is BYTE-IDENTICAL at all three horizons. Not "held" — identical to the
  #   printed digit, twice over, mean and median. A term with zero rank-1 authority cannot be graded by a
  #   test whose verdict IS rank-1; the run did not find the term worthless, it found the instrument
  #   blind to it. (#60)'s symmetry rule applies unchanged: under-floor means UNRESOLVED, not disproved,
  #   and that cuts against deleting exactly as hard as it cuts against shipping.
  #   TWO: after (#61) zeroed the on-sale half, this weight is the LAST live consumer of the Portuguese
  #   englobamento model (tax_keep_eu / tax_keep_other / the 50% Art. 40.º-A EU exclusion). Zeroing it
  #   would retire that model by side effect of a metric that just told us it cannot see this term. The
  #   model's claim was never "after-tax yield predicts return" — it was "the yield shown to a human
  #   should be the yield that human keeps", which is (#58)'s standing verdict on the per-market map and
  #   is not a claim the backtest is entitled to refuse.
