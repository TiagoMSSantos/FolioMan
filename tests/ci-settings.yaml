# CANONICAL BASE config — the full, documented, shared configuration. NO secrets: ntfy_topic is a dummy
# (the tests never push), every URL below is a public, unauthenticated endpoint. THREE consumers:
#   - network-smoke (per-PR): only urls.yahoo_chart is exercised.
#   - backtest-gate (nightly + push/PR): runs `backtest 12 universe`, scoring with buy_heuristic below.
#   - the private config/settings.yaml INHERITS this file (config::load deep-merges it as the base), so the
#     gitignored local overlay only OVERRIDES what it changes. By convention it now carries ONLY the
#     watchlist (tickers), the table column layout (widths), and any local secret (a real ntfy_topic) or
#     knob under test — EVERYTHING ELSE lives HERE. Overlay wins field-by-field. Edit shared config HERE.
# Omitted knobs fall back to the code's #[serde(default)] (== the shipped defaults).
tickers: []

# --- `check` / `alert` / `perf` display + scan knobs (display/report only — NOT scored by the backtest gate) ---
# OFF-HI anchor: 0 = drawdown vs the ALL-TIME high over the fetched ~10y history (recommended for a
# decades buy-and-hold: "on sale vs the proven peak", pairs with the below-200wk-SMA cheap reward).
# Or set N days for a trailing-N-day high (365 = last year only, recency-biased; 1825 = ~5y cycle).
high_days: 0
drawdown_pct: 1000.0
dip_days: 30       # trailing window (days) for the vs-high dip
drop_pct: 5.0      # `alert` fires when a name is >= this % below that window high
top_picks: 20      # how many "buy candidate" rows `check` lists after the table
# deploy-math base (€ you put in per month): `screen` prints "DEPLOY THIS MONTH: €base × entry-state
# multiplier" (near-high 1×, pullback 1.5×, drawdown 2× — the backtest's deploy-faster shape). 0 = line
# off. PERSONAL number — set it in the private config/settings.yaml overlay, never here.
monthly_deploy_eur: 0

# Per-horizon ±days averaged around each horizon's anchor date when computing 1D/1W/.../20Y %
# changes (smooths a single outlier day; 0 = exact day). All optional — omit the block or any
# label to use the built-in defaults (core::default_anchor_half): 1D 0, 1W 7, 1M 30, 6M/1Y 90,
# 5Y/10Y/20Y 365. Override only the labels you want to change.
anchor_windows:
  1D: 0
  1W: 3
  1M: 15
  6M: 91
  1Y: 182
  5Y: 365
  10Y: 365
  20Y: 365

# Show REAL (inflation-adjusted) returns on the 1Y/5Y/10Y/20Y % columns instead of nominal. A
# coin/stock up +50% over a span that saw +10% inflation is really only ~+36% in purchasing power.
# Deflates by the ACTUAL cumulative EU HICP inflation over each horizon, fetched live (same source
# as the check footer) — no rate to guess. Shorter horizons (1D/1W/1M/6M) are never adjusted.
inflation_adjust:
  enabled: true       # true = deflate long-horizon returns by live EU HICP; false = raw nominal %

# ============================================================================================
# BUY HEURISTIC (src/picks.rs). Acronyms (CAGR, ROE, P/E, NUPL, SMA, FX, ...): see Glossary in README.md.
#
# This is the COMMITTED, canonical base. BOTH the backtest-gate scores AND the live `screen` read it:
# the gitignored config/settings.yaml deep-merges OVER this file field-by-field, so the local overlay
# only needs to carry what it OVERRIDES (a secret, the watchlist, or a knob under test). Edit a value
# here to move the validated default for everyone; the rich "why" comments below are the shared record.
#
# There are TWO scoring lanes, and `screen` prints ONLY ONE of them:
#
#   • GROWTH lane (`growth_score`)  --> THIS is what `screen` prints. Proven compounders at/near
#       their own ~10y high, still climbing — the only lane with a validated forward edge. Live score:
#         base  = growth_trend_weight·CAGR + growth_accel_weight·accel + risk + quality + dividend
#         score = base · proximity · value(P/E tilt) · geomean(trust, overext_brake) + liquidity
#       (CAGR = Compound Annual Growth Rate; accel = how much the last 1Y outpaced that CAGR.)
#
#   • ON-SALE lane (`buy_score`)    --> BACKTEST FOIL ONLY. `screen` does NOT print this. It exists so
#       `cargo run -- backtest` can demonstrate that dip-buying has NEGATIVE edge over a 20yr+ hold.
#       Every knob tagged "[FOIL]" feeds ONLY this lane: changing it does NOT change `screen` output.
#
# So to tune what `screen` shows, touch ONLY the knobs NOT tagged "[FOIL]". GATES drop a candidate
# outright (and reshape the ranking the most — tune these first); SCORE knobs only re-rank the
# survivors. All knobs optional (omit any -> built-in default). See README.md "Tuning the buy heuristic".
# ============================================================================================
buy_heuristic:
  # --- GATES (fail any one -> excluded before scoring) ---
  min_1y_pct: -25.0              # [FOIL] on-sale only: reject if 1Y % <= this (growth uses a hardcoded 0% floor for equities, not this)
  min_1y_pct_crypto: -50.0       # LIVE (crypto/FX -EUR/-USD): 1Y floor for the crypto growth lane — coins swing far harder than
                                 #   stocks, but a coin down worse than -50% on the year is a crash, not a swing (BTC's own bad
                                 #   year is -33.5%, comfortably inside; GT -62 / BGB -60 out). Was -75, which let deep crashers rank
  max_1m_drop_pct: -20.0         # LIVE: reject if 1M % <= this (a hard monthly crash = falling knife) — both lanes
  max_1m_drop_pct_crypto: -35.0  # LIVE (crypto/FX): looser knife — a -20%/month alt is normal — both lanes
  min_long_pct: 30.0             # [FOIL] on-sale only: reject unless EVERY 5Y/10Y/20Y leg is > this (growth uses a hardcoded >0% 5Y consistency gate instead)
  min_long_pct_crypto: -70.0     # [FOIL] on-sale only: reject if the >2Y leg <= this CUMULATIVE % (a corpse, e.g. -95%)
  min_avg_turnover_eur: 500000   # LIVE: reject names with < this avg daily turnover (EUR) on THIS listing — both lanes.
                                 #   Set 2026-07-02 at 100K after zeroing the turnover SCORE tilt (which never docked
                                 #   junk): a hard gate is the honest tool for untradeable listings. 100K killed the real
                                 #   junk (Expat Romania €11K/day, Expat Greece €0K, GraniteShares FAANG €0K).
                                 #   Raised to 500K 2026-07-03 (live full-screen A/B vs 100K): drops exactly 4 thin ETF
                                 #   listings — both silver ETCs (XSLE.DE €327K, XSLR.MI €125K, commodity spikes ranked
                                 #   #1-2 on sub-5y history) + CHIP.SW €266K + WTEC.SW €164K (side listings; semis/tech
                                 #   coverage kept via VVSM.DE €38M, SEMI.AS €6M, XDWT.L €3M). Stocks + crypto tables
                                 #   byte-identical. Turnover is PER LISTING, not fund AUM — 500K still spares any
                                 #   listing a retail order can actually exit. Pinned watchlist names bypass all gates
                                 #   (sentinel score). BACKTEST-BLIND (backtest quotes carry no turnover) — the
                                 #   validated edge and CI gate are untouched. 0 = off
  endpoint_smooth_days: 105      # LIVE+BACKTEST: the "current price" used by the LONG-horizon MEASUREMENTS (>=1Y
                                 #   perf %/long CAGR legs, range position, drawdown — so the hard range gate) = mean
                                 #   of the closes in the last N TRADING DAYS. 105 ≈ 5 months. The span converts to
                                 #   bars by the run's cadence (105 daily closes live; 5 monthly bars in the 12y
                                 #   backtest) so the smoothing covers the SAME calendar time both sides — train ==
                                 #   serve. What stays RAW on purpose: the displayed price, the short legs (1D/1W/1M
                                 #   incl. the 1M knife — a months-wide average would make "this month" meaningless),
                                 #   and the overext brake (smoothing it measured WORSE: it under-reads fresh spikes).
                                 #   VALIDATED 2026-07-02, window swept on the monthly engine (bars: edge):
                                 #   1: +109.7 | 2: +103.3 | 3: +109.4 | 5: +115.7..+120.2 | 8: +103.0 — clean hump
                                 #   at 5 bars ≈ 105 trading days, all OOS halves +. 1 = raw last close (old
                                 #   behaviour). Edge-affecting: re-validate `backtest 12 universe` before changing.

  # --- SCORE — ON-SALE LANE (`buy_score`) — [FOIL] ALL of this section is backtest-only; `screen` ignores it ---
  normal_volatility_pct: 2.0     # [FOIL] a "typical" daily swing %; the dip is scaled by normal/asset vol,
                                 #   so a calm name's pullback counts for more than a wild one's
  discount_cap: 35.0             # [FOIL] cap on that volatility-scaled dip (one very deep name can't dominate)
  discount_weight: 0.35          # [FOIL] (#4) multiplier on the dip reward — on-sale dip-depth carries no selection skill (rho
                                 #   negative on 53 names, ~0 on the 354-name wide sample), so 0.35 shifts weight to the
                                 #   CAGR/sharpe terms WITHOUT gutting on-sale scores (0.15 dropped normal names below
                                 #   min_score for only a noise-level rho gain). 1.0 = old behaviour, 0 = drop it entirely.
  # Goal = multi-decade buy-and-hold, so momentum is NEUTRAL (1.0/1.0): a green/red WEEK is noise
  # over a 10-50y hold and must not reorder the ranking. Want a short-term timing view (e.g. for
  # `check`)? Set bounce ~1.3 / knife ~0.6 to reward a confirmed turn and dock a falling knife.
  momentum_bounce: 1.0           # [FOIL] discount ×this on a green week off a dip — 1.0 = ignore weekly timing
  momentum_knife: 1.0            # [FOIL] discount ×this while still falling — 1.0 = ignore weekly timing
  # (A) Long-trend reward = the proven-compounder signal for a decades hold, now on the long leg's
  # CAGR (Compound Annual Growth Rate, %/yr — annualized so a 10Y and a 20Y leg compare fairly).
  long_trend_weight: 0.5         # [FOIL] on-sale reward per %/yr of long-leg CAGR (×cap below = max bonus, ~15)
  long_trend_cap: 30.0           # LIVE+FOIL (SHARED): cap the CAGR fed in (%/yr) for BOTH lanes — a +46%/yr coin doesn't dwarf a +14%/yr one
                                 #   #16 sweep 2026-06-28: 20/30/40/50/1000 all edge ≈ -100337360 (flat) → cap inert on that run; 2026-07-02 re-test 30→50 on `backtest 12 universe` DROPPED growth edge +103.2→+87.7 → 30 is protective (parabolic names mean-revert), kept 30
  health_zero_cagr: -10.0        # [FOIL] long-leg CAGR (%/yr) where on-sale trend_health hits 0; health=1 at flat/rising

  # --- (B) total-return inputs + (E) endpoint-robust CAGR + (#8) geomean shape — EDGE-AFFECTING, validate before trusting ---
  # All flow to LIVE screen AND the backtest (train==serve), so a `backtest 12 universe` measures them
  # honestly. UNVALIDATED at flip time — run .claude/run_me.sh steps B/E and REVERT any that drops rho/edge
  # or pushes an OOS half negative. Reversible (set back to false).
  growth_geomean_fold: false     # (#8) REVERTED 2026-07-02: folding proximity+value into the geomean DROPPED edge +103.2->+79.2 (Δ-24) and flattened OOS-early +0.06->-0.00. The raw proximity multiply carries real selection weight; the geomean's 4th-root softens it too far. Golden rule reverts. Knob kept inert in code
  use_adjusted_close: false      # (B) REVERTED 2026-06-28: backtest 12 universe edge unchanged (raw
                                 #   -100337371.5 vs adj -100337372.0), OOS halves identical (+0.09/-0.05).
                                 #   No improvement → golden rule reverts. Flip true only if a re-run lifts edge.
  use_trend_cagr: false          # (E,#14) REVERTED 2026-06-28: slope CAGR edge -100337434.4 vs endpoint
                                 #   -100337336.3 (WORSE), OOS halves identical. Crypto's 1e9-scale peer-rel
                                 #   swamps this sample → knob inert + edge straddles 0 (noise). Keep endpoint.
  # fixed_cagr_years left at default 0: when use_trend_cagr is on it uses the whole-series slope (overrides
  # a pinned window), so #15 is redundant here. #16: sweep long_trend_cap (above) per run_me.sh, no flag.

  # (B) Value-trap dock: a name bleeding for YEARS (1Y AND 5Y both deep red) is not a dip — dock it.
  sustained_decline_pct: -40.0   # [FOIL] both 1Y and 5Y must be <= this to count as a multi-year bleed
  sustained_decline_penalty: 0.4 # [FOIL] score ×this when that holds (0..1; lower = harsher)
  # Harsher tier for a 7y+ deep bleed (e.g. LTC: 5Y -73% riding an ancient 10Y pump): if the 5Y is
  # past deep_decline_pct, use the steeper deep_decline_penalty instead of the -40% one.
  deep_decline_pct: -70.0        # [FOIL] 5Y <= this = a years-deep bleed, not a recoverable dip
  deep_decline_penalty: 0.15     # [FOIL] score ×this then (lower than sustained_decline_penalty)

  # (A) Hide ranked rows scoring <= this so the per-class tables stop padding to top_picks with
  # near-the-high names (score ~1-2 = not really "on sale"). Fewer rows when few names qualify.
  min_score: -20.0               # [FOIL] on-sale trim. (The LIVE growth equivalent is growth_min_score below.) 0 = show all

  # (C) Structural-cheap reward: how far below the ~200wk trend line (SMA = Simple Moving Average) the
  # price sits. Complements the OFF-HI drawdown (distance below the peak) with "cheap vs the long trend".
  cheap_weight: 0.07             # [FOIL] (#4) reward per % below the 200wk SMA — halved from 0.15: "structural cheap"
                                 #   is another dip term the backtest doesn't reward; demoted toward trend/quality.
  cheap_cap: 60.0                # [FOIL] cap the below-SMA % fed in

  # --- SCORE — SHARED / LIVE tilts (read by the growth lane `screen` prints) ---
  # (D) Dividend reward: DEMOTED 2026-07-15 (1.5 -> 0). BACKTEST-BLIND (no as-of divs in the price-only
  #   pool, so the walk-forward can't grade it), and its rationale — price-only CAGR misses reinvested
  #   dividends — was tested DIRECTLY by the use_adjusted_close total-return probe (adjclose CAGR), which
  #   came back NO-EDGE (reverted false 2026-06-28). Total-return/valuation is now carried by the VALIDATED
  #   live earnings_yield tilt (the fund fold), so this blind term is consolidated to 0 — same move as
  #   growth_value_weight:0 below. Near-high growers are low-yield, so the top-N barely shifts. Revert to
  #   1.5 if the eyeballed top-N is worse. Read by BOTH lanes.
  dividend_weight: 0.0           # LIVE: reward per % of trailing-1Y yield (0 = OFF; blind term folded onto validated earnings_yield)
  dividend_cap: 6.0              # LIVE: cap the yield % fed in (inert at weight 0)

  # (E) Valuation tilt: cheap on EARNINGS, not just recently dropped. value = ref_pe / P/E, clamped
  # [0.5,1.5] (P/E = Price-to-Earnings ratio). Needs a trailing P/E -> set FMP_API_KEY (Financial
  # Modeling Prep) in the ENV (never here); free tiers are rate-limited so it populates at `check`
  # scale, stays neutral (×1.0) across the big `screen`. Read by BOTH lanes.
  ref_pe: 20.0                   # LIVE: "fair" trailing P/E; P/E 10 -> ×1.5 (cheap), P/E 40 -> ×0.5 (rich)

  # (F) Profitability/QUALITY tilt: reward trailing ROE (Return On Equity — the canonical quality
  # factor; high-ROE firms out-compound long-run). Same FMP_API_KEY opt-in as ref_pe (populates at
  # `check` scale). BACKTEST-BLIND: ROE is point-in-time, so the price-only backtest can't validate it
  # — kept deliberately small so it tilts but never dominates the price signal. Read by BOTH lanes. 0 = off.
  quality_weight: 0.15           # LIVE: reward per % ROE (×cap = max bonus, ~6 at a 40% ROE)
  quality_cap: 40.0              # LIVE: cap the ROE % fed in (a buyback-levered 200% ROE doesn't dominate)

  # === GROWTH LANE — THIS is the ranking `screen` actually prints. =============================
  # Proven compounders the on-sale lane can't surface: a name AT/NEAR its own ~10y high, with a
  # strong proven long-term CAGR, still climbing. Gated hard (near-high + proven CAGR + positive 1Y +
  # not crashing) and P/E-tilted so it isn't just top-chasing. Every knob below is LIVE. ===========
  growth_min_range_pct: 80.0     # GATE: must sit in the top 20% of its own ~10y range. SETTLED 2026-07-02:
                                 #   A/B'd 70 vs 80 on `backtest 12 universe` — 80 WINS: edge +109.8 vs +103.2
                                 #   AND better on both OOS halves (+0.07/+0.09 vs +0.06/+0.08). 70 fell short of
                                 #   its own ">=117 both-OOS+" keep-rule; the gate-sweep "70 too tight" flag was a
                                 #   small-sample mirage. 80 is the validated base.
  growth_min_range_pct_crypto: 40.0 # GATE (crypto only): looser range floor (top 60% of its own range) so MORE coins
                                 #   surface — alts spend most of their life far below ATH yet still out-compound. The
                                 #   BTC-relative tilt below + the NUPL damp keep the wider crypto table honest. Stocks/ETFs
                                 #   keep the strict 80 gate above. Lower toward 0 for even more coins, raise toward 80 to tighten.
  growth_btc_outperf_weight: 0.3 # SCORE (crypto only): tilt a coin by its 1Y return vs BITCOIN's (the market base) — beats
                                 #   BTC -> boost, lags -> mild dock, bounded 0.5x..2x. BTC itself = 1.0x (the neutral anchor
                                 #   you read the others against). SCREEN/CHECK-only (backtest-blind, validated edge untouched). 0 = off.
  growth_min_cagr: 14.0          # GATE: long leg must compound >=14%/yr to count as a proven grower. The gate, not a
                                 #   weight, is what moves the signal (additive/multiplier knobs are inert; gates reshape the scored pool).
                                 #   12y MAX-monthly knee (the real 20y-hold horizon): 12->14 lifts GROWTH edge +91.1->+92.7 AND
                                 #   flips top-half peer-relative -5.2->+4.6 (the bought basket now BEATS its peers, not just loses less);
                                 #   16 overshoots (edge +86.3, top-half flat, pool thins 1987->1609). OOS both-positive. 5y proxy preferred
                                 #   12 (rho +0.15 sym) but the 12y horizon — what the 20y goal actually targets — peaks at 14.
  growth_min_cagr_crypto: 0.0    # GATE (crypto only): any positive long trend qualifies, so the crypto table shows ALL
                                 #   potential growers ranked vs Bitcoin (the base), not just >8%/yr names. Raise toward 8 to tighten.
  growth_trend_weight: 0.35      # SCORE: reward per %/yr CAGR (capped at long_trend_cap) — trimmed: raw long-CAGR mildly hurts growth selection (ablation Δ+); weight shifted to acceleration. Raising 0.35->0.55 cut edge +1.9->-0.6 (ablation-Δ predicts removal, not weight scaling)
  growth_accel_weight: 0.5       # SCORE: reward per pt the last year outpaced the long CAGR. accel INVERTS with horizon —
                                 #   the 5y proxy wanted it trimmed (mean-reverts: removing it +41.7 edge), but the 12y MAX-monthly
                                 #   horizon (the 20y-hold target) makes it a STRONG helper: removing it costs -55.5..-65.9 edge.
                                 #   Hill-climbed at 12y: 0.2->0.35->0.5 edge +65.8->+84.5->+91.1; 0.65 regresses (+87.0, OOS-early
                                 #   +0.02), so the knee is 0.5. Persistent compounding (last year still beating the long CAGR) PREDICTS
                                 #   over a decade where it merely chased a hot streak over 5y. ORIG 5y note below:
                                 #   rho LIKES accel (rank helper) but the 5y EDGE ablation showed it HURTS the 5y profit
                                 #   spread — recent 1Y-vs-CAGR pop is the noisiest, most mean-reverting growth signal at 5y
                                 #   (hot-streak chasing). 0.2 lifts wide 5y edge +43.7->+50.5 / 3y +24.3->+28.5.
  growth_accel_cap: 50.0         # SCORE: cap that 1Y-minus-CAGR acceleration term
  growth_smoothness_weight: 5.0  # (E) SCORE: reward per unit of trend_r2 (R² of the log-price trend fit, 0..1) — pays the
                                 #   straight-line compounder over the equal-CAGR rollercoaster. Reconstructed in backtest_quote,
                                 #   so validated END-TO-END (not backtest-blind): 2/5/10/20 sweep gave Δedge +5.4/+13.2/+10.3/-38.0
                                 #   same-batch, rho intact at +0.13 — clean hump, knee at 5. A 6M-momentum twin swept in the same
                                 #   run was null at every weight and was NOT wired. 0 = off.
  growth_underwater_weight: 0.3  # SCORE: additive penalty per year of the LONGEST below-prior-peak stretch
                                 #   (drawdown DURATION; the maxdd cap #26 only sees depth). Rebuilt in backtest_quote
                                 #   (daily cadence) so validated END-TO-END. Standalone probe (universe fund, 2026-07-19):
                                 #   n=8571 rho +0.26 edge +27.9 OOS +0.40|+0.14 both +. Candidate lane run at 0.3 same-batch:
                                 #   edge +25.5->+27.5, winsorized +15.7->+17.7, rho intact +0.12, OOS -0.03|+0.26 -> -0.02|+0.27,
                                 #   worst era -11.7->-4.8 (nothing degraded). 0 = off.
  growth_min_score: 5.0          # hide growth rows scoring <= this; 0 = show all top_picks
  growth_min_score_etf: 4.0      # ETF-only floor. ETF scores structurally cap ~5.6 (accel~0: a diversified basket doesn't accelerate; quality/liq/fund all 0) so the stock-calibrated 5.0 floor (fine at 26% of the ~19 stock ceiling) sits at ~89% of the ETF ceiling and shows only a sliver. 4.0 = surface the diversified broad-tech tier (Nasdaq-100 / World-IT / S&P-IT wrappers score 4.5-5.6; TER column lets you pick the cheapest wrapper) while still trimming the young single-sector padding (Europe-Financials 3.2, 6y). DISPLAY-only -> validated edge untouched. Does NOT surface broad S&P500 core (VUAA/SPYL young=no 5y leg, AUM5 ~8% CAGR=market-beta<growth_min_cagr) — history/thesis wall, not this floor
  growth_value_weight: 0.0       # (#1) authority of the BACKTEST-BLIND P/E multiplier in the growth lane: 1.0 = full x0.5..1.5 swing (default), 0.0 = OFF. Set 0 — the walk-forward never saw pe_ratio (None in backtest), so this +-50% reorder was pure guess (silently halved high-P/E compounders like AAPL/LLY/MPWR). Revert to 1.0 if the eyeballed top-N is worse; re-enable only once the validated additive earnings_yield term carries valuation
  # (#2) VALUATION TILT — ENABLED 2026-07-12 after re-validation. History: the 2026-07-02 wide run
  #   (8175 cutoffs) had the earnings_yield lane LOSING to price-only (+140.4 vs +151.2) and the tilt
  #   shipped OFF. Three later independent-pool wide runs (2× full S&P 500 on 8320/8380 cutoffs, then
  #   the whole live screen universe) all reversed that: the earnings_yield lane beats the price-only
  #   baseline with BOTH out-of-sample halves positive every time (+156.9 vs +120.5, +156.4 vs +115.4,
  #   +136.9 vs +124.1), and the swing traced to baseline variance, not the factor (its lane edge held
  #   +137..+157 in all four runs). Ship test on the serving pool, tilt on-vs-off same batch:
  #   GROWTH edge +170.3 vs +156.9, rho +0.19 vs +0.15, OOS +0.14|+0.20 vs +0.14|+0.12, winsorized
  #   +139.2 vs +126.8, held top-10 book +15.0 vs +14.7 (excess +7.0, OOS +5.6/+8.4), worst drawdown
  #   -7.8 unchanged. Weight sweep knee = 1.0 (monotone up to 1, falls at 2). Every OTHER factor
  #   (margins, rev/eps growth, buyback, ROE, insider, composite) still fails the both-OOS+ keep-rule —
  #   the sweep's nominal per-run "WINNER" line bounces between factors (searched-weight overfit);
  #   earnings_yield is the only one positive on every view. Revert rule: revert (weight -> 0) only
  #   on TILT-SPECIFIC degradation in a future wide run: the growth-lane ablation shows removing this
  #   weight HELPS (Δ edge >= 0), or standalone earnings_yield loses an OOS half. A lane OOS half that
  #   price-only ALSO loses is regime weather, not the tilt (2026-07-17 early audit: lane early half
  #   -0.03 with price-only -0.04, ablation removal cost -8.6 edge, standalone ey +0.20|+0.23 -> kept;
  #   receipts .claude/bt_audit_2026-07-17.txt).
  fund_source: "sec"         # SEC EDGAR XBRL: free, keyless, uncapped — the source the tilt was validated on
                             #   (train-serve: FMP's 250/day cap can't even cover one wide run). US filers only;
                             #   non-covered names get fund_factor None -> tilt neutral, price terms decide.
  growth_fund_factor: "earnings_yield"  # as-of TTM EPS / native close — same definition in backtest and live (Item 19)
  growth_fund_weight: 1.0    # ON — validated knee (see block above); score pts per pt of capped earnings_yield
  # (1) Overextension brake: how far ABOVE its own 200wk SMA a growth name has run. The P/E tilt
  # can't brake crypto/ETFs (no earnings); this can — it's price-only. Taper the score toward the
  # floor as price stretches above trend, killing blow-off-top chasing.
  growth_overext_cap: 100.0      # % above the 200wk SMA where the brake maxes out. Biting harder (100->60) cut edge +1.9->-9.5: over-penalizes good compounders that keep running above trend. Keep 100
  growth_max_above_ma: 150.0     # (#24) HARD gate above the brake: reject equities >150% above the 200wk SMA (crypto exempt).
                                 #   Past the brake cap the damp saturates, so a +486% blow-off (WDC 2026-07) scored like a +100%
                                 #   name; the brake can floor it but never remove it. Same-batch triple 2026-07-03:
                                 #   off +106.6 (wins +84.1, OOS +0.11|+0.06) / 100 +106.9 (edge-flat) / 150 +115.9
                                 #   (wins +88.1, OOS +0.13|+0.08) — and the names the 150 gate excludes average -125.1 pts
                                 #   forward vs peers (n=267). NOT the same cohort as the rejected R² gate (round 4: low-R²
                                 #   names near a high BEAT the field +61/+64): an ugly PAST is fine, an extreme PRESENT
                                 #   stretch is a measured loser. 150 > brake cap on purpose — the 100..150 band stays in the
                                 #   table (marked `!`), only the blow-off tail is cut. 0 = off.
  growth_maxdd_cap: 84.0         # (#26) reject equities whose worst-EVER peak-to-trough loss exceeds 83% (magnitude; crypto
                                 #   exempt — BTC itself is -83%). A >83% wipeout survivor is a lottery ticket, not a compounder.
                                 #   Same-batch pair 2026-07-03: off +119.5 (wins +91.5, OOS +0.13|+0.08) / on +128.4 (wins
                                 #   +98.3, OOS +0.14|+0.11 — BOTH halves up); the n=171 names it excludes average -16.5 pts
                                 #   fwd vs peers. Second gate-beats-damp case (after #24): Calmar as a continuous damp was
                                 #   measured harmful, yet the hard tail cut pays — damp-verdicts don't transfer to gates.
                                 #   0 = off.
  growth_maxdd_cap_crypto: 84.0  # (#26) crypto's own maxdd bar = "reject coins that wiped out WORSE than Bitcoin" (BTC -83%,
                                 #   so 84 keeps BTC and cuts the deeper-wipeout alts: ZEC -98, TRX -96, XMR -93, XRP -96,
                                 #   SOL -96...). Coins crash >90% every cycle, hence a separate looser bar than the equity 83.
                                 #   BACKTEST-BLIND in practice (almost no coin has the full 12y window, so the pool carries
                                 #   ~none) -> judgment gate like the turnover floor, validated by live-screen eyeball.
                                 #   If a future bear drags BTC below -84, raise this just above BTC's new mark. 0 = off.
  growth_max_vol_crypto: 3.0     # (#36) crypto-only VOL cap = "reject coins swinging WILDER than Bitcoin day-to-day" — same
                                 #   philosophy as the maxdd bar, applied to daily-return stdev (the VOL column) instead of the
                                 #   worst-ever tail. BTC ~2.4%/day, so 3.0 keeps the base with headroom and cuts the wild alts
                                 #   (OKB 3.4, LEO 3.1). Crypto absent from the backtest pool -> edge-blind by construction;
                                 #   judgment gate validated by live-screen eyeball. 0 = off.
  growth_require_lifetime_uptrend: true # (#25) reject equities whose WHOLE-LIFE log-trend CAGR is <= 0: moon-crash-partial-recovery
                                 #   names whose 10Y leg looks great but never reclaimed their long-run trend (the ranked CAGR uses
                                 #   the longest 20Y/10Y/5Y leg, so it can't see this). Same-batch pair 2026-07-03: off +115.7
                                 #   (wins +87.9) / on +119.4 (wins +91.5), OOS +0.13|+0.08 both + either way. CAVEAT: barely binds
                                 #   in the backtest (n=10 excluded, mean fwd +30.2 -> sweep prints TOO TIGHT) because the 12y pool
                                 #   is survivors-only — the dot-com-wreck cohort this targets is mostly delisted and never enters.
                                 #   Shipped on live-table semantics + measured-harmless; a strongly POSITIVE sweep row on a future
                                 #   maintenance run is the signal to re-question it. Crypto exempt. false = off.
  growth_min_age_years: 0.0      # (#33) hard age floor on quote.age_years (whole-life listing age, the YRS column): reject a name
                                 #   younger than this many years. Shipped OFF (0.0) to DETECT EARLY WINNERS: a young strong grower
                                 #   (e.g. a fresh S&P 500 ETF, +21%/yr) still surfaces in the ranking, DOCKED by trust_factor (which
                                 #   already down-weights short-history names) instead of hard-cut — early-but-unproven, ranked below the
                                 #   proven compounders, not hidden. BACKTEST-BLIND either way: age_years is None in the backtest pool, so
                                 #   the gate never touches the validated edge; it only shapes the LIVE screen. Set >0 (e.g. 3) for a hard
                                 #   floor that trims the freshest listings entirely; pins always bypass (shown with a gate-review reason).
  growth_min_aum_etf: 100000000  # (AUM) ETF-only hard fund-size floor in EUR (quote.aum_eur, BF etp_search AUM, EUR-approximate —
                                 #   fund currency is EUR/USD mixed; ±10% FX is immaterial vs an order-of-magnitude line): reject a
                                 #   fund smaller than €100M, the industry viability line under which issuers liquidate/merge — the
                                 #   one way a 20y hold ends WITHOUT the strategy failing (a forced taxable exit + re-buy). Measured
                                 #   2026-07-05: median pond AUM €82M, 1791/3391 funds (53%) under this line. None-AUM names are NOT
                                 #   gated (missing data is not a small fund; BF only covers its venue — same stance as #33 age).
                                 #   BACKTEST-BLIND: aum_eur is None in the backtest pool -> gate inert there, validated edge
                                 #   untouched; live-only. 0 = off. Opt-in `aum` column (widths.columns) shows the number per row.
  growth_ter_drag: true          # (#34) ETF cost drag: dock the growth score by the ACTUAL 20-year wealth multiple the expense
                                 #   ratio eats, (1 - TER)^20. The TER is the one cost certain to compound against a decades hold, so
                                 #   two near-identical index ETFs (e.g. iShares vs Amundi Nasdaq-100) rank by NET return instead of
                                 #   momentum noise, and a 0.65% thematic ETF loses ground to a 0.10% broad one it only led on a
                                 #   reverting recent year. ETF-ONLY (expense_ratio is None for stocks/crypto -> x1.0). BACKTEST-BLIND:
                                 #   expense_ratio is None in the backtest pool -> x1.0 there, so the validated edge is byte-identical;
                                 #   this shapes only the LIVE ETF lane. false = off. (Magnitude: 0.10% TER -> x0.980, 0.65% -> x0.878.)
  growth_overext_floor: 0.05     # growth-score multiplier at full stretch. Tightened 0.2->0.15->0.05, each step a harder blow-off-top brake:
                                 #   buying right after a parabola = poor long-hold entry. The walk-forward sweep ranks 0.05 best: wide
                                 #   5y rho +0.26->+0.28 AND OOS-late rho +0.09->+0.14 (durability up 55%) with edge flat (+108.5->+106.8).
                                 #   The old "0.1 docks NVDA out" worry was regime-bound — at 0.05 today NVDA still scores 6.7 > min_score
                                 #   5 (it's -10.6% off-hi, not parabolic) and the displayed order is unchanged. 1.0 = brake off.
  growth_turnover_weight: 0.0    # (L) ZEROED 2026-07-02 after a live A/B (screen at 0.5 vs 0.0): the ln(turnover/€1B) tilt is
                                 #   BACKTEST-BLIND (backtest quotes carry no turnover) and the A/B showed it does NOT do its
                                 #   claimed job — it's reward-only, so illiquid junk (ROX.DE €11K/day) sat in the ETF table
                                 #   WITH the tilt on; all it did was float mega-caps (AAPL/AMZN/TSLA) a few rows and swap
                                 #   AMD in over FTNT at the tail on turnover alone. A blind term that reorders with no
                                 #   validated edge gets neutralized (same rule as growth_value_weight). Thin listings are a
                                 #   GATE problem: use min_avg_turnover_eur (e.g. 1000000) to drop them outright. 0.5 = old tilt
  growth_overext_cap_crypto: 100.0 # (#4) crypto's own brake cap; =equity (no change). Raise (e.g. 200) to brake crypto later — unvalidated (crypto windows too sparse to isolate)

  # (4) Crypto market-greed damp from Bitcoin NUPL (already fetched for the screen footer). High NUPL
  # = whole-market euphoria/top -> shrink ALL crypto scores (thins the crypto tables in a frothy top,
  # fattens them after a flush). Applies to both lanes, crypto rows only.
  nupl_euphoria: 0.5             # NUPL above this starts damping crypto (~0.5 = greed/"belief" zone)
  nupl_damp_floor: 0.5           # crypto-score multiplier at NUPL 1.0 (peak euphoria); 1.0 = damp off
  nupl_capitulation: 0.25        # NUPL below this starts BOOSTING crypto (~0.25 = fear/accumulation); 0 = boost off
  nupl_boost_ceiling: 1.3        # crypto-score multiplier at NUPL 0 (deep capitulation); 1.0 = boost off. BACKTEST-BLIND judgment lever — keep mild

  # RISK-ADJUSTED-RETURN tilts (B/C) — Sharpe ratio (return ÷ volatility) and Calmar ratio (return ÷
  # worst peak-to-trough drawdown), from the SAME closes already fetched, ZERO extra network cost.
  # Reward a calm, shallow-drawdown compounder over a knife-y one with the same headline CAGR.
  # (The old R²-smoothness "consistency" damp was deleted: it read pure edge-harm with no rho gain —
  # disabling it had nearly DOUBLED wide 5y edge +50.5->+95.6. Past path-smoothness doesn't predict return.)
  sharpe_weight: 0.05            # (B) GROWTH lane: reward per unit CAGR/volatility. History: 0.3->0.15 halving was peak edge
                                 #   PRE-smoothness. Re-swept 2026-07-04 AFTER growth_smoothness_weight shipped: trend_r2 carries
                                 #   the same calm-compounder signal, so Sharpe's marginal value shrank — 0.05/0/0.10 plateau at
                                 #   edge +148.0/+147.0/+145.8 vs +137.2 at 0.15 (same batch, rho +0.13 flat). 0.05 = measured max;
                                 #   kept NON-zero deliberately: the ETF lane (absent from backtest) leans on the Sharpe leg for its
                                 #   risk reward and the sharpe_cap_etf fix, so zeroing would be an unmeasured live ETF regression. 0 = off
  onsale_sharpe_weight: 0.0      # [FOIL] (B) ON-SALE lane's own Sharpe weight, split from growth because the shared knob conflicted:
                                 #   ablation showed growth wants 0.15 but on-sale wants 0 — zeroing it lifts the on-sale 12y edge
                                 #   +39.2->+62.9 (Δ+23.7) while growth keeps 0.15. 0 = off (the swept on-sale optimum)
  sharpe_cap: 15.0               # (B) cap that CAGR/volatility ratio
  sharpe_cap_etf: 9.0            # (#37) ETF-only Sharpe cap: cross-listed lines of the SAME fund print different daily
                                 #   stdev (NASD.L 1.8%/day vs CSNDX.SW 1.1% for identical Nasdaq-100 holdings — thin-line
                                 #   prints + FX conversion), so ETF CAGR/vol above ~9 measures listing-line noise, not
                                 #   fund risk. Uncapped, that noise (0.15×Δsharpe ≈ 0.7 score) outvotes the real TER
                                 #   difference (2.2% over 20y) and ranks the COSTLIER identical wrapper higher. 9.0 ≈ the
                                 #   noise floor observed across same-index wrapper trios. Stocks keep sharpe_cap; the
                                 #   backtest pool holds stock constituents only -> validated edge byte-identical. 0 = off
  calmar_weight: 0.0             # (C) ZEROED. Calmar (CAGR/max-drawdown) is harmful at the 12y horizon: 1.0->0 lifts GROWTH
                                 #   edge +92.7->+98.0, rho +0.06->+0.07, top-half +4.6->+7.3 — all three improve. Over a 20y hold the
                                 #   deepest-drawdown names are often the biggest compounders; penalizing path-pain deselects them.
                                 #   sharpe (0.15) stays — removing it COSTS edge (Δ-3.1), so volatility-awareness still helps. 0 = off
  calmar_cap: 2.0                # (C) cap that CAGR/max-drawdown ratio

  prefer_eur: true               # dedup currency twins (BTC-EUR/BTC-USD): keep EUR leg if true, else USD

# --- live-universe fetch breadth + pacing (so the backtest gate scans the same wide pool `screen` does) ---
# How many symbols PER CLASS (crypto + stocks/ETFs) `screen` pulls from the live sources
# (coingecko_markets + sp500_csv URLs below). Bigger = more to scan = slower (one history
# fetch per ticker, in parallel) + more rate-limit risk. `screen TICKER...` overrides everything.
universe_size: 1234000

# Max fetches in flight = CPU cores × this multiplier. In-flight memory holds the large 10y + monthly
# chart payloads, so this is the MEMORY/stability knob, not the speed knob (the pacer below sets speed).
# 8 cores × 8 = 64 was stable across full 3847-name screens; conc=128 (mult 16) got SIGKILLed mid-run.
# Keep cores×mult ≈ 64: on a 16-core box use mult 4, on 4-core use 16. 0 is treated as 1.
fetch_concurrency_multiplier: 8

# Global outbound-request pacer (requests/second) — THE speed knob. Spaces request LAUNCHES so the
# fan-out can't burst-429 (concurrency bounds in-flight count but not the launch burst). Yahoo's limit
# is undocumented. Measured at full universe (3847 names, ~3 Yahoo calls/name): rps 60 = 0 valid names
# lost in 4m27s; rps 40 = 0 lost in 6m37s. 60 nearly saturates conc 64, so higher rps needs more
# concurrency (which risks the memory kill above) for little gain. Lower if you see real names drop,
# 0 disables pacing (a 64-wide burst then drops valid names — e.g. NVDA — so don't).
fetch_requests_per_second: 60.0

# Quote the live-universe crypto in EUR (BTC-EUR) if true, else USD (BTC-USD). Mirrors
# buy_heuristic.prefer_eur but for what `screen` fetches. US stocks/ETFs have no EUR listing.
universe_prefer_eur: true

# `screen` SECTOR FILTER — which type of companies/ETFs to fetch. Case-insensitive substring
# keywords matched against a stock's GICS sector AND an ETF's fund name. Empty list (or omitted) =
# fetch ALL sectors (the default). Stocks are filtered BEFORE fetch (by their GICS sector, so other
# sectors are never even pulled); ETFs carry no GICS, so they're filtered by fund name. Crypto is
# never sector-filtered. `screen TICKER...` (explicit tickers) ignores this. Examples:
#   tech only:  [Technology, Communication, Semiconductor]   ("Technology" catches GICS "Information Technology")
#   healthcare: [Health]                                     energy: [Energy]   financials: [Financ]
#   ALL sectors: []   (empty list — or comment out the `sectors:` line below entirely)
sectors: []

# ntfy.sh topic for `alert`. Anyone who knows it can read your alerts (= your watchlist), so treat it
# like a password: this COMMITTED base carries a DUMMY only. Put a real, long, random private topic in
# the gitignored config/settings.yaml overlay (NEVER here — this file is committed + pushed).
ntfy_topic: "ci-smoke-tests-unused"

# Data-source URLs. Templates use {placeholder} tokens filled at fetch time: {ticker} {range} {n}
# {topic} {key}. Swap a source by editing the URL here, no rebuild of logic needed (only the response
# shape must match what the parser expects). The keys with a built-in code default (constituents_csv,
# euronext_lisbon, fundamentals*) are listed here for documentation — omit
# any and it falls back to the SAME URL, so the backtest gate already fetches them either way.
urls:
  yahoo_chart: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range={range}&interval=1d&events=div,split"
  # hourly bars over ~5 days -> screen 1h/6h/12h columns (counted as 1/6/12 bars back, not wall-clock,
  # so stocks fill too despite overnight gaps; 5d ensures >=13 bars even for a 6.5h trading day).
  yahoo_intraday: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=5d&interval=60m"
  yahoo_search: "https://query1.finance.yahoo.com/v1/finance/search?q={ticker}&newsCount=3&quotesCount=0"
  yahoo_quote: "https://finance.yahoo.com/quote/{ticker}"
  euribor: "https://www.euribor-rates.eu/en/current-euribor-rates/2/euribor-rate-3-months/"
  us_cpi: "https://api.bls.gov/publicAPI/v1/timeseries/data/"  # BLS CPI-U index (monthly); seriesid + year window POSTed by fetch (path-GET ignores years). v1 = no key, 10y/call
  pt_cpi: "https://bpstat.bportugal.pt/data/v1/domains/12/datasets/7f13efcd65fc6bd0c5adb0e8d29d9b44/?lang=EN&series_ids=5721550"
  eu_hicp: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr?format=JSON&lang=EN&coicop=CP00&geo=EU27_2020"
  # {n} = top-N crypto by market cap; `screen` maps each .symbol to SYMBOL-USD (Yahoo form)
  coingecko_markets: "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page={n}&page=1"
  # S&P 500 constituents CSV (first column = Symbol); `screen` maps '.'->'-' for Yahoo
  sp500_csv: "https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv"
  # (Item 18/32) extra equity ponds APPENDED to the S&P 500 set, to widen the grower pool the proven
  # ranking draws from. Each entry is a CSV (col0=Symbol; col2=GICS Sector, or 2-column Symbol,Name ->
  # sector "other") OR a Wikipedia "List of S&P N companies" page (host picks the parser). A dead URL
  # or unrecognizable page just drops that pond — never crashes the screen.
  # Nasdaq-100 (yfiua/index-constituents, auto-updated monthly): ~13 large growers not (yet) in the
  # S&P 500 (the PDD/ARM profile — exactly what the lane ranks). VALIDATED 2026-07-03, same-batch 12y:
  # baseline edge +126.7 (OOS +0.14|+0.10) -> with n100 +126.8 (OOS identical) — free supply, no dilution.
  # S&P MidCap 400 (Wikipedia page) MEASURED-REJECTED same batch: +400 mid-caps CUT the edge to +85.0
  # and halved rho (+0.13 -> +0.07) — the persistence signal the lane rides is weaker in mid-caps
  # (they mean-revert more). Do NOT re-add without a new same-batch run that clears the bar.
  # FTSE 100 + DAX (yfiua CSVs, the free STOXX-600 proxy) MEASURED-REJECTED 2026-07-04, same-batch
  # 12y: baseline edge +127.6 (rho +0.13, OOS +0.14|+0.10) -> with 140 EU large-caps +117.0
  # (rho +0.11, OOS +0.11|+0.09, winsorized 97.7 -> 89.1) — every dial moved down, same direction
  # as the MidCap rejection: the US-momentum persistence the lane rides is weaker in EU large-caps.
  # Do NOT re-add without a new same-batch run that clears the bar.
  constituents_csv:
    - "https://yfiua.github.io/index-constituents/constituents-nasdaq100.csv"
  # Euronext Lisbon equities (POST, DataTables JSON; mics=XLIS) -> Portugal `.LS` stock universe
  euronext_lisbon: "https://live.euronext.com/en/pd_es/data/stocks?mics=XLIS"
  # latest Bitcoin NUPL (net unrealized profit/loss), free on-chain sentiment gauge; `screen` prints it after the crypto table
  nupl: "https://bitcoin-data.com/v1/nupl/last"
  # (E) trailing-P/E source for the valuation tilt. {ticker} + {key} (key from FMP_API_KEY env, NOT
  # here). Equities only, and only when the env key is set — free tiers are rate-limited, so use it
  # for `check` (~55 tickers), not the ~750-ticker `screen` (where P/E stays None -> neutral tilt).
  fundamentals: "https://financialmodelingprep.com/stable/quote?symbol={ticker}&apikey={key}"
  # (F) ROE/quality source for the profitability tilt — FMP stable ratios-ttm (carries returnOnEquityTTM).
  # Same FMP_API_KEY opt-in / `check`-scale profile as `fundamentals` above. (v3 legacy died 2025-08-31.)
  fundamentals_quality: "https://financialmodelingprep.com/stable/ratios-ttm?symbol={ticker}&apikey={key}"
  ntfy: "https://ntfy.sh/{topic}"
