  # (D/PT) Portuguese dividend tax, as two after-tax KEEP fractions. Art. 40.º-A CIRS englobates only
  #   50% of a dividend from an EU-resident company meeting the Parent-Subsidiary Directive conditions,
  #   IF you opt for englobamento on the IRS return; a US/other payer is taxed in full. No tax law is
  #   encoded in the code — THESE TWO NUMBERS ARE THE WHOLE MODEL, and they are yours to compute from
  #   your own bracket, your englobamento choice, and the source withholding you actually eat after any
  #   reclaim. The values below are a worked example at a ~43.5% marginal rate, NOT advice: recompute
  #   them. 1.0/1.0 = tax off (the code default), lane byte-identical to the pre-tax version.
  #   ORDER MATTERS: the cap is applied to the GROSS yield, then the keep-rate scales it. Capping the
  #   scaled yield instead would saturate EU and non-EU onto the same value for every above-cap yielder,
  #   erasing the distinction exactly where yields are highest.
  #   EU set = the 12 members as core::suffix_country spells them (UK/Switzerland/Norway are NOT EU).
  #   Venue is the proxy for the payer: an Irish-domiciled S&P 500 name (ACN, ETN, MDT) reads "USA" and
  #   is under-credited — conservative, never the reverse. Funds take tax_keep_other at any domicile: an
  #   OICVM distribution is not a PSD company's *lucro*, so no exclusion.
  #   CEILING: one EU rate blends source withholding from 12.8% (France) to 35% (Finland). That 22-pt
  #   within-EU spread is ~3× the EU-vs-US gap this models — a real approximation, accepted knowingly.
  #   Upgrade path if it bites: a per-market map keyed on Quote.market. THAT PATH IS NOW PRICED AND IT DOES
  #   NOT PAY (#58): the coarse EU-vs-other split such a map would refine measures Δ+0.0 edge, so a finer cut
  #   of the same term cannot buy more than nothing. DO NOT BUILD IT FOR EDGE. The one justification left
  #   standing is truthfulness — a per-market map makes the after-tax yield a HUMAN reads closer to what
  #   they actually keep — and that argument has to be made on its own terms, not on the backtest's.
  tax_keep_eu: 0.76              # LIVE: fraction kept from an EU company's dividend (englobamento, 50% excluded)
  tax_keep_other: 0.72           # LIVE: fraction kept from every other payer, and from any fund

  # (E) Valuation tilt: cheap on EARNINGS, not just recently dropped. value = ref_pe / P/E, clamped
  # [0.5,1.5] (P/E = Price-to-Earnings ratio). Needs a trailing P/E -> set FMP_API_KEY (Financial
  # Modeling Prep) in the ENV (never here); free tiers are rate-limited so it populates at `check`
  # scale, stays neutral (×1.0) across the big `screen`. Read by BOTH lanes.
  ref_pe: 20.0                   # LIVE: "fair" trailing P/E; P/E 10 -> ×1.5 (cheap), P/E 40 -> ×0.5 (rich)

  # (F) Profitability/QUALITY tilt: reward trailing return-on-capital — ROE (Return On Equity, the
  # canonical quality factor; high-ROE firms out-compound long-run), or ROA where equity is negative
  # (`core::quality_return`). Same FMP_API_KEY opt-in as ref_pe for the LIVE screen (populates at
  # `check` scale). Read by BOTH lanes. 0 = off.
  # NO LONGER BACKTEST-BLIND, and the first measurement is a large one. This term was shipped for
  # rounds against a backtest that could not see it: `backtest_quote` builds from `Quote::stub` (roe
  # None) and fills only closes-derived fields, so `quality_reward` was 0.15 × 0 for EVERY sample in
  # EVERY lane — the ablation row read 0.0 by CONSTRUCTION, not by measurement. `4975f23` filled
  # `Quote.roe` from the as-of fundamentals in the backtest loop (same look-ahead guard as the three
  # yields), and this is its first wide run — `backtest universe fund 12`, 11690 cutoffs, 8458 with
  # as-of fundamentals:
  #     BUY lane    (full rho +0.04, edge +111.6): zeroing it -> rho -0.06 Δ-0.10, edge +62.9 Δ-48.7
  #     GROWTH lane (full rho +0.18, edge +181.6): zeroing it -> rho +0.18 Δ-0.00, edge +169.0 Δ-12.6
  #   The buy-lane Δ is the biggest RHO hit of any knob in that lane (bigger than cheap_weight, whose
  #   -50.4 edge comes with Δrho 0.00) — zeroing quality flips the lane's rank correlation NEGATIVE.
  #   Keep at 0.15. It is no longer a "small blind tilt"; it is load-bearing in the on-sale lane.
  # STANDALONE, though, it does NOT rank on its own: `quality(roe/roa) n=1826 rho -0.01 edge -115.1
  #   OOS +0.04 | -0.06`, and raw ROE alone is worse (rho -0.03, edge -123.2). It works as a MODIFIER
  #   on a price-led score, not as a selector. Held-book view agrees it is not junk (top-10 held 12y:
  #   +15.9%/yr, excess +4.3, win 100%, worst +2.5, OOS +4.7/+4.0 n=266) — the standalone edge is
  #   negative because ranking PURELY on ROE buys expensive quality.
  # NEITHER PIN GUARDS THIS TERM — do not read a green `cargo test` as a regression net for it:
  #   `walk_forward_edge_pin` builds samples with `core::backtest_quote` and `fund: None`, never
  #   routing through the run() loop's `quote.roe = ...`, so roe is None and the term is 0 for every
  #   pinned sample. `scoring_regression_pin` DOES set `stock.roe = Some(40.0)` by hand, so it pins
  #   `quality_reward`'s arithmetic — but never `core::quality_return`, which is where the ROE/ROA
  #   choice is actually made. That is why both pins sat still through `4975f23`. Expected, not lucky.
  quality_weight: 0.15           # LIVE + MEASURED: reward per % return-on-capital (×cap = max bonus, ~6 at 40%)
  # (#62) GRADED AT ZERO AND KEPT — and the interesting part is WHY the grade is thin and always will be.
  #   This term reads Δ+0.0 in every price-only run: `backtest_quote` fills no fundamentals, so the
  #   ablation row is measuring nothing and three of the four wide horizons are structurally blind to it.
  #   The ONLY run that can see it is `12 universe fund`, so that is the run, quality_weight 0.15 -> 0.0,
  #   n=655 growth windows in both (admission unmoved):
  #     dial        shipped 0.15                  arm 0.00
  #     rho         +0.15                         +0.14
  #     edge        +161.9                        +154.6      (Δ-7.3, vs that run's 37.3 null floor)
  #     90% band    [+103.6 … +234.8]             [+103.2 … +224.9]
  #     OOS         +0.08 | +0.15                 +0.08 | +0.15   (identical)
  #     rank-1      +6.3|+7.2, win 76% of 54      +6.2|+7.2, win 76% of 54
  #     h2h         17/29 (59%)                   17/29 (59%)     (identical)
  #   Reproduces the ablation row's -7.3 to the decimal, 5x under the floor, with the rank-1 MEDIAN, the
  #   win rate and the h2h all identical. On its own that reads like the smoothness result — free to
  #   remove — and the on-sale half agrees even harder: in the pre-(#61) fund baseline, ablating quality
  #   LIFTS the on-sale lane +28.1 (edge -93.1 -> -65.0), i.e. it was ranking that lane backwards too.
