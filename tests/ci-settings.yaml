  #     win of windows     97% of 39        BOTH    82% of 62        BOTH
  #     worst window       -0.5             BOTH    -9.2             BOTH
  #     OOS early/late     +5.0/+7.9        BOTH    +7.6/+8.7        BOTH
  #     rank-1 h2h guard   76% (16/21)      BOTH    63% (24/38)      BOTH
  #   Not "inside the noise band" — IDENTICAL, field for field, at both SHIP RULE v2 primary horizons.
  #   The term does not change which names reach the basket the screen footer quotes.
  #   IT IS LIVE, NOT INERT — the distinction that had to be settled before this could be written, since
  #   an unplumbed term and a useless one both print "no change". The `dividend_weight` CURVE separates
  #   (20y growth-lane edge +451.4 at 0.0 vs +459.5 at 0.5), so scores genuinely move; the movement is
  #   just all in the TAIL, below the top-3 anyone buys. Before the plumbing that curve was necessarily
  #   FLAT — no divs meant a 0% yield for every name, so every weight scored identically. It no longer is.
  #   And the tail movement FLIPS SIGN across horizons: the `growth_dividend` ablation (term OFF) reads
