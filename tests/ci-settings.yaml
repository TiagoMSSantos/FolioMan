  #   truthfulness one, not the edge one.
  onsale_dividend_weight: 0.0    # [FOIL] (#61) ON-SALE lane's own yield weight. ZEROED, and this is the
                                 #   largest single measured improvement in the file. Split from the growth
                                 #   lane for the same reason `onsale_sharpe_weight` was split from
                                 #   `sharpe_weight` — one shared knob serving two lanes that want opposite
                                 #   values — and the same fix, at ~6x the size (that one bought +23.7).
                                 #   MEASURED 2026-08-10, wide `12 universe` on 4997 tickers, n=4623 on-sale
                                 #   windows, admission byte-identical (cutoffs 11673 both runs):
                                 #     dial          shipped 0.5              this arm 0.0
                                 #     rho           -0.14                    +0.03
                                 #     edge          -65.0                    +85.7
