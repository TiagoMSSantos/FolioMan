                                 #   three settings (5, 2, 1) and no gentler middle. (#49) added the 1Y rung;
                                 #   it is near-inert, see growth_trust_young below.
                                 #   THE 2.0 ARM WAS GRADED AND LOSES EVERY CLAUSE OF THE SHIP RULE. Six-run
                                 #   stress grid 2026-08-03, `backtest {20,12,8} universe stress`, baseline vs arm
                                 #   differing by THIS FIELD ALONE (verified: the drift warning names
                                 #   `growth_min_leg_years 5.0->2.0` and nothing else):
                                 #     horizon   lane edge        rho        rank-1 mean|med    h2h     top-10
                                 #     20y-s   +411.0 -> +244.2  +.14->+.11  +5.9|+6.0 -> +4.5|+4.0  67->39%  +5.8->+6.3
                                 #     12y-s   +121.9 -> +104.8  +.13->+.10  +5.5|+6.5 -> +5.4|+6.1  61->47%  +6.2->+6.7
                                 #      8y-s    +48.1 ->  +45.5  +.19->+.15  +6.9|+7.8 -> +7.4|+7.1  61->50%  +6.7->+7.4
                                 #   Rule was (max_1m_drop_pct's bar, 2026-08-02): rank-1 median up or held at the
                                 #   20y king, h2h >=50% at all three, king lane edge not down. Actual: king median
                                 #   -2.0, h2h BELOW 50 at two of three, king edge -41%. Three for three against.
                                 #   THE TOP-10 COLUMN IS THE TRAP: it RISES at every horizon, and that is the
                                 #   dilution signature, not a win. h2h says why — "#1 beats the 11-20 book" falls
                                 #   67->39% at the king, i.e. under the arm THE TOP OF THE LIST IS WORSE THAN ITS
                                 #   MIDDLE. A wider book of young momentum names lifts the average while destroying
                                 #   the ranking that the tool exists to produce. Grade rank-1 and h2h, not top-10.
                                 #   NOT a sample-size problem — the arm DEEPENS the pool (growth windows 517->686,
                                 #   +33%) and rho still falls at all three horizons. More data, worse selection.
                                 #   The baseline sweep row prices the same cohort and is MONOTONE IN HORIZON:
                                 #     20y-s n=169 mean -811.0 | med -793.9      <- the horizon this tool targets
                                 #     12y-s n=251 mean  -41.3 | med -184.7
                                 #      8y-s n=300 mean  +14.4 | med  -58.7
                                 #   The 2Y rung's damage GROWS with the holding period. An 8y reader could mistake
                                 #   it for noise; at the 20-year hold this tool is built for it is catastrophic.
                                 #   LIVE A/B same day (one universe fetch, 4707-4749 names): the arm works exactly
                                 #   as designed and that is the problem — `history` sole-blocked 11/1922/19 ->
                                 #   4/1185/7 (756 names gain a leg), cleared 9->22, ETF table 5->16 rows, and
                                 #   rank 1 became a 2-3y listing in ALL THREE classes (GEV 2.3y score 26.2 over
                                 #   NVDA 27.5y 10.8; HNSC.MI 3.4y 29.9 over IITU.L 10.7y 8.1; WBT-USD 3.9y).
                                 #   Rank stability 89% -> 33%. `trust_factor` HAD already halved them — 29.9 is the
                                 #   post-halving number — and their ABV-MA reads 0% with MAXDD -20..-38%, because
                                 #   the risk brakes cannot see a drawdown that has not happened yet. A short record
                                 #   collects score for the ABSENCE OF MEASURED BAD NEWS. That is the mechanism.
                                 #   Do not re-propose without a NEW damp aimed at that mechanism (a record-length
                                 #   term in the score itself, not a post-hoc multiplier); re-running this grid
                                 #   unchanged will reproduce these numbers. Knob KEPT, wired and probe-able, so the
                                 #   next attempt costs one config line instead of a patch to `long_leg`.
                                 #   0.0 IS NOT "OFF" HERE. Nearly every other knob in this file uses 0 = off;
                                 #   this one is a FLOOR, so 0.0 is the LOOSEST setting there is (every rung
                                 #   allowed, 2Y included) — identical in effect to 2.0. "Off" for this knob is
                                 #   5.0, the value that reproduces the historical 20/8/5 ladder. Set 0.0 by
                                 #   reflex on 2026-08-03 and `shipped_config_pin` caught it; that is what the
                                 #   pin is for.
                                 #   (#49) RE-PROPOSED AND REFUSED AGAIN 2026-08-05, this time WITH the record-
                                 #   length ladder underneath it. See growth_trust_young below for the grid.
                                 #   (#50) AND NOW MEASURED FROM THE OTHER END — 2026-08-05, on a live overlay that
                                 #   ships `growth_min_leg_years: 0`. Question was "why do only 2 stocks rank"; the
                                 #   answer is that THIS LINE IS THE ONE THAT MATTERS, and it is the whole fix:
                                 #     arm     what moved from LIVE       20y med|h2h|edge     8y med|h2h|edge
