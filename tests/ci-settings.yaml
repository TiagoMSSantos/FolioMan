# CANONICAL BASE config — the full, documented, shared configuration. NO secrets: ntfy_topic is a dummy
# (the tests never push), every URL below is a public, unauthenticated endpoint. THREE consumers:
#   - network-smoke (per-PR): only urls.yahoo_chart is exercised.
#   - backtest-gate (nightly + push/PR): runs `backtest 12 universe`, scoring with buy_heuristic below.
#   - the private config/settings.yaml INHERITS this file (config::load deep-merges it as the base), so the
#     gitignored local overlay only OVERRIDES what it changes. By convention it now carries ONLY the
#     watchlist (tickers), the table column layout (widths), and any local secret (a real ntfy_topic) or
#     knob under test — EVERYTHING ELSE lives HERE. Overlay wins field-by-field. Edit shared config HERE.
# Omitted knobs fall back to the code's #[serde(default)] (== the shipped defaults).
#
# A/B'ING A KNOB — WHERE YOU PUT THE ARM FILE CHANGES THE ANSWER (learned the hard way 2026-08-03).
# `config::data_path` (config.rs:707) resolves the on-disk caches from the config file's GRANDPARENT
# directory. `tests/<x>-ci-settings.yaml` has an empty grandparent, so it falls through to the CWD and
# reads the repo-root caches. An arm parked in /tmp or a job dir resolves to THAT tree instead — a cold,
# separate cache. A cold `.long_history_skip.json` makes `screen` fetch the monthly series it would
# otherwise skip, which moved the universe by 42 names and rewrote most of the gate funnel. `backtest` is
# immune (measured: same config, both dirs, byte-identical), `screen` is NOT. So: keep every arm at
# `tests/<something>-ci-settings.yaml` (the `ci-settings.yaml` suffix also makes it self-contained, since
# `ci_base_yaml` returns an empty base for that name), and bracket the arm with a repeat of the shipped
# config — consecutive same-config screens still drift by a few names, and that drift is the noise floor
# any claimed effect has to clear.
#
# ============================================================================================
# ETF-CLASSIFICATION RECEIPT (2026-08-02) — READ BEFORE TRUSTING ANY PEER-RELATIVE EDGE BELOW
# ============================================================================================
# Every peer-relative edge number written into this file BEFORE this date was measured with ETFs
# pooled into the STOCK peer-mean. `core::backtest_quote` builds `Quote::stub(ticker, "", "", ticker)`
# — name = the ticker, instrument_type empty — and `picks::quote_is_etf` is exactly
# `instrument_type == "ETF" || is_etf(name)`, where `is_etf` substring-matches "etf"/"ucits"/… markers
# that no real fund TICKER carries (VWRA.L, XDWD.L, SEMI.AS). So every fund in the pool classified as a
# single stock. `demean` splits on `picks::asset_class`, so the peer baseline each lane edge is graded
# against mixed funds with companies. Fixed by `stamp_asset_class` (commands/backtest.rs), which fills
# name/instrument_type/sector from the chart response the backtest ALREADY fetches — zero extra requests.
#
# HOW BIG: not the "~87% of the universe" the ticker count suggests. Forward-window survival scales with
# listing age, and UCITS funds are young, so ETF density in the SCORED pool depends on the horizon. The
# per-class census the report now prints, `universe fund <h> stress`:
#     20y-s: crypto 0/4633     ETF 14/4633 (0.3%)    stock 4619/4633
#     12y-s: crypto 0/11758    ETF 2624/11758 (22%)  stock 9134/11758
#      8y-s: crypto 0/20575*   ETF 8650/20575 (42%)  stock 11907/20575        (*18 crypto cutoffs, 0 scored)
#
# WHAT MOVED (GROWTH lane, `universe fund <h> stress`, same session/binary/universe, before -> after):
#     20y-s KING  rho +0.18 -> +0.18   edge +648.2 -> +661.2   winsor +570.7 -> +583.7   OOS +0.21/+0.17 -> +0.22/+0.17
#     12y-s       rho +0.21 -> +0.12   edge +212.9 -> +148.1   winsor +168.3 -> +113.6   OOS +0.17/+0.19 -> +0.18/+0.01
#      8y-s       rho +0.25 -> +0.16   edge  +77.1 ->  +42.9   winsor  +73.6 ->  +41.2   OOS +0.19/+0.19 -> +0.19/+0.08
#
# The damage tracks ETF density EXACTLY — 0.3% density, no change; 22%, edge -30%; 42%, edge -44%. That
# (but see TWO-CAUSE ATTRIBUTION below: the "after" column bundles a second change, now separated)
# dose-response is the evidence the fix is a fix and not a new bug. `windows scored` barely moves
# (380->380, 576->576, 723->717), so no names dropped out: what changed is the YARDSTICK, not the pool.
# The old 12y/8y numbers were inflated because a growth stock was being graded against a peer pool that
# was a fifth-to-half broad index funds. Beating a basket of index trackers is easy for a momentum name;
# beating other STOCKS is the real test, and that is what these lower numbers now measure.
#
# WHAT DID **NOT** MOVE: the held book — the rows actually bought. Identical at all three horizons:
#   20y  growth_score book +13.3%/yr excess +6.1 win 97%   rank1 +6.0|+6.6 win 83% of 36
#   12y  growth_score book +14.1%/yr excess +6.3 win 90%   rank1 +5.6|+5.9 win 69% of 51
#    8y  growth_score book +14.0%/yr excess +6.4 win 88%   rank1 +6.6|+7.2 win 73% of 59
# Held-book excess is measured against a BENCHMARK, not against the de-meaned peer pool, so the
# contamination never reached it. The 12y/8y drop is a diagnostic correcting itself, not a portfolio
# getting worse. The growth lane still beats the on-sale foil at every horizon (661 vs 413, 148 vs 46,
# 43 vs 27), so the lane choice is unaffected too.
#
# TWO-CAUSE ATTRIBUTION (added 2026-08-02, correcting the single-cause reading above)
# ----------------------------------------------------------------------------------------------
# The "after" column bundles TWO changes that shipped in the SAME commit, not one:
#   (1) the de-mean now groups by a CORRECT asset class, so a stock is graded against stocks;
#   (2) `growth_commodity_damp` (0.8 in this file) went from inert to LIVE, because the same stamping
#       that fixed the class also supplies the `sector` and real fund `name` that `picks::is_commodity`
#       reads. Its own doc in config.rs asserted it "can never be swept" — that was true until it wasn't.
# Attributing the whole move to (1) was therefore unproven. A CONTROL run — `growth_commodity_damp: 1.0`,
# every other knob at this file, same binary/universe/session — separates them. GROWTH lane, edge:
#
#   horizon   base (pre-fix)   ctrl (split only)   etf (split+damp)   split alone   damp alone
#    20y-s KING   +648.2            +653.9              +661.2           +5.7         +7.3
#    12y-s        +212.9            +141.2              +148.1          -71.7         +6.9
#     8y-s         +77.1             +42.0               +42.9          -35.1         +0.9
#   rho:  20y +0.18/+0.18/+0.18   12y +0.21/+0.09/+0.12   8y +0.25/+0.15/+0.16
#   winsor ctrl: +576.4 / +106.9 / +40.3     OOS ctrl: +0.21|+0.17 / +0.16|-0.02 / +0.19|+0.06
#
# WHAT THIS CHANGES, and what it does not:
#   - The 12y/8y collapse IS the peer-mean split. The split ALONE costs MORE than the net move
#     (-71.7 vs a net -64.8 at 12y; -35.1 vs -34.2 at 8y) — the damp cushions it. The receipt above
#     is not just directionally right there, it UNDERSTATES the contamination.
#   - The 20y KING improvement is mostly the DAMP (+7.3 of +13.0), not the split (+5.7). The original
#     "the king horizon barely moved" line stands, but its cause was misattributed.
#   - `growth_commodity_damp` is edge-POSITIVE at every horizon measured. This is the FIRST measurement
#     the knob has ever had; it was set to 0.8 by judgement precisely because it was believed unsweepable.
#     At 12y it also lifts OOS-late from -0.02 to +0.01, i.e. off the wrong side of zero.
# DEBT: the damp is now sweepable and has NOT been swept — 0.8 remains an unfitted judgement value that
# happens to measure positive. Sweep it before treating 0.8 as validated.
#
# GATES THAT WERE DEAD AND ARE NOW LIVE in the backtest (they read name/instrument_type/sector):
#   is_commodity_etf (physical-gold/ETC), is_commodity (fund name tokens), sharpe_cap_etf.
# STILL INERT there, for a different and unfixed reason — `backtest_quote` never fills their inputs:
#   growth_min_aum_etf (aum_eur None), is_noneur_etf (quote_currency None), age/TER gates.
# BOTH LISTS ARE NOW PINNED, not prose: `growth_gate_reachability_pin` (commands/backtest.rs) probes
# every growth knob against a stock/ETF/crypto fixture built through the real reconstruction and asserts
# the full LIVE/INERT table per class. It also separates the three reasons a knob reads INERT — field
# never filled, scoped to another class, or reachable-but-dominated (which is what
# `growth_require_lifetime_uptrend` turns out to be: `growth_min_cagr` rejects its cohort first).
# Change a gate's reachability and that test fails, which is the point — these claims rotted silently
# for years precisely because nothing asserted them.
#
# DEBT, DELIBERATELY NOT PAID HERE: growth_min_cagr 19, growth_min_range_pct 80, growth_maxdd_cap 84,
# growth_max_peg 1.6, growth_accel_weight 0.65 and every other knob receipt below were FITTED on the
# contaminated peer-mean. The king horizon barely moved so they are not presumed wrong, but they are
# no longer independently validated at 12y/8y. Re-sweep before citing a 12y/8y Δedge as evidence.
#
# ============================ SHIP RULE v2 — 2026-08-06 =====================================
# THE PRIMARY METRIC CHANGES FROM rank-1 TO top-3, AND EVERY RECEIPT BELOW PREDATES THE CHANGE.
#
#   PRIMARY   top-3 excess (mean AND median) up or held, at 20y AND 8y
#   GUARD     rank-1 h2h >= 50% at 20y, 12y and 8y   (winner's-curse guard, NOT the judge)
#   GUARD     top-3 worst window not worse
#   TIE       horizons disagree -> UNRESOLVED -> NO SHIP. "20y king overrules" is RETIRED.
#
#   PRECEDENCE IS GUARD > PRIMARY > TIE, and it is not a formality. A broken guard REFUSES outright;
#   it is never softened into "unresolved" because the primary happened to split. `fixed_cagr_years: 5`
#   is the worked case: its top-3 medians split by horizon (20y +0.1, 8y -0.6) which reads like a tie,
#   but its rank-1 h2h fell to 48/50/50 — the argmax stopped beating ranks 11-20 — so it is REFUSED,
#   full stop. Apply the three tiers in order and stop at the first that fires.
#   "UNRESOLVED" ALSO REQUIRES A REAL DISAGREEMENT: one horizon UP and the other DOWN. A flat horizon
#   is not a disagreeing one, so an arm that is flat at 8y and up at 20y but loses the primary is a
#   plain NO-SHIP (see `fixed_cagr_years: 8`). The three states carry different follow-ups —
#   UNRESOLVED invites a better arm, NO-SHIP and REFUSED close the question — so do not blur them.
#
# WHY. The old primary, "rank-1 median at the 20y king", grades a ONE-STOCK portfolio. Nobody holds
# one stock; the money goes into a basket. `backtest` already prints top-N for N=1..50, so this costs
# no code — only the discipline to read the row that matches the policy.
# THE YARDSTICK WAS CARRYING THE VERDICTS. Re-grading the 2026-08-06 fixed_cagr_years grid on top-3
# instead of rank-1, same files, zero new runs (20y stress, median excess pts/yr):
#     arm        top-3 med   rank-1 med   worst window t3 / r1
#     control       +6.6        +6.4          -0.5 / -10.6
#     pin 8         +6.9        +4.6          -1.0 / -10.6
#     pin 10        +6.9        +6.0          -0.5 / -10.6
#     pin 5         +6.7        +4.0          -3.8 /  -7.5
#   Rank-1 spreads those arms over 2.4 pts and refused all three the same morning. Top-3 spreads them
#   over 0.3. THE FAILURE WAS CONDITIONAL ON BUYING ONE NAME. Nothing about the arms changed.
# AND top-3 IS THE BETTER-MEASURED SLICE, not merely the friendlier one: rank-1 is ONE name per
#   window, the noisiest cut in the grid. Its worst window is roughly DOUBLE top-3's at every horizon
#   (-10.6 vs -0.5 at 20y, -19.9 vs -7.8 at 12y, -19.2 vs -9.2 at 8y), and top-1 also WINS LESS OFTEN
#   (87/74/76% vs 97/87/82%). Concentrating into the single argmax was never the better book.
# RANK-1 IS DEMOTED, NOT DROPPED. It exists to catch a rotten argmax hidden behind two good names —
#   the (#3k) winner's curse. That is why its h2h stays MANDATORY. A top-3 that passes while rank-1
#   h2h sits under 50% is an inverted ranking wearing a basket as a disguise.
# "20y KING OVERRULES" IS RETIRED, and it should never have been the tie-break: the 20y lane is the
#   BLURRIEST in the grid. Its 90% bootstrap band is +/-78% of its own estimate on 21 h2h pairs;
#   8y is +/-40% on 38 pairs. Structural, not fixable — a 20y forward window needs data from 20y ago,
#   so there are simply fewer of them. Ties now read UNRESOLVED. See `growth_proximity_weight` and
#   `long_trend_cap`, both decided by the retired rule against contrary 12y/8y evidence.
# DISCLOSURE, because the order of events matters: the re-grade above was run BEFORE this rule was
#   written, so `fixed_cagr_years: 10` was already known to improve under it. Choosing a yardstick
#   after seeing whom it favours is the classic overfit path. The defence is that the justification
#   is STRUCTURAL — nobody holds one stock, and that argument stands with the numbers hidden — but
#   the peek is recorded here rather than left for someone to discover.
# WHAT THIS RE-OPENS: every knob below was graded on rank-1, so every rung is re-openable in
#   principle. NOT re-opened wholesale — that is the maximum-overfit move. Re-test one arm at a time,
#   on this rule, and record the UNRESOLVED verdicts too so nobody re-runs them.
# THE BUY SURFACE NOW QUOTES THE SAME BASKET (backtest.rs `VERDICT_TOP = 3`). The screen's method
#   footer used to cite top-10 at whatever horizon ran LAST, because `.backtest_verdict.json` held one
#   row and every wide run overwrote it — so a `backtest 8` erased the 20y proof and the footer changed
#   horizon silently. The journal is now keyed by hold-years and MERGES, the footer cites top-3 at the
#   LONGEST row on file, and it names the basket. If a rule change ever moves the graded basket, move
#   VERDICT_TOP with it or the footer starts advertising a book the rule no longer grades.
# SURVIVORSHIP IS UNCORRECTED IN THIS RULE'S PRIMARY METRIC, AND `stress` DOES NOT FIX IT (2026-08-07).
#   `STRESS_TICKERS` (commands/backtest.rs) is 27 hand-picked crashed/bankrupt names against ~4900
#   survivors — 0.55% of the pool — and it is worth knowing exactly where that correction lands.
#   Clean same-config A/B: the CI gate shells the wide run with the SAME `FOLIOMAN_CONFIG` this file is,
#   differing from the grid ONLY in the `stress` keyword. 12y top-3 held book:
#     with stress     +15.2 book | +7.3 excess | win 87% | worst -7.8 | 54 windows
#     without stress  15.1629    | 7.2584      | 87.037% | -7.7544    | 54 windows
#   Injecting every corpse moves the graded number by less than 0.05pp on every statistic. The run says
#   why in its own output: top-3 "rode 0 zeros/138 holds" while top-10 rode 1/387 (NOK, an injected
#   corpse). Corpses score BADLY — that is the gates working — so they land in the bottom half, widen
#   the top-half-minus-bottom-half LANE EDGE, and never enter the book.
#   CONSEQUENCE, STATED WHERE THE RULE IS STATED: `stress` grades the lane, not the basket. The top-3
#   number this rule ships on — and that the screen footer quotes — carries FULL survivorship bias.
#   Do not cite a `stress` run as if it had corrected the held book; it corrected a different metric.
#   NOT FIXED HERE, and the reason is not laziness: the honest fix is point-in-time index membership
#   (a data-vendor problem), and expanding a hand-list cannot reach it — a bigger list of names that
#   score badly still never enters the top 3. What WOULD move it is a loser set that scores WELL at the
#   cutoff and dies after, which is the hard half of the problem and nobody has assembled one.
# HORIZONS ARE NOT COMPARABLE TO EACH OTHER — a cross-horizon CAGR gap is an ERA artifact. A 20y hold
#   can only START 1971..2006-07 (it needs 20 years of future left); an 8y hold starts 1971..2018-07.
#   Those extra 12 years of start dates cover the 2010s run, which is why top-3 prints +16.1%/yr at
#   8y against +13.7%/yr at 20y. It is NOT a shorter-hold premium. The 8y lane's own edge-by-era
#   DECLINES (+46.6 -> +23.5 -> +22.3 -> +14.8), so the richer recent book is market, not method.
#   Compare an arm to its control WITHIN a horizon. Never compare horizons to pick one.
# ============================================================================================
tickers: []

# --- `check` / `alert` / `perf` display + scan knobs (display/report only — NOT scored by the backtest gate) ---
# OFF-HI anchor: 0 = drawdown vs the ALL-TIME high over the fetched ~10y history (recommended for a
# decades buy-and-hold: "on sale vs the proven peak", pairs with the below-200wk-SMA cheap reward).
# Or set N days for a trailing-N-day high (365 = last year only, recency-biased; 1825 = ~5y cycle).
high_days: 0
drawdown_pct: 1000.0
dip_days: 30       # trailing window (days) for the vs-high dip
drop_pct: 5.0      # `alert` fires when a name is >= this % below that window high
top_picks: 20      # how many "buy candidate" rows `check` lists after the table
# deploy-math base (€ you put in per month): `screen` prints "DEPLOY THIS MONTH: €base × entry-state
# multiplier" (near-high 1×, pullback 1.5×, drawdown 2× — the backtest's deploy-faster shape). 0 = line
# off. PERSONAL number — set it in the private config/settings.yaml overlay, never here.
monthly_deploy_eur: 0

# Per-horizon ±days averaged around each horizon's anchor date when computing 1D/1W/.../20Y %
# changes (smooths a single outlier day; 0 = exact day). All optional — omit the block or any
# label to use the built-in defaults (core::default_anchor_half): 1D 0, 1W 7, 1M 30, 6M/1Y 90,
# 5Y/10Y/20Y 365. Override only the labels you want to change.
anchor_windows:
  1D: 0
  1W: 3
  1M: 15
  6M: 91
  1Y: 182
  5Y: 365
  10Y: 365
  20Y: 365

# Show REAL (inflation-adjusted) returns on the 1Y/5Y/10Y/20Y % columns instead of nominal. A
# coin/stock up +50% over a span that saw +10% inflation is really only ~+36% in purchasing power.
# Deflates by the ACTUAL cumulative EU HICP inflation over each horizon, fetched live (same source
# as the check footer) — no rate to guess. Shorter horizons (1D/1W/1M/6M) are never adjusted.
inflation_adjust:
  enabled: true       # true = deflate long-horizon returns by live EU HICP; false = raw nominal %

# ============================================================================================
# BUY HEURISTIC (src/picks.rs). Acronyms (CAGR, ROE, P/E, NUPL, SMA, FX, ...): see Glossary in README.md.
#
# This is the COMMITTED, canonical base. BOTH the backtest-gate scores AND the live `screen` read it:
# the gitignored config/settings.yaml deep-merges OVER this file field-by-field, so the local overlay
# only needs to carry what it OVERRIDES (a secret, the watchlist, or a knob under test). Edit a value
# here to move the validated default for everyone; the rich "why" comments below are the shared record.
#
# There are TWO scoring lanes, and `screen` prints ONLY ONE of them:
#
#   • GROWTH lane (`growth_score`)  --> THIS is what `screen` prints. Proven compounders at/near
#       their own ~10y high, still climbing — the only lane with a validated forward edge. Live score:
#         base  = growth_trend_weight·CAGR + growth_accel_weight·accel + risk + quality + dividend
#         score = base · proximity · value(P/E tilt) · geomean(trust, overext_brake) + liquidity
#       (CAGR = Compound Annual Growth Rate; accel = how much the last 1Y outpaced that CAGR.)
#
#   • ON-SALE lane (`buy_score`)    --> BACKTEST FOIL ONLY. `screen` does NOT print this. It exists so
#       `cargo run -- backtest` can demonstrate that dip-buying has NEGATIVE edge over a 20yr+ hold.
#       Every knob tagged "[FOIL]" feeds ONLY this lane: changing it does NOT change `screen` output.
#
# So to tune what `screen` shows, touch ONLY the knobs NOT tagged "[FOIL]". GATES drop a candidate
# outright (and reshape the ranking the most — tune these first); SCORE knobs only re-rank the
# survivors. All knobs optional (omit any -> built-in default). See README.md "Tuning the buy heuristic".
# ============================================================================================
buy_heuristic:
  # --- GATES (fail any one -> excluded before scoring) ---
  min_1y_pct: -25.0              # [FOIL] on-sale only: reject if 1Y % <= this (the growth lane reads growth_min_1y_pct below, not this)
  growth_min_1y_pct: 0.0         # RE-MEASURED AND RE-CONFIRMED 2026-08-03 (5-rung stress ladder). Loosening this is the single most
                                 #   expensive thing in the whole grid, and it is MONOTONE — every step down costs 20y lane edge:
                                 #     +10 (tighter) +397.4 | 0.0 SHIPPED +410.8 | -10 +331.9 | -25 +316.2 | off(-1e9) +287.5
                                 #   rho falls with it (+0.16 / +0.14 / +0.13 / +0.12 / +0.12). Tightening to +10 does not rescue it
                                 #   either: 20y edge -13.4 and rank-1 median +6.0 -> +5.3, so 0.0 is a genuine peak, not an endpoint.
                                 #   This reproduces the round-5 (2026-07-03) receipt independently on current data — do not re-propose
                                 #   loosening it without a NEW mechanism; two grids five weeks apart now say the same thing.
                                 #   ---- original note ----
                                 #   LIVE (equities): the growth lane's 1Y floor — reject if 1Y % <= this. 0.0 = must be climbing this year.
                                 #   Was a hardcoded 0.0 until the knob was restored; this value is the constant it replaced, so shipping
                                 #   it changes nothing. It is written down because the number is EARNED, not conservative-by-default.
                                 #   MEASURED AND REVERTED ONCE (round 5, 2026-07-03, `.claude/growth_heuristic_plan.md:205`), on the same
                                 #   question that brought the knob back — "aren't down-1Y-but-up-5Y names good growth candidates?":
                                 #     same-batch triple: baseline edge +106.6 (OOS +0.11|+0.06) | floor -10 -> +101.1 | floor -20 -> +94.4
                                 #     decisive: the n=284 names a -10 floor NEWLY ADMITS average -108.1 pts forward peer-relative.
                                 #   Down-1Y-near-high names are falling out of favour, not resting — the on-sale foil's profile, and it
                                 #   loses here too. README lists removing this floor under "measured dead — don't re-run these".
                                 #   WHY THE KNOB EXISTS ANYWAY: so the cohort is re-measurable instead of quoted. `backtest universe`
                                 #   prints a `growth_min_1y_pct -10` GATE SWEEP row (restored with the knob) giving n + mean fwd return
                                 #   on TODAY's sample; `screen` prints a `Down year` tail naming the live names the floor drops. Read
                                 #   both, then leave this at 0.0 unless the sweep flips POSITIVE — and even then, only after a full
                                 #   `backtest universe` re-validation with both OOS halves positive. Edge-affecting.
                                 #   RE-MEASURED 2026-07-27 (`backtest universe`, 8445 cutoffs / 4881 tickers, growth lane 249 windows,
                                 #   edge +49.7 OOS +0.10|+0.21):
                                 #     growth_min_1y_pct -10   n=4   mean fwd peer-relative -85.0 pts
                                 #   Same SIGN and magnitude class as round 5's -108.1, so nothing here reopens the question — but say
                                 #   what it is: n=4 is far too small to confirm or overturn anything on its own. It is corroboration,
                                 #   not a replication. The n collapsed 284 -> 4 because the LANE is much stricter now than in round 5
                                 #   (growth_min_cagr 16.0 + use_life_cagr), so hardly any name reaches the point where the 1Y floor is
                                 #   its SOLE blocker — the same reason the growth lane scores only 249 windows here.
                                 #   READING THE SWEEP: its "<- TOO TIGHT" flag is NOT sample-size aware. The same run flags
                                 #   `growth_min_range_pct -10` at n=1 (+163.8) and `growth_maxdd_cap ->off` at n=1 (+75.7). Check n
                                 #   before believing any row in that table, including this one.
                                 #   PARTLY FIXED 2026-08-01: the sweep and the GATE AUDIT were reporting BARE MEANS of forward
                                 #   peer-relative return — the most skew-prone quantity in the tool — while every other slice in
                                 #   the report prints mean|median for exactly that reason. Both now print both, and the TOO TIGHT
                                 #   flag needs BOTH positive; disagreement prints SPLIT instead of a verdict. This killed most of
                                 #   the historical flags outright (see the PEG receipt at growth_max_peg for the full list). It
                                 #   does NOT make the flag sample-size aware — small n is still small n — but it does mean a row
                                 #   flagged TOO TIGHT is no longer one survivor carrying the average.
                                 #   SWEPT SOLO 2026-07-30 (per-knob stress grid, floor removed at -1e6): the floor is HORIZON-SPLIT.
                                 #   8y-s: removal WINS (edge +100.0 vs +79.2, top-10 +7.0 vs +6.5) — dip-buying pays inside a decade.
                                 #   20y-s KING: lane edge CRASHES +623.5 -> +429.8 (−31%) — down-year names admitted into the top half
