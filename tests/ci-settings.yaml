  #   (price-only CAGR misses reinvested dividends) was tested DIRECTLY by the use_adjusted_close
  #   total-return probe, which came back NO-EDGE (reverted false 2026-06-28).
  #   (#53) RETRACTION 2026-08-07 — "IMPOSSIBLE" WAS FALSE, AND THE TERM IS NOW MEASURED.
  #   This block used to say a walk-forward grade was not merely pending but IMPOSSIBLE, because
  #   `backtest_quote` could not reconstruct as-of dividends, and it cited that to ship the term ungraded
  #   and to keep it out of the growth ablation list. It was never true. `Chart.divs` carries
  #   (ex-date, amount) for the whole history and arrives in the SAME response as the closes — it was
  #   simply dropped on the floor at the fetch destructure in commands/backtest.rs. `dividends_in_window`
  #   and `dividend_sums` already existed and already did the work. Plumbing it cost one extra parameter
  #   on `backtest_quote`, and look-ahead safety is STRUCTURAL: that function already slices
  #   `&dates[..=as_of]` and `dividends_in_window` anchors on `*dates.last()`, so an as-of yield cannot
  #   reach a future ex-date by construction. "Impossible" should have been read as "unplumbed" the first
  #   time; the price of not checking was a scoring term shipping on argument alone.
  #   THE MEASUREMENT (walk-forward, wide universe of 4982 tickers, `dividend_weight` 0.0 vs the shipped
  #   0.5, both arms on THIS config, differing in that one value):
  #                        20y (0.0 / 0.5)          8y (0.0 / 0.5)
