                                 #   Taken by direction: Energy-only would MISS CF, the rank-1 name this exists for, and the
                                 #   branded/contracted Materials names are slow compounders this momentum lane never surfaces.
  growth_fx_damp: 0.98           # (#45) FX/VENUE dock: scale the growth score of an ETF whose LIVE quote currency is not EUR
                                 #   (Yahoo `quote_currency` — GBp/GBP/USD/SEK/CHF lines all count; picks::is_noneur_etf).
                                 #   Prices what the ranking is otherwise blind to for a EUR buyer: broker FX conversion
                                 #   (~0.25% each way) plus the off-home-venue spread — a cost the EUR line of the SAME
                                 #   multi-listed fund does not carry. Currency, not country (user decision 2026-07-30): a
                                 #   EUR-quoted line on a non-eurozone venue costs no FX and is NOT docked. ETF-only, also a
                                 #   user decision — the stock lane is all-USD by nature, a uniform dock reorders nothing;
                                 #   crypto's -EUR legs already quote EUR. The `x` rank flag prints either way; only the dock
                                 #   is knob-gated, same split as `c`.
                                 #   WHY 0.98: tie-break strength, the user's pick over 0.95/0.90 — ~0.5-0.8% round trip
                                 #   amortized over a long hold is real but small, so it reorders near-equal scores (prefers
                                 #   the EUR twin) without burying a genuinely stronger foreign listing. TER is NOT this
                                 #   knob's job — growth_ter_drag above already prices the recurring cost.
                                 #   UNMEASURABLE BY CONSTRUCTION, same class as (#44): `quote_currency` is written only by
                                 #   the live fetch (fetch.rs chart meta); `core::backtest_quote` stubs leave it None, so the
                                 #   damp is x1.0 in every walk-forward — validated edge untouched, knob can never be swept.
                                 #   Set by judgement; if the ETF ranks stop looking right, return to 1.0 and keep the flag.
                                 #   LIVE EFFECT (screen A/B 2026-07-30, warm cache): IITU.L 8.4->8.2, XLKS.L 8.2->8.1,
                                 #   SEMI.AS 5.1->5.0 — note SEMI.AS is a Euronext AMSTERDAM line quoted in USD, the
                                 #   currency-not-country rule catching what a venue rule would miss. EUR rows (VVSM.DE,
                                 #   VUAA/SPYL/AUM5) and crypto identical; ranks unchanged at today's gaps (tie-break sized).
  growth_overext_floor: 0.05     # growth-score multiplier at full stretch. Tightened 0.2->0.15->0.05, each step a harder blow-off-top brake:
                                 #   buying right after a parabola = poor long-hold entry. The walk-forward sweep ranks 0.05 best: wide
                                 #   5y rho +0.26->+0.28 AND OOS-late rho +0.09->+0.14 (durability up 55%) with edge flat (+108.5->+106.8).
                                 #   The old "0.1 docks NVDA out" worry was regime-bound — at 0.05 today NVDA still scores 6.7 > min_score
                                 #   5 (it's -10.6% off-hi, not parabolic) and the displayed order is unchanged. 1.0 = brake off.
                                 #   RE-FIT ON THE cagr-19 POOL 2026-08-01 (Phase B, pb-of*-*-s.txt): 0.05 HOLDS.
                                 #   THE FINDING IS THE SHAPE, not the winner — this knob has ZERO rank-1 authority. King
                                 #   rank-1 is byte-identical at EVERY value swept (0.02 / 0.05 / 0.10 / 0.20 all read
                                 #   +5.3 median, win 81%, h2h 60%; 0.02 is +5.5 mean vs +5.4, noise) while lane edge falls
                                 #   monotonically as the brake weakens: +684.4 / +677.4 / +631.6 / +553.8. It is a PURE
                                 #   LANE-EDGE lever, and growth_accel_weight is its mirror (pure rank-1, edge-costing).
                                 #   Tune the two independently — that orthogonality is why Phase B could ship accel
                                 #   without re-opening this knob.
                                 #   0.20 costs 18% of king edge and 19% at 8y (+58.4) for rank-1 that never moved —
                                 #   consistent with the ablation table (removing the brake outright = -457 at 20y).
                                 #   0.02 buys +7 at king (noise, inside the band) and SELLS 8% of 12y edge (+198.3 vs
                                 #   +215.1) and 5pp of 8y h2h. 0.05 is the balance point; 0.10 just loses 7% of king.
                                 #   NOTE the 0.10 king run first ABORTED (rc=134, `free(): invalid size` — glibc heap
                                 #   corruption, half the report lost mid-file). Re-run ALONE it exited clean and
                                 #   reproduced edge +631.6 EXACTLY, so the abort hit output teardown, not the maths.
                                 #   Same session had rustc SIGSEGV under memory pressure: environmental, not config.
  growth_turnover_weight: 0.0    # (L) ZEROED 2026-07-02 after a live A/B (screen at 0.5 vs 0.0): the ln(turnover/€1B) tilt is
                                 #   BACKTEST-BLIND (backtest quotes carry no turnover) and the A/B showed it does NOT do its
                                 #   claimed job — it's reward-only, so illiquid junk (ROX.DE €11K/day) sat in the ETF table
                                 #   WITH the tilt on; all it did was float mega-caps (AAPL/AMZN/TSLA) a few rows and swap
                                 #   AMD in over FTNT at the tail on turnover alone. A blind term that reorders with no
                                 #   validated edge gets neutralized (same rule as growth_value_weight). Thin listings are a
                                 #   GATE problem: use min_avg_turnover_eur (e.g. 1000000) to drop them outright. 0.5 = old tilt
  growth_overext_cap_crypto: 100.0 # (#4) crypto's own brake cap; =equity (no change). Raise (e.g. 200) to brake crypto later — unvalidated (crypto windows too sparse to isolate)

  # (4) Crypto market-greed damp from Bitcoin NUPL (already fetched for the screen footer). High NUPL
  # = whole-market euphoria/top -> shrink ALL crypto scores (thins the crypto tables in a frothy top,
  # fattens them after a flush). Applies to both lanes, crypto rows only.
  nupl_euphoria: 0.5             # NUPL above this starts damping crypto (~0.5 = greed/"belief" zone)
  nupl_damp_floor: 0.5           # crypto-score multiplier at NUPL 1.0 (peak euphoria); 1.0 = damp off
  nupl_capitulation: 0.25        # NUPL below this starts BOOSTING crypto (~0.25 = fear/accumulation); 0 = boost off
  nupl_boost_ceiling: 1.3        # crypto-score multiplier at NUPL 0 (deep capitulation); 1.0 = boost off. BACKTEST-BLIND judgment lever — keep mild
  crypto_max_mvrv: 1.6           # (#45) CRYPTO's valuation CEILING — reject a coin whose MVRV (market cap / realized cap)
                                 #   exceeds this. MVRV is the price the market pays over the price its holders actually
                                 #   paid; <1 = the whole market sits below its own cost basis. Printed in the new MVRV
                                 #   column, crypto tables only.
                                 #   IT IS NOT A PEG, and is deliberately NOT in the PEG column: realized cap has no
                                 #   earnings term, so MVRV reads as a P/B, not a P/E ÷ growth. Folding it into `peg`
                                 #   would recreate "two numbers, one name" — see the picks.rs `peg` cell receipt for
                                 #   what that cost last time (the tool cut APH at 2.02 in the run it ranked ODFL at 2.51).
                                 #   WHY 2.0 — IT IS NOT A NEW JUDGEMENT. `nupl_euphoria: 0.5` above already declares
                                 #   where crypto greed starts, and NUPL = 1 - 1/MVRV, so NUPL 0.5 IS MVRV 2.0. The damp
                                 #   and this ceiling now share ONE threshold. Consequence, accepted deliberately: a coin
                                 #   above 2.0 is both score-damped AND rejected, i.e. one fact charged twice. The
                                 #   alternative was two numbers that both mean "expensive" and drift apart.
                                 #   DO NOT LOWER TOWARD 1.0. Below ~1.0 the ceiling inverts into dip-buying — it would
                                 #   cut BTC (1.19 live) and keep the most bled alts (ICP 0.28, CRO 0.26) — and the
                                 #   `discount_weight` receipt records that the walk-forward backtest found deepest-dip
                                 #   ranking BACKWARDS. At 2.0 nothing in the live top 100 is cut (dearest is XLM 1.37),
                                 #   so this ships INERT and bites in the next bull. That inertness is the design.
                                 #   SOURCE: CoinMetrics community tier, `CapMVRVCur`, daily. Two requests per run and
                                 #   the first is mandatory: the timeseries endpoint 400s the ENTIRE batch over one
                                 #   unsupported asset (measured on cc, pyusd, rlusd, usde), so the catalog is fetched
                                 #   first as an allowlist. It must be the /v4/catalog/ path, NOT /v4/catalog-all/ —
                                 #   the latter lists pro-tier assets and re-admits the ones that break the call. Ids
                                 #   are the bare lowercase symbols, so there is no id table to join and keep current.
                                 #   TWO URL DETAILS THAT ARE LOAD-BEARING, both found by a live run returning n/a for
                                 #   BTC ITSELF. (1) `limit_per_asset=1`: the series runs oldest-first from 2011-12-31
                                 #   and the endpoint has no `reverse` param, so without it the page is spent on 2012
                                 #   rows and no current value survives. (2) A DATE CHECK IN CODE on every row, because
                                 #   `limit_per_asset=1` returns each asset's LAST row — for an asset CoinMetrics
                                 #   STOPPED covering that is a fossil, not a quote: bnb ends 2019-04-22 at 1.88 and dot
                                 #   ends 2022-06-03 at 0.52, and both come back looking exactly as current as btc's.
                                 #   Rows older than 10 days are dropped, so a dead-coverage coin reads as no data (and
                                 #   passes free) instead of being gated on a seven-year-old valuation.
                                 #   VALIDATED AGAINST THE TOOL'S OWN FOOTER: BTC MVRV 1.19 -> NUPL 1 - 1/1.19 = 0.160,
                                 #   against a live `Bitcoin NUPL: 0.166` line the same run. Two independent sources,
                                 #   same quantity — this knob is the per-coin form of a gauge already shipped.
                                 #   COVERAGE IS THIN AND THE GATE IS BUILT AROUND THAT: 17 of the live CoinGecko top
                                 #   100 non-pegged coins carry a value. Missing MVRV PASSES (house missing-data rule).
                                 #   Misses include BNB, SOL, TRX, AVAX, SUI, HBAR, NEAR, XMR — and BNB is currently
                                 #   RANK 1 of the crypto table, so today the printed table shows one n/a and one value.
                                 #   The screen prints the hit rate each run ("Crypto valuation: N of M coins ...").
                                 #   UNSWEEPABLE, and NOT for the usual reason. The data has daily history to
                                 #   2011-12-31, so it is not backtest-blind for want of a past value; the backtest POOL
                                 #   growth-scores zero crypto rows at every horizon (20y-s 0/4633, 12y-s 0/11758, 8y-s
                                 #   18 cutoffs with 0 scored). No sweep can vote on any crypto knob, this one included.
                                 #   `growth_gate_reachability_pin` reads it INERT for all three classes: `backtest_quote`
                                 #   never fills `quote.mvrv`, so it is cause (a) — field never filled. 0 = off (default).

  # RISK-ADJUSTED-RETURN tilts (B/C) — Sharpe ratio (return ÷ volatility) and Calmar ratio (return ÷
  # worst peak-to-trough drawdown), from the SAME closes already fetched, ZERO extra network cost.
  # Reward a calm, shallow-drawdown compounder over a knife-y one with the same headline CAGR.
  # (The old R²-smoothness "consistency" damp was deleted: it read pure edge-harm with no rho gain —
  # disabling it had nearly DOUBLED wide 5y edge +50.5->+95.6. Past path-smoothness doesn't predict return.)
  sharpe_weight: 0.05            # (B) GROWTH lane: reward per unit CAGR/volatility. History: 0.3->0.15 halving was peak edge
                                 #   PRE-smoothness. Re-swept 2026-07-04 AFTER growth_smoothness_weight shipped: trend_r2 carries
                                 #   the same calm-compounder signal, so Sharpe's marginal value shrank — 0.05/0/0.10 plateau at
                                 #   edge +148.0/+147.0/+145.8 vs +137.2 at 0.15 (same batch, rho +0.13 flat). 0.05 = measured max;
                                 #   kept NON-zero deliberately: the ETF lane (absent from backtest) leans on the Sharpe leg for its
                                 #   risk reward and the sharpe_cap_etf fix, so zeroing would be an unmeasured live ETF regression. 0 = off
                                 #   (#62) THE 0.15 -> 0.05 CUT'S PREMISE IS NOW STALE, so do not read 0.05 as a settled optimum:
                                 #   the re-sweep above cut this weight because `growth_smoothness_weight` "carries the same
                                 #   calm-compounder signal", and that knob was ZEROED on 2026-08-10 (see its block). The whole
                                 #   0.05/0/0.10-vs-0.15 plateau was measured with smoothness at 5.0 and has never been repeated
                                 #   without it. Re-sweeping this is the obvious next run; it is an ADDITION, so it owes the
                                 #   addition ship rule (rank-1 must RISE, not merely hold), and 0.05 stands until it clears that.
  onsale_sharpe_weight: 0.0      # [FOIL] (B) ON-SALE lane's own Sharpe weight, split from growth because the shared knob conflicted:
                                 #   ablation showed growth wants 0.15 but on-sale wants 0 — zeroing it lifts the on-sale 12y edge
                                 #   +39.2->+62.9 (Δ+23.7) while growth keeps 0.15. 0 = off (the swept on-sale optimum)
  sharpe_cap: 15.0               # (B) cap that CAGR/volatility ratio
  sharpe_cap_etf: 9.0            # (#37) ETF-only Sharpe cap: cross-listed lines of the SAME fund print different daily
                                 #   stdev (NASD.L 1.8%/day vs CSNDX.SW 1.1% for identical Nasdaq-100 holdings — thin-line
                                 #   prints + FX conversion), so ETF CAGR/vol above ~9 measures listing-line noise, not
                                 #   fund risk. Uncapped, that noise (0.15×Δsharpe ≈ 0.7 score) outvotes the real TER
                                 #   difference (2.2% over 20y) and ranks the COSTLIER identical wrapper higher. 9.0 ≈ the
                                 #   noise floor observed across same-index wrapper trios. Stocks keep sharpe_cap.
                                 #   CORRECTED 2026-08-02: "the backtest pool holds stock constituents only" was FALSE — the
                                 #   pool is ~4311 ETFs of 4954 tickers. The cap read inert only because backtest_quote left
                                 #   instrument_type/name blank so quote_is_etf never fired (see the ETF-CLASSIFICATION
                                 #   receipt at the head of this file). Since the class stamping this cap DOES apply in the
                                 #   backtest, at whatever ETF density the horizon carries: 20y-s 14 ETF cutoffs of 4633,
                                 #   12y-s 2624 of 11758, 8y-s 8650 of 20575. 0 = off
  calmar_weight: 0.0             # (C) ZEROED. Calmar (CAGR/max-drawdown) is harmful at the 12y horizon: 1.0->0 lifts GROWTH
                                 #   edge +92.7->+98.0, rho +0.06->+0.07, top-half +4.6->+7.3 — all three improve. Over a 20y hold the
                                 #   deepest-drawdown names are often the biggest compounders; penalizing path-pain deselects them.
                                 #   sharpe (0.15) stays — removing it COSTS edge (Δ-3.1), so volatility-awareness still helps. 0 = off
  calmar_cap: 2.0                # (C) cap that CAGR/max-drawdown ratio

  prefer_eur: true               # dedup currency twins (BTC-EUR/BTC-USD): keep EUR leg if true, else USD
  growth_require_peg: true       # require a PEG to score a name. The growth_score reads PEG (1/PEG x 100) and the gate rejects PEG > growth_max_peg, so a missing PEG is a free pass. This knob forces a missing PEG to fail the gate. Reads `fund.eps_never_reported` (filer-level, never as-of), NOT `peg_yield.is_none()` — the cohort is filers whose 10-K states no per-share element at all, 8 of 509 cached US names, seven of them now FIXED by the XBRL-instance fallback. Residue today: ARES alone. false = off

# --- live-universe fetch breadth + pacing (so the backtest gate scans the same wide pool `screen` does) ---
# How many symbols PER CLASS (crypto + stocks/ETFs) `screen` pulls from the live sources
# (coingecko_markets + sp500_csv URLs below). Bigger = more to scan = slower (one history
# fetch per ticker, in parallel) + more rate-limit risk. `screen TICKER...` overrides everything.
universe_size: 1234000

# Max fetches in flight = CPU cores × this multiplier. In-flight memory holds the large 10y + monthly
# chart payloads, so this is the MEMORY/stability knob, not the speed knob (the pacer below sets speed).
# 8 cores × 8 = 64 was stable across full 3847-name screens; conc=128 (mult 16) got SIGKILLed mid-run.
# Keep cores×mult ≈ 64: on a 16-core box use mult 4, on 4-core use 16. 0 is treated as 1.
fetch_concurrency_multiplier: 8

# Global outbound-request pacer (requests/second) — THE speed knob. Spaces request LAUNCHES so the
# fan-out can't burst-429 (concurrency bounds in-flight count but not the launch burst). Yahoo's limit
# is undocumented. Measured at full universe (3847 names, ~3 Yahoo calls/name): rps 60 = 0 valid names
# lost in 4m27s; rps 40 = 0 lost in 6m37s. 60 nearly saturates conc 64, so higher rps needs more
# concurrency (which risks the memory kill above) for little gain. Lower if you see real names drop,
# 0 disables pacing (a 64-wide burst then drops valid names — e.g. NVDA — so don't).
fetch_requests_per_second: 60.0

# Worker threads for the CPU-bound half of `backtest` — the per-ticker walk, the knob sweeps and the
# `tune` search. NOT the two knobs above: those size in-flight NETWORK requests and want to be far
# larger than the core count, this one sizes actual compute and wants to be at most it. 0 (the
# default, and what CI uses) = every logical core; `RAYON_NUM_THREADS=n` still overrides for one run
# whenever this is 0. Set it to cap FolioMan while you use the machine for something else.
# It must never change a printed number — the walk collects in ticker order and every seeded PRNG
# stream stays serial — and tests/backtest_fixture.rs pins that: the goldens are generated
# single-threaded and must reproduce byte-for-byte at any setting.
compute_threads: 0

# Quote the live-universe crypto in EUR (BTC-EUR) if true, else USD (BTC-USD). Mirrors
# buy_heuristic.prefer_eur but for what `screen` fetches. US stocks/ETFs have no EUR listing.
universe_prefer_eur: true

# `screen` SECTOR FILTER — which type of companies/ETFs to fetch. Case-insensitive substring
# keywords matched against a stock's GICS sector AND an ETF's fund name. Empty list (or omitted) =
# fetch ALL sectors (the default). Stocks are filtered BEFORE fetch (by their GICS sector, so other
# sectors are never even pulled); ETFs carry no GICS, so they're filtered by fund name. Crypto is
# never sector-filtered. `screen TICKER...` (explicit tickers) ignores this. Examples:
#   tech only:  [Technology, Communication, Semiconductor]   ("Technology" catches GICS "Information Technology")
#   healthcare: [Health]                                     energy: [Energy]   financials: [Financ]
#   ALL sectors: []   (empty list — or comment out the `sectors:` line below entirely)
sectors: []

# ntfy.sh topic for `alert`. Anyone who knows it can read your alerts (= your watchlist), so treat it
# like a password: this COMMITTED base carries a DUMMY only. Put a real, long, random private topic in
# the gitignored config/settings.yaml overlay (NEVER here — this file is committed + pushed).
ntfy_topic: "ci-smoke-tests-unused"

# Data-source URLs. Templates use {placeholder} tokens filled at fetch time: {ticker} {range} {n}
# {topic} {key}. Swap a source by editing the URL here, no rebuild of logic needed (only the response
# shape must match what the parser expects). The keys with a built-in code default (constituents_csv,
# euronext_lisbon, fundamentals*) are listed here for documentation — omit
# any and it falls back to the SAME URL, so the backtest gate already fetches them either way.
urls:
  yahoo_chart: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range={range}&interval=1d&events=div,split"
  # hourly bars over ~5 days -> screen 1h/6h/12h columns (counted as 1/6/12 bars back, not wall-clock,
  # so stocks fill too despite overnight gaps; 5d ensures >=13 bars even for a 6.5h trading day).
  yahoo_intraday: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=5d&interval=60m"
  yahoo_search: "https://query1.finance.yahoo.com/v1/finance/search?q={ticker}&newsCount=3&quotesCount=0"
  yahoo_quote: "https://finance.yahoo.com/quote/{ticker}"
  euribor: "https://www.euribor-rates.eu/en/current-euribor-rates/2/euribor-rate-3-months/"
  us_cpi: "https://api.bls.gov/publicAPI/v1/timeseries/data/"  # BLS CPI-U index (monthly); seriesid + year window POSTed by fetch (path-GET ignores years). v1 = no key, 10y/call
  pt_cpi: "https://bpstat.bportugal.pt/data/v1/domains/12/datasets/7f13efcd65fc6bd0c5adb0e8d29d9b44/?lang=EN&series_ids=5721550"
  # COICOP-2018 successor (Feb 2026): prc_hicp_manr was TERMINATED at 2025-12; minr carries the
  # same annual-rate series (unit=RCH_A, all-items now coicop18=TOTAL) but only back to 2000.
  eu_hicp: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_minr?format=JSON&lang=EN&unit=RCH_A&coicop18=TOTAL&geo=EU27_2020"
  # the frozen pre-2026 dataset, still served: merged UNDER the live series for the 1997-1999 tail
  eu_hicp_old: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr?format=JSON&lang=EN&coicop=CP00&geo=EU27_2020"
  # {n} = top-N crypto by market cap; `screen` maps each .symbol to SYMBOL-USD (Yahoo form)
  coingecko_markets: "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page={n}&page=1"
  # S&P 500 constituents CSV (first column = Symbol); `screen` maps '.'->'-' for Yahoo
  sp500_csv: "https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv"
  # (Item 18/32) extra equity ponds APPENDED to the S&P 500 set, to widen the grower pool the proven
  # ranking draws from. Each entry is a CSV (col0=Symbol; col2=GICS Sector, or 2-column Symbol,Name ->
  # sector "other") OR a Wikipedia "List of S&P N companies" page (host picks the parser). A dead URL
  # or unrecognizable page just drops that pond — never crashes the screen.
  # Nasdaq-100 (yfiua/index-constituents, auto-updated monthly): ~13 large growers not (yet) in the
  # S&P 500 (the PDD/ARM profile — exactly what the lane ranks). VALIDATED 2026-07-03, same-batch 12y:
  # baseline edge +126.7 (OOS +0.14|+0.10) -> with n100 +126.8 (OOS identical) — free supply, no dilution.
  # S&P MidCap 400 (Wikipedia page) MEASURED-REJECTED same batch: +400 mid-caps CUT the edge to +85.0
  # and halved rho (+0.13 -> +0.07) — the persistence signal the lane rides is weaker in mid-caps
  # (they mean-revert more). Do NOT re-add without a new same-batch run that clears the bar.
  # FTSE 100 + DAX (yfiua CSVs, the free STOXX-600 proxy) MEASURED-REJECTED 2026-07-04, same-batch
  # 12y: baseline edge +127.6 (rho +0.13, OOS +0.14|+0.10) -> with 140 EU large-caps +117.0
  # (rho +0.11, OOS +0.11|+0.09, winsorized 97.7 -> 89.1) — every dial moved down, same direction
  # as the MidCap rejection: the US-momentum persistence the lane rides is weaker in EU large-caps.
  # RE-TESTED AND REJECTED AGAIN 2026-07-25, this time with FTSE MIB added (the one pond never
  # measured before) — DAX 40 + FTSE MIB 40 + FTSE 100 100, same-batch 12y: baseline 4913 tickers
  # edge +156.8 (rho +0.15, OOS +0.14|+0.12, winsorized +126.7) -> with the three ponds 5077 tickers
  # edge +136.0 (rho +0.13, OOS +0.11|+0.12, winsorized +106.4). Every dial down or flat, none up,
  # and the -20.8 falls well inside the 90% bootstrap bands ([+99.1 … +197.7] vs [+87.6 … +187.2]),
  # so it is not even distinguishable from noise — an indistinguishable result does not overturn a
  # prior measured rejection. Three runs, three ponds, one direction; Italy did not rescue it.
  # Do NOT re-add without a new same-batch run that clears the bar.
  # NOTE for whoever tries a fourth time: the dilution is a POOL effect, not just extra rows being
  # ranked — forward returns are de-meaned per ~6mo cutoff, so +164 EU names move every bucket's
  # mean. Widening the pond can therefore only pay if the new names rank as well as the incumbents,
  # and by three measurements EU large-caps do not.
  constituents_csv:
    - "https://yfiua.github.io/index-constituents/constituents-nasdaq100.csv"
  # Euronext Lisbon equities (POST, DataTables JSON; mics=XLIS) -> Portugal `.LS` stock universe
  euronext_lisbon: "https://live.euronext.com/en/pd_es/data/stocks?mics=XLIS"
  # latest Bitcoin NUPL (net unrealized profit/loss), free on-chain sentiment gauge; `screen` prints it after the crypto table
  nupl: "https://bitcoin-data.com/v1/nupl/last"
  # (E) trailing-P/E source for the valuation tilt. {ticker} + {key} (key from FMP_API_KEY env, NOT
  # here). Equities only, and only when the env key is set — free tiers are rate-limited, so use it
  # for `check` (~55 tickers), not the ~750-ticker `screen` (where P/E stays None -> neutral tilt).
  fundamentals: "https://financialmodelingprep.com/stable/quote?symbol={ticker}&apikey={key}"
  # (F) ROE/quality source for the profitability tilt — FMP stable ratios-ttm (carries returnOnEquityTTM).
  # Same FMP_API_KEY opt-in / `check`-scale profile as `fundamentals` above. (v3 legacy died 2025-08-31.)
  fundamentals_quality: "https://financialmodelingprep.com/stable/ratios-ttm?symbol={ticker}&apikey={key}"
  ntfy: "https://ntfy.sh/{topic}"
