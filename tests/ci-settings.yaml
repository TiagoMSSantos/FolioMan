  #   horizons disagree -> UNRESOLVED -> nothing ships.
  #   VERDICT: 0.5 STANDS — not because it won, but because it provably costs NOTHING on the graded metric
  #   while keeping the after-tax yield visible in the ranking a human reads. It has moved from a BLIND
  #   judgment lever to a MEASURED-INERT one. DO NOT RE-PLUMB THIS: the answer is on file, and the next
  #   person to notice "dividends are missing from the backtest" should read this block instead of the
  #   module header they will otherwise trust.
  #   (#58) RETRACTED — three lines stood here claiming the tax split was "STILL UNGRADED, and NOT fixable
  #   by this plumbing: the backtest carries no `domicile`". Wrong the same way this block's own IMPOSSIBLE
  #   was wrong, one step further on: NOTHING on this path ever read a `domicile`. `tax_keep` branches on
