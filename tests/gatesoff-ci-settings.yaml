# (#129) GATES-OFF CEILING ARM — an INSTRUMENT, never a candidate lane.
#
# Reads one question rounds (#127)/(#128) left open. Those two measured which SINGLE gate, then which
# gate PAIR, blocks the missed winners, and refused both arms on pre-registered stop rules: the best
# single gate reaches 14.9/10.1/16.2% of the missed wealth (20y/12y/8y), the best pair 6.2/1.9/8.6%,
# and its both-near-miss subset is 0 winners at 20y and 12y. The histogram says why — 65-88% of the
# missed wealth fails 3+ gates AT ONCE. No one-knob or two-knob arm can reach that, so the open
# question is no longer WHICH gate but whether the STACK AS A CONJUNCTION pays for itself at all.
#
# This file turns off every gate that BINDS in the backtest lane, using each knob's own documented
# off-value. It is graded against the shipped `tests/ci-settings.yaml` under Ship Rule v2 and it ships
# NOTHING either way: a lane with no gates is not a strategy. The verdict decides whether a
# `growth_max_gate_failures` tolerance knob (0 = today's conjunction) is worth building at all.
#
# Run BOTH arms, save both:
#   rtk proxy env FOLIOMAN_CONFIG=tests/ci-settings.yaml          ./target/release/folioman backtest 20 universe fund pit
#   rtk proxy env FOLIOMAN_CONFIG=tests/gatesoff-ci-settings.yaml ./target/release/folioman backtest 20 universe fund pit
# (the literal `env` is required — without it rtk proxy exits 0 and writes the error into the redirect)
#
# DELIBERATELY NOT LOOSENED, and this is the line that keeps the reading clean:
#   growth_min_leg_years (5.0) and fixed_cagr_years feed `long_leg_fixed`, which DEFINES the CAGR
#     window the score ranks on. Moving them redefines the SCORE instead of removing a GATE, and the
#     arm would stop being a read on the stack.
#   min_avg_turnover_eur / growth_min_age_years are LIVE-only (backtest_quote sets a sentinel
#     turnover and no age), so they are already inert here.
#   max_1m_drop_pct, growth_min_8y_pct, growth_min_20y_pct and every fundamentals floor
#     (net_margin, margin_swing, dilution, interest_cover, fcf_margin, net_cash_rev) already ship at
#     their own off-values — nothing to turn off.
#
# Comment after each knob = the value tests/ci-settings.yaml ships, i.e. what this arm is moving FROM.
buy_heuristic:
  growth_min_range_pct: 0.0                 # 80.0
  growth_min_cagr: -1e9                     # 19.0  — also governs the whole-life CAGR leg
  growth_min_1y_pct: -1e9                   # 0.0
  growth_min_5y_pct: -1e9                   # 75.0
  growth_max_above_ma: 0.0                  # 150.0
  growth_maxdd_cap: 0.0                     # 84.0
  growth_max_peg: 0.0                       # 1.6
  growth_require_peg: false                 # true
  growth_require_lifetime_uptrend: false    # true
  print_recall_capture: true                # (#104) display-only, for the tie-back against the control
