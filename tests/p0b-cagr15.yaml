# (#135) P0b ARM 1 — `growth_min_cagr` 19.0 -> 15.0 on the point-in-time pool.
#
# Two fields, and the second is the instrument, not a graded change: `print_h2h_mid_ladder` only adds a
# printed line (receipt at its ci-settings entry). `heuristic_drift` must therefore name EXACTLY these
# two on every run using this file — anything else means the overlay is not doing what it says.
#
# Deep-merges over the committed tests/ci-settings.yaml (the filename deliberately does not end in
# `ci-settings.yaml`, which config::ci_base_yaml would treat as a pure fixture with no self-merge, and
# it lives under tests/ because config::anchored_path resolves data paths from the GRANDPARENT).
#
# 15.0 is not a guess: it is the exact point `gate_sweep` probes as `growth_min_cagr -4`, which on the
# PIT control flags TOO TIGHT at 8y (n=315, fwd peer-relative mean +66.3 | med +63.8).
buy_heuristic:
  print_h2h_mid_ladder: true
  growth_min_cagr: 15.0
