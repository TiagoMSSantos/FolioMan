# Frozen-data backtest fixture — the overlay half of tests/backtest_fixture.rs.
#
# THIN BY DESIGN. `config::load` deep-merges this over tests/ci-settings.yaml, so carrying only
# `tickers:` means the pin grades the SHIPPED tuning and tracks it automatically: move a knob in
# ci-settings.yaml and the golden reds, which is exactly the receipt the other pins already demand
# ("re-validate with a live backtest universe, then move the pin"). Adding a `buy_heuristic:` block
# here would silently fork the fixture off the shipped settings and the pin would stop meaning anything.
#
# ITS LOCATION IS LOAD-BEARING. `config::data_path` anchors to this file's GRANDPARENT, so living at
# tests/fixture/config/settings.yaml makes tests/fixture/ the data root — which is how
# .long_history_cache.json next to it gets picked up by the ordinary cache path with no test-only
# plumbing inside fetch.rs. Do not move this file without moving the frozen cache with it.
#
# THIS LIST IS THE ONE DEFINITION OF THE FIXTURE UNIVERSE. The binary under test reads it as its
# universe, and `regen_backtest_fixture` in tests/backtest_fixture.rs reads it FROM HERE to rebuild
# the frozen cache — so the cache and the scored universe can no longer drift apart. It used to be
# duplicated as a `FIXTURE_TICKERS` array there, kept in sync by this comment asking nicely.
# The selection recipe — why these 200 names and not 200 others — is documented on `fixture_tickers()`.
