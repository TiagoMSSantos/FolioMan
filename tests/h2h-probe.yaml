# (#135) Stage-1 instrument probe: turns ON the second head-to-head line and changes NOTHING else.
#
# It DEEP-MERGES over the committed base `tests/ci-settings.yaml`. The filename deliberately does not
# end in `ci-settings.yaml` — `config::ci_base_yaml` treats any overlay that does as a PURE fixture
# with no self-merge, which would silently swap all ~200 tuned gates for the code defaults. It also
# lives under `tests/` because `config::anchored_path` resolves data paths from the config file's
# GRANDPARENT, so an overlay anywhere else silently changes the dataset.
#
# NOT a graded arm: it moves no gate, no score and no weight, so `heuristic_drift()` must name
# `print_h2h_mid_ladder` and nothing else on any run that uses it. That is the drift check for Stage 2.
buy_heuristic:
  print_h2h_mid_ladder: true
