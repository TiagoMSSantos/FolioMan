# Config for the GitHub Pages run (`FOLIOMAN_CONFIG=config/web-settings.yaml`), and ONLY that run.
#
# This is a small overlay, not a second full config: `tests/ci-settings.yaml` merges underneath it
# field-by-field (see `merged_config`), so everything absent here — the whole tuned `buy_heuristic`,
# `universe_size`, the fetch pacer — is inherited from the committed base exactly as the local run
# inherits it. What is here is the delta between "your terminal" and "a public page built by a
# runner", and it is of two kinds.
#
# KIND ONE: things that must NOT reach a public page. `config/settings.yaml` is gitignored and absent
# on the runner, so its watchlist, its ntfy topic and its deploy amount simply are not here — but the
# empty `tickers`/`sectors` below are written out anyway, because inheriting an empty list by
# accident and inheriting it on purpose look identical right up until the base gains a default.
#
# KIND TWO: the display shape, so the published row is the row your terminal prints. The column list
# and the ETF name width are mirrored from `config/settings.yaml`; the two files have to be edited
# together, and the page's own header row is what shows it when they aren't.

# No watchlist. Pinned tickers print even when gated, so a pin here would publish a name for the sole
# reason that someone is watching it — which is exactly the private signal this page must not carry.
tickers: []

# No sector filter: the page publishes the top of the whole ranking, like an unfiltered `screen`.
sectors: []

# Bridged history for the young S&P 500 listings (mirrors config/settings.yaml). Without it these
# rank on a 2-3 year record and the `~` flag never appears on the page.
history_proxy:
  VUAA.DE: SXR8.DE
  SPYL.DE: SXR8.DE
  AUM5.DE: SXR8.DE

# Prefer the EU listing of a name where one exists — the page is read by a EUR buyer, same as the
# terminal (mirrors config/settings.yaml).
prefer_eu_listing: true

# The printed table, column for column (mirrors config/settings.yaml `widths.columns`). This IS the
# "full terminal parity" the page promises: `web_top` publishes one `(header, cell)` pair per column
# listed here, minus the ones that lane hides. Reorder or comment out a line and the page follows.
widths:
  name: 28
  name_etf: 53
  ticker: 10
  market: 7
  price: 9
  headline: 27
  score: 5
  columns:
    - rank
    - name
    - ticker
    - market
    - price
    - cagr
    - yrs
    - 1h
    - 6h
    - 1d
    - 1w
    - 1m
    - 2y
    - 5y
    - 8y
    - 20y
    - vol
    - maxdd
    - r2
    - abv-ma
    - pe
    - peg
    - mvrv
    - roe
    - ter
    - aum
    - use
    - repl
    - rev-yoy
    - eps-yoy
    - net
    - div
    - buyback
    - off-hi
    - turnover
    - score
    - score8y

# The gate loosenings the local overlay runs with. Mirrored because they change the RANKING, not just
# the layout: on the base gates alone the page would rank a different #1 than the terminal it claims
# to mirror. Nothing private here — these are knobs, and the base carries them all with comments.
#
# (#83) SAY IT PLAINLY: THIS BLOCK IS NOT THE VALIDATED LANE, AND THE PAGE IS THE MOST-SEEN OUTPUT
# THE TOOL HAS. Every receipt in `tests/ci-settings.yaml` was measured on the BASE values, and five
# lines below depart from them — four gates opened wide enough that almost nothing is rejected
# (`growth_min_1y_pct`, `growth_min_5y_pct` and `min_score` at -1e6, `growth_min_leg_years` at 0,
# `growth_min_range_pct*` 80 -> 50) and one that changes WHICH NUMBER is ranked (`use_life_cagr`,
# see the block beside it). So no measured edge from that file transfers to this page. Nobody has
# claimed otherwise in code, but nobody had written it down either, and an undocumented departure is
# how a public number quietly acquires an authority it was never measured to have.
#
# WHY IT STANDS ANYWAY, rather than being "restored" to the base. This file exists to mirror
# `config/settings.yaml`, the private terminal run — the page's whole promise is "the #1 row your
# terminal prints". Reverting these to the base would break that promise to gain a validated ranking
# that the reader of the page is not the one acting on. The honest fix is disclosure, and it is in
# `web/index.html` as a note under the tables: the page now says which lane produced it.
#
# WHAT WOULD CHANGE THIS: `config/settings.yaml` moving back onto the base gates. These follow it —
# they are a mirror, and a mirror that argues with the thing it reflects is just a second config.
buy_heuristic:
  growth_min_leg_years: 0
  growth_min_1y_pct: -1000000.0
  growth_min_5y_pct: -1000000.0
  growth_min_8y_pct: 50
  growth_min_20y_pct: 200
  growth_min_range_pct_8y: 50
  growth_min_range_pct_8y_crypto: 50
  growth_min_range_pct: 50
  growth_min_range_pct_crypto: 50
  min_score: -1000000.0

  # CAGR BASIS — these two pick WHICH number the ranking compounds, where everything above only moves
  # a threshold. That difference is why they were missed the first time: they read like display knobs
  # and are nothing of the sort. Both route through `long_cagr_from`, which moves all seven readers
  # (gate, trend, accel, sharpe, calmar, trend_health, PEG) together.
  #
  # Left out, the page ranked on the 20/8/5 leg while the CAGR column kept printing whole-life — so it
  # showed BNB at +98%/yr and ranked it on ~+54%/yr, and its #1 was not the terminal's #1. That is the
  # exact failure the header above warns about, so treat these as load-bearing, not decoration.
  #
  # (#83) AND `use_life_cagr: true` IS A MEASURED LOSER — the base ships `false` and the receipt is
  # not close: (#3j) reads edge +125.6 vs +167.6 and rho +0.17 vs +0.20 with BOTH OOS halves down,
  # and (#3k) re-condemned it at all four horizons on the stress grid ("loses EVERY view it was
  # graded on. Do not re-propose."). `tests/ci-settings.yaml:776` even names this exact situation:
  # "A local settings.yaml overlay carrying `use_life_cagr: true` silently reverses all of this —
  # check yours." This is that overlay, one file over, and it is no longer silent.
  #
  # It is on because the alternative is worse for what this page IS. The page publishes the terminal's
  # #1, the terminal runs life-CAGR, and half-mirroring produced the BNB row above — a ranking on one
  # number printed beside another. One coherent-but-unvalidated ranking beats an incoherent one, and
  # the disclosure note now carries the caveat that the config cannot. Flip it here only together with
  # `config/settings.yaml`, never alone.
  use_life_cagr: true
  fixed_cagr_years: 20
